<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Texts and essays by Sakata Yushi."><title>TEXT｜SAKATA YUSHI</title>
<style>
*{box-sizing:border-box}:root{--bg:#E9E5DE;--text:rgba(34,34,34,.78);--sub:rgba(34,34,34,.48);--line:rgba(34,34,34,.16)}
body{margin:0;background:var(--bg);color:var(--text);font:400 11px/1.6 Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}
.site-header{position:fixed;inset:0 0 auto;width:100%;z-index:1000;background:rgba(233,229,222,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(34,34,34,.06)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:58px;padding:0 22px}.site-title{font-size:11px;letter-spacing:.08em;white-space:nowrap}.main-nav{display:flex;align-items:center;gap:18px}.main-nav a{font-size:10px;letter-spacing:.05em;color:var(--sub)}.main-nav a.active{color:#222;border-bottom:1px solid #222;padding-bottom:3px}
main{max-width:1120px;margin:0 auto;padding:92px 22px 76px}.page-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.1em}.count{font-size:9px;color:var(--sub);letter-spacing:.04em}.intro{margin:0 0 24px;color:var(--sub);font-size:10px}
.search{display:block;width:100%;margin:0 0 16px;padding:10px 0;border:0;border-bottom:1px solid var(--line);outline:none;background:transparent;color:var(--text);font:inherit}.search::placeholder{color:var(--sub)}
.text-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.text-card{min-height:190px;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(15px,2vw,24px);border:1px solid rgba(34,34,34,.13);background:rgba(255,255,255,.12);transition:background .15s ease}.text-card:hover{background:rgba(255,255,255,.3)}
.text-meta{display:flex;justify-content:space-between;gap:10px;color:var(--sub);font-size:9px;letter-spacing:.06em}.text-title{margin:28px 0 16px;font-size:clamp(15px,1.6vw,20px);line-height:1.7;font-weight:400;overflow-wrap:anywhere}.text-description{margin:0;color:var(--sub);font-size:10px;line-height:1.9}.text-more{align-self:flex-end;margin-top:22px;padding-bottom:3px;border-bottom:1px solid rgba(34,34,34,.35);font-size:9px;letter-spacing:.04em}
.empty{padding:20px 0;color:var(--sub)}.back-home{display:inline-block;margin-top:28px;color:var(--sub);font-size:10px}.footer{margin-top:60px;padding-top:14px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.06em}
@media(max-width:700px){.header-inner{min-height:52px;padding:0 14px}.site-title{font-size:10px}.main-nav{gap:12px}.main-nav a{font-size:9px}main{padding:76px 12px 60px}.text-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.text-card{min-height:190px;padding:14px}.text-title{font-size:15px;margin:22px 0 12px}}
@media(max-width:420px){.text-grid{grid-template-columns:1fr}.text-card{min-height:155px}}
</style></head><body>
<header class="site-header"><div class="header-inner"><a href="index.html" class="site-title">SAKATA YUSHI</a><nav class="main-nav" aria-label="Main navigation"><a href="archive.html">ARCHIVE</a><a href="text.html" class="active" aria-current="page">TEXT</a><a href="about.html">ABOUT</a></nav></div></header>
<main><div class="page-heading"><span>TEXT</span><span class="count" id="text-count">04 TEXTS</span></div><p class="intro">Texts and essays</p>
<input class="search" id="text-search" type="search" placeholder="SEARCH TEXT" aria-label="Search texts" autocomplete="off">
<section class="text-grid" id="text-grid" aria-live="polite"></section><p class="empty" id="text-empty" hidden>該当するテキストはありません。</p>
<a class="back-home" href="index.html">← HOME</a><footer class="footer">SAKATA YUSHI</footer></main>
<script>
const grid=document.getElementById('text-grid'),search=document.getElementById('text-search'),count=document.getElementById('text-count'),empty=document.getElementById('text-empty');let articles=[];
function render(){const q=search.value.trim().toLocaleLowerCase(),shown=articles.filter(a=>[a.title,a.description].filter(Boolean).join(' ').toLocaleLowerCase().includes(q));grid.innerHTML='';count.textContent=String(shown.length).padStart(2,'0')+' TEXTS';empty.hidden=shown.length!==0;shown.forEach((a,i)=>{const link=document.createElement('a');link.className='text-card';link.href=a.detailPage||'#';const meta=document.createElement('div');meta.className='text-meta';const label=document.createElement('span');label.textContent='TEXT / ESSAY';const num=document.createElement('span');num.textContent=String(i+1).padStart(2,'0');meta.append(label,num);const title=document.createElement('h2');title.className='text-title';title.textContent=a.title||'Untitled';const desc=document.createElement('p');desc.className='text-description';desc.textContent=a.description||'';const more=document.createElement('span');more.className='text-more';more.textContent='READ TEXT ↗';link.append(meta,title,desc,more);grid.appendChild(link)})}
search.addEventListener('input',render);fetch('articles.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{articles=data;render()}).catch(()=>{empty.hidden=false;empty.textContent='テキストを読み込めませんでした。'});
</script></body></html>

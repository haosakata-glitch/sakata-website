<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOK — SAKATA KATSUYUKI</title>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: #E9E5DE;
    color: rgba(34, 34, 34, 0.68);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font-family: inherit;
  }

  /* HEADER — index.htmlと共通 */

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    width: 100%;
    background: rgba(233, 229, 222, 0.68);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(34, 34, 34, 0.06);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    min-height: 58px;
    padding: 0 22px;
  }

  .site-title {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.08em;
    white-space: nowrap;
    color: rgba(34, 34, 34, 0.72);
  }

  .main-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    flex-wrap: nowrap;
    white-space: nowrap;
  }

  .main-nav a {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    height: 20px;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    font-family: inherit;
    font-size: 10px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.04em;
    white-space: nowrap;
    color: rgba(34, 34, 34, 0.48);
    text-decoration: none;
    text-underline-offset: 3px;
  }

  .main-nav a:hover {
    color: rgba(34, 34, 34, 0.72);
  }

  .main-nav a.active {
    color: #222222;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .main-nav a.about-link {
    margin-left: 10px;
    padding-left: 18px !important;
    border-left: 1px solid rgba(34, 34, 34, 0.14);
  }

  /* BOOK GRID */

  main {
    padding-top: 86px;
  }

  .book-section {
    padding: 0 22px 70px;
  }

  .book-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    column-gap: 18px;
    row-gap: 35px;
    align-items: start;
  }

  .book-item {
    display: block;
    min-width: 0;
  }

  .book-cover-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #ddd8d0;
  }

  .book-cover {
    display: block;
    width: 100%;
    height: auto;
  }

  .book-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(233, 229, 222, 0.86);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .book-item:hover .book-overlay,
  .book-item:focus-visible .book-overlay {
    opacity: 1;
  }

  .book-overlay-inner {
    text-align: center;
  }

  .book-title {
    font-size: 12px;
    line-height: 1.45;
  }

  .book-author {
    margin-top: 6px;
    font-size: 10px;
    line-height: 1.4;
    opacity: 0.65;
  }

  /* RESPONSIVE */

  @media (max-width: 1100px) {
    .book-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 16px;
      row-gap: 30px;
    }
  }

  @media (max-width: 900px) {
    .header-inner {
      padding-right: 18px;
      padding-left: 18px;
      gap: 18px;
    }

    .main-nav {
      gap: 14px;
    }

    .book-section {
      padding-right: 18px;
      padding-left: 18px;
    }

    .book-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 14px;
      row-gap: 28px;
    }
  }

  @media (max-width: 650px) {
    .header-inner {
      min-height: 52px;
      padding: 0 14px;
      gap: 15px;
    }

    .site-title {
      font-size: 10px;
    }

    .main-nav {
      gap: 10px;
      flex-wrap: nowrap;
    }

    .main-nav a {
      height: 18px;
      font-size: 9px;
    }

    .main-nav a.about-link {
      margin-left: 4px;
      padding-left: 10px !important;
      border-left: 1px solid rgba(34, 34, 34, 0.14);
    }

    main {
      padding-top: 72px;
    }

    .book-section {
      padding-right: 10px;
      padding-left: 10px;
    }

    .book-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 10px;
      row-gap: 24px;
    }
  }

  @media (hover: none) {
    .book-overlay {
      display: none;
    }
  }
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="site-title">
      SAKATA KATSUYUKI
    </a>

    <nav class="main-nav" aria-label="Archive categories">
      <a href="index.html">ALL</a>
      <a href="index.html?category=ARCHITECTURE">ARCHITECTURE</a>
      <a href="index.html?category=OBJECT">OBJECT</a>
      <a href="index.html?category=FOOD">FOOD</a>
      <a href="book.html" class="active" aria-current="page">BOOK</a>
      <a href="index.html?category=TEXT">TEXT</a>
      <a href="index.html?category=PHOTO">PHOTO</a>
      <a href="index.html?category=PLACE">PLACE</a>
      <a href="index.html?category=OTHER">OTHER</a>
      <a href="https://haosakata-glitch.github.io/sakata-website/about.html" class="about-link">ABOUT</a>
    </nav>

  </div>
</header>

<main>
  <section class="book-section">
    <div id="book-grid" class="book-grid"></div>
  </section>
</main>

<script>
  const bookGrid = document.getElementById("book-grid");

  fetch("archive-data.json")
    .then(response => {
      if (!response.ok) {
        throw new Error("archive-data.json could not be loaded.");
      }
      return response.json();
    })
    .then(data => {
      const books = Array.isArray(data)
        ? data.filter(item => item.category === "BOOK")
        : [];

      books.forEach(item => {
        const link = document.createElement("a");
        link.className = "book-item";
        link.href = item.detailPage || "#";

        const coverWrap = document.createElement("div");
        coverWrap.className = "book-cover-wrap";

        const image = document.createElement("img");
        image.className = "book-cover";
        image.src = item.coverImage || item.image;
        image.alt = item.bookTitle || item.title || "";
        image.loading = "lazy";

        const overlay = document.createElement("div");
        overlay.className = "book-overlay";

        const overlayInner = document.createElement("div");
        overlayInner.className = "book-overlay-inner";

        const title = document.createElement("div");
        title.className = "book-title";
        title.textContent = item.bookTitle || item.title || "";

        const author = document.createElement("div");
        author.className = "book-author";

        if (Array.isArray(item.authors)) {
          author.textContent = item.authors.join(" / ");
        } else {
          author.textContent = item.authors || "";
        }

        overlayInner.appendChild(title);

        if (author.textContent.trim()) {
          overlayInner.appendChild(author);
        }

        overlay.appendChild(overlayInner);
        coverWrap.appendChild(image);
        coverWrap.appendChild(overlay);
        link.appendChild(coverWrap);
        bookGrid.appendChild(link);
      });
    })
    .catch(error => {
      console.error(error);
      bookGrid.innerHTML = "<p>Books could not be loaded.</p>";
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOOK | SAKATA KATSUYUKI</title>

  <style>

    :root {
      --background: #E9E5DE;
      --text: #24231F;
      --secondary: #77736B;

      --cabinet: #B7B1A8;
      --cabinet-dark: #8B857C;
      --cabinet-light: #CEC9C1;
      --back: #D5D0C8;

      --shelf-line: #777169;
      --paper: #F1EEE8;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;

      background:
        var(--background);

      color:
        var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-weight: 300;
    }


    /* ========================================
       HEADER
       ======================================== */

    header {

      position: fixed;

      top: 0;
      left: 0;

      z-index: 100;

      width: 100%;
      min-height: 54px;

      padding:
        0 24px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 18px;

      background:
        rgba(233, 229, 222, .88);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);
    }


    header a {
      color:
        var(--text);

      text-decoration:
        none;
    }


    .header-left {

      display: flex;

      align-items: center;

      gap: 25px;

      min-width: 0;

      flex: 1;
    }


    .site-title {

      flex-shrink: 0;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: .035em;

      white-space: nowrap;
    }


    .category-nav {

      display: flex;

      align-items: center;

      gap: 15px;

      min-width: 0;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .category-nav::-webkit-scrollbar {
      display: none;
    }


    .header-category {

      flex-shrink: 0;

      color:
        var(--secondary);

      font-size: 9px;

      font-weight: 300;

      letter-spacing: .035em;

      white-space: nowrap;
    }


    .header-category.book {
      color:
        var(--text);
    }


    .about-link {

      flex-shrink: 0;

      padding-left: 14px;

      border-left:
        1px solid #CBC5BB;

      font-size: 10px;

      white-space: nowrap;
    }


    /* ========================================
       PAGE
       ======================================== */

    main {

      min-height: 100vh;

      padding:
        92px 24px 80px;
    }


    .page-head {

      max-width: 1300px;

      margin:
        0 auto 34px;
    }


    .page-label {

      margin-bottom: 7px;

      color:
        var(--secondary);

      font-size: 8px;

      letter-spacing: .12em;
    }


    h1 {

      margin: 0;

      font-size: 22px;

      font-weight: 400;

      letter-spacing: .01em;
    }


    .book-count {

      margin-top: 8px;

      color:
        var(--secondary);

      font-size: 9px;

      letter-spacing: .04em;
    }


    /* ========================================
       BOOKCASE
       ======================================== */

    .bookcase-wrap {

      width: 100%;

      display: flex;

      justify-content: center;
    }


    .bookcase {

      position: relative;

      width: min(
        1180px,
        calc(100vw - 70px)
      );

      /*
        本棚全体の高さを固定。
        これによって家具としての全形が
        一画面に収まりやすくなる。
      */

      height: min(
        720px,
        calc(100vh - 190px)
      );

      min-height: 560px;

      background:
        var(--back);

      /*
        外周のフレーム
      */

      border:
        16px solid var(--cabinet-dark);

      box-shadow:
        0 18px 30px
        rgba(55, 50, 44, .14),

        inset 0 0 0 1px
        rgba(255,255,255,.25);
    }


    /*
      背板
    */

    .bookcase-back {

      position: absolute;

      inset: 16px;

      background:
        linear-gradient(
          to right,
          rgba(255,255,255,.12),
          transparent 4%,
          transparent 96%,
          rgba(0,0,0,.05)
        );

      border:
        1px solid
        rgba(100,95,88,.12);

      z-index: 1;
    }


    /*
      本棚内部
    */

    .shelves {

      position: absolute;

      inset:
        16px;

      z-index: 2;

      display: grid;

      grid-template-rows:
        repeat(3, 1fr);

      gap: 0;
    }


    /* ========================================
       SHELF
       ======================================== */

    .shelf {

      position: relative;

      display: grid;

      grid-template-columns:
        repeat(8, minmax(0, 1fr));

      align-items: end;

      gap: 16px;

      padding:
        24px 26px 20px;

      /*
        棚板そのもの
      */

      border-bottom:
        18px solid
        var(--cabinet);

      box-shadow:
        inset 0 -3px 0
        var(--cabinet-light),

        0 4px 0
        var(--cabinet-dark);
    }


    /*
      一番上の空間だけ少し余白を取る
    */

    .shelf:first-child {
      padding-top: 28px;
    }


    /*
      最下段の床
    */

    .shelf:last-child {
      border-bottom:
        22px solid
        var(--cabinet);

      box-shadow:
        inset 0 -3px 0
        var(--cabinet-light),

        0 5px 0
        var(--cabinet-dark);
    }


    /* ========================================
       BOOK
       ======================================== */

    .book {

      position: relative;

      height: 100%;

      min-width: 0;

      display: flex;

      align-items: flex-end;

      justify-content: center;
    }


    .book-link {

      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      text-decoration:
        none;
    }


    .book-cover {

      display: block;

      width: auto;

      max-width: 100%;

      height: min(
        190px,
        78%
      );

      object-fit:
        contain;

      object-position:
        bottom center;

      background:
        var(--paper);

      box-shadow:
        2px 3px 5px
        rgba(40,36,31,.18);

      transition:
        transform .16s ease,
        box-shadow .16s ease;
    }


    .book-link:hover
    .book-cover {

      transform:
        translateY(-6px);

      box-shadow:
        4px 9px 12px
        rgba(40,36,31,.20);
    }


    /*
      書影がない場合の元写真
    */

    .book-cover.fallback {

      width: 105px;

      height: 175px;

      object-fit:
        cover;
    }


    /* ========================================
       BOOK INFORMATION
       ======================================== */

    .book-info {

      position: absolute;

      left: 0;
      right: 0;

      bottom: -17px;

      padding:
        0 2px;

      text-align:
        center;

      pointer-events:
        none;
    }


    .book-title {

      overflow:
        hidden;

      color:
        var(--text);

      font-size: 7px;

      line-height: 1.35;

      white-space:
        nowrap;

      text-overflow:
        ellipsis;
    }


    .book-author {

      margin-top: 2px;

      overflow:
        hidden;

      color:
        var(--secondary);

      font-size: 6px;

      line-height: 1.3;

      white-space:
        nowrap;

      text-overflow:
        ellipsis;
    }


    /* ========================================
       EMPTY
       ======================================== */

    .empty {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--secondary);

      font-size: 10px;
    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 900px) {

      main {

        padding:
          78px 14px 60px;
      }


      .page-head {

        margin-bottom: 25px;
      }


      .bookcase {

        width:
          calc(100vw - 32px);

        height:
          650px;

        min-height:
          0;

        border-width:
          11px;
      }


      .bookcase-back {

        inset:
          11px;
      }


      .shelves {

        inset:
          11px;
      }


      .shelf {

        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap:
          9px;

        padding:
          14px 12px 15px;

        border-bottom-width:
          13px;
      }


      .book-cover {

        height:
          155px;
      }


      .book-info {
        bottom:
          -13px;
      }

    }


    @media (max-width: 600px) {

      header {

        min-height:
          48px;

        padding:
          0 12px;

        gap:
          10px;
      }


      .header-left {

        gap:
          15px;
      }


      .site-title {
        font-size:
          10px;
      }


      .category-nav {
        gap:
          12px;
      }


      .header-category {
        font-size:
          8px;
      }


      .about-link {

        padding-left:
          10px;

        font-size:
          9px;
      }


      main {

        padding:
          72px 8px 45px;
      }


      .page-head {

        padding:
          0 4px;
      }


      h1 {
        font-size:
          20px;
      }


      .bookcase {

        width:
          calc(100vw - 18px);

        height:
          560px;

        border-width:
          8px;
      }


      .bookcase-back {

        inset:
          8px;
      }


      .shelves {

        inset:
          8px;
      }


      .shelf {

        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap:
          5px;

        padding:
          10px 6px 11px;

        border-bottom-width:
          10px;
      }


      .book-cover {

        height:
          125px;

        box-shadow:
          1px 2px 4px
          rgba(40,36,31,.18);
      }


      .book-title {
        font-size:
          6px;
      }


      .book-author {
        font-size:
          5px;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       HEADER
       ======================================== -->

  <header>

    <div class="header-left">

      <a
        href="index.html"
        class="site-title"
      >
        SAKATA KATSUYUKI
      </a>


      <nav
        class="category-nav"
        aria-label="Archive categories"
      >

        <a
          class="header-category"
          href="index.html"
        >
          ALL
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          ARCHITECTURE
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          OBJECT
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          FOOD
        </a>

        <a
          class="header-category book"
          href="book.html"
        >
          BOOK
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          TEXT
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          PHOTO
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          PLACE
        </a>

        <a
          class="header-category"
          href="index.html"
        >
          OTHER
        </a>

      </nav>

    </div>


    <a
      href="about.html"
      class="about-link"
    >
      About
    </a>

  </header>


  <!-- ========================================
       CONTENT
       ======================================== -->

  <main>


    <div class="page-head">

      <div class="page-label">
        ARCHIVE
      </div>

      <h1>
        BOOK
      </h1>

      <div
        class="book-count"
        id="book-count"
      ></div>

    </div>


    <div class="bookcase-wrap">

      <section
        class="bookcase"
        id="bookcase"
      >

        <div class="bookcase-back"></div>

        <div
          class="shelves"
          id="shelves"
        ></div>

      </section>

    </div>


  </main>


  <script>

    /* ========================================
       Load books
       ======================================== */

    async function loadBooks() {

      const shelves =
        document.getElementById(
          "shelves"
        );


      const count =
        document.getElementById(
          "book-count"
        );


      try {

        const response =
          await fetch(
            "archive-data.json?v="
            + Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "archive-data.json could not be loaded."
          );

        }


        const archive =
          await response.json();


        const books =
          archive.filter(
            item =>
              item.category === "BOOK"
          );


        count.textContent =
          books.length
          + (
            books.length === 1
              ? " BOOK"
              : " BOOKS"
          );


        renderBooks(
          books,
          shelves
        );


      } catch (error) {

        console.error(error);


        shelves.innerHTML =
          `
            <div class="empty">
              Failed to load books.
            </div>
          `;
      }

    }


    /* ========================================
       Render
       ======================================== */

    function renderBooks(
      books,
      shelves
    ) {

      shelves.innerHTML =
        "";


      const booksPerShelf =
        window.innerWidth <= 900
          ? 4
          : 8;


      /*
        3段の本棚を常に作る。

        本が少なくても、
        「本棚そのもの」は3段の家具として
        表示される。
      */

      const shelfCount =
        Math.max(
          3,
          Math.ceil(
            books.length
            / booksPerShelf
          )
        );


      /*
        最大3段にする。
      */

      const visibleShelves =
        Math.min(
          3,
          shelfCount
        );


      for (
        let shelfIndex = 0;
        shelfIndex < visibleShelves;
        shelfIndex++
      ) {

        const shelf =
          document.createElement(
            "div"
          );


        shelf.className =
          "shelf";


        const start =
          shelfIndex
          * booksPerShelf;


        const shelfBooks =
          books.slice(
            start,
            start + booksPerShelf
          );


        shelfBooks.forEach(
          book => {

            const item =
              document.createElement(
                "div"
              );


            item.className =
              "book";


            const link =
              document.createElement(
                "a"
              );


            link.className =
              "book-link";


            link.href =
              book.detailPage;


            const image =
              document.createElement(
                "img"
              );


            image.className =
              "book-cover";


            const cover =
              book.coverImage
              || book.image;


            image.src =
              cover;


            image.alt =
              book.bookTitle
              || book.title
              || "BOOK";


            /*
              書影がない場合は
              元画像に戻す。
            */

            image.onerror =
              function() {

                if (
                  this.src.endsWith(
                    book.image
                  )
                ) {

                  return;
                }


                this.src =
                  book.image;


                this.classList.add(
                  "fallback"
                );

              };


            link.appendChild(
              image
            );


            /*
              情報
            */

            const info =
              document.createElement(
                "div"
              );


            info.className =
              "book-info";


            const title =
              document.createElement(
                "div"
              );


            title.className =
              "book-title";


            title.textContent =
              book.bookTitle
              || book.title
              || "";


            info.appendChild(
              title
            );


            if (
              Array.isArray(
                book.authors
              )
              &&
              book.authors.length
            ) {

              const author =
                document.createElement(
                  "div"
                );


              author.className =
                "book-author";


              author.textContent =
                book.authors.join(
                  " / "
                );


              info.appendChild(
                author
              );

            }


            link.appendChild(
              info
            );


            item.appendChild(
              link
            );


            shelf.appendChild(
              item
            );

          }
        );


        shelves.appendChild(
          shelf
        );

      }

    }


    /* ========================================
       Start
       ======================================== */

    loadBooks();


    let resizeTimer;


    window.addEventListener(
      "resize",
      function() {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            loadBooks,
            200
          );

      }
    );

  </script>


</body>

</html>

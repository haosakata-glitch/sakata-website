<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOOK | 坂田雄志</title>

  <meta
    name="description"
    content="坂田雄志の読書アーカイブ。"
  >


  <style>

    :root {
      --background: #E9E5DE;
      --text: #24231F;
      --secondary: #77736B;
      --line: #CBC5BB;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-weight: 300;

      color: var(--text);

      background:
        var(--background);
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* ------------------------------
       HEADER
    ------------------------------ */

    header {

      position: fixed;

      top: 0;
      left: 0;

      z-index: 100;

      width: 100%;
      height: 54px;

      padding:
        0 24px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      background:
        rgba(
          233,
          229,
          222,
          0.88
        );

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);
    }


    .site-title {

      font-size: 11px;

      font-weight: 600;

      letter-spacing:
        0.035em;
    }


    .header-right {

      display: flex;

      align-items: center;

      gap: 18px;
    }


    .archive-link {

      font-size: 10px;

      color:
        var(--secondary);
    }


    .about-link {

      padding-left: 14px;

      border-left:
        1px solid var(--line);

      font-size: 10px;
    }


    /* ------------------------------
       MAIN
    ------------------------------ */

    main {

      max-width: 1500px;

      margin:
        0 auto;

      padding:
        100px 24px 100px;
    }


    .page-header {

      display: flex;

      align-items:
        baseline;

      justify-content:
        space-between;

      margin-bottom:
        50px;

      padding-bottom:
        12px;

      border-bottom:
        1px solid var(--line);
    }


    .page-title {

      margin: 0;

      font-size: 12px;

      font-weight: 500;

      letter-spacing:
        0.08em;
    }


    .book-count {

      font-size: 9px;

      color:
        var(--secondary);

      letter-spacing:
        0.05em;
    }


    /* ------------------------------
       SHELVES
    ------------------------------ */

    .library {

      display: flex;

      flex-direction:
        column;

      gap: 65px;
    }


    .shelf {

      position: relative;

      display: grid;

      grid-template-columns:
        repeat(
          8,
          minmax(
            0,
            1fr
          )
        );

      column-gap: 18px;

      align-items:
        end;

      padding:
        0 10px 16px;

      border-bottom:
        1px solid
        var(--text);
    }


    .shelf::after {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      bottom: -5px;

      height: 4px;

      border-top:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);
    }


    /* ------------------------------
       BOOK
    ------------------------------ */

    .book {

      min-width: 0;

      display: flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        flex-end;
    }


    .book-cover-wrap {

      width: 100%;

      height: 250px;

      display: flex;

      align-items:
        flex-end;

      justify-content:
        center;
    }


    .book-cover {

      display: block;

      max-width: 100%;

      max-height: 250px;

      width: auto;

      height: auto;

      object-fit:
        contain;

      box-shadow:
        0 3px 7px
        rgba(
          36,
          35,
          31,
          0.15
        );

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .book:hover
    .book-cover {

      transform:
        translateY(-7px);

      box-shadow:
        0 8px 15px
        rgba(
          36,
          35,
          31,
          0.20
        );
    }


    .book-info {

      width: 100%;

      padding-top:
        10px;
    }


    .book-title {

      font-size: 8px;

      line-height:
        1.45;

      font-weight: 400;
    }


    .book-author {

      margin-top:
        3px;

      font-size: 7px;

      line-height:
        1.4;

      color:
        var(--secondary);
    }


    /* ------------------------------
       EMPTY
    ------------------------------ */

    .empty {

      padding:
        50px 0;

      font-size: 10px;

      color:
        var(--secondary);
    }


    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (
      max-width: 1100px
    ) {

      .shelf {

        grid-template-columns:
          repeat(
            6,
            minmax(
              0,
              1fr
            )
          );

        column-gap: 15px;
      }

    }


    @media (
      max-width: 700px
    ) {

      header {

        height: 48px;

        padding:
          0 12px;
      }


      .site-title {

        font-size: 10px;
      }


      .header-right {

        gap: 12px;
      }


      .archive-link,
      .about-link {

        font-size: 9px;
      }


      .about-link {

        padding-left:
          10px;
      }


      main {

        padding:
          76px 10px 70px;
      }


      .page-header {

        margin-bottom:
          35px;
      }


      .library {

        gap: 50px;
      }


      .shelf {

        grid-template-columns:
          repeat(
            4,
            minmax(
              0,
              1fr
            )
          );

        column-gap: 10px;

        padding:
          0 5px 12px;
      }


      .book-cover-wrap {

        height: 180px;
      }


      .book-cover {

        max-height:
          180px;
      }


      .book-info {

        padding-top:
          7px;
      }


      .book-title {

        font-size: 7px;
      }


      .book-author {

        font-size: 6px;
      }

    }

  </style>

</head>


<body>


  <header>

    <a
      href="index.html"
      class="site-title"
    >
      SAKATA KATSUYUKI
    </a>


    <div
      class="header-right"
    >

      <a
        href="index.html"
        class="archive-link"
      >
        Archive
      </a>


      <a
        href="about.html"
        class="about-link"
      >
        About
      </a>

    </div>

  </header>


  <main>


    <div
      class="page-header"
    >

      <h1
        class="page-title"
      >
        BOOK
      </h1>


      <div
        id="book-count"
        class="book-count"
      >
        0 BOOKS
      </div>

    </div>


    <div
      id="library"
      class="library"
    ></div>


  </main>


  <script>

    const library =
      document.getElementById(
        "library"
      );


    const bookCount =
      document.getElementById(
        "book-count"
      );


    async function loadBooks() {

      try {

        const archiveResponse =
          await fetch(
            "archive-data.json"
          );


        if (
          !archiveResponse.ok
        ) {

          throw new Error(
            "Archive data not found"
          );

        }


        const archive =
          await archiveResponse.json();


        const books =
          archive.filter(
            item =>
              item.category === "BOOK"
          );


        bookCount.textContent =
          `${books.length} BOOKS`;


        if (
          books.length === 0
        ) {

          library.innerHTML =
            '<div class="empty">まだ本がありません。</div>';

          return;
        }


        /*
          1棚あたり8冊
        */

        const shelfSize = 8;


        for (
          let i = 0;
          i < books.length;
          i += shelfSize
        ) {


          const shelf =
            document.createElement(
              "div"
            );


          shelf.className =
            "shelf";


          const shelfBooks =
            books.slice(
              i,
              i + shelfSize
            );


          shelfBooks.forEach(
            book => {


              const link =
                document.createElement(
                  "a"
                );


              link.className =
                "book";


              link.href =
                book.detailPage;


              const coverWrap =
                document.createElement(
                  "div"
                );


              coverWrap.className =
                "book-cover-wrap";


              const image =
                document.createElement(
                  "img"
                );


              image.className =
                "book-cover";


              /*
                Google Booksで
                書影が見つかった場合は
                coverImageを使用。

                見つからない場合は
                元の写真を使用。
              */

              image.src =
                book.coverImage ||
                book.image;


              image.alt =
                book.bookTitle ||
                book.title ||
                "";


              image.loading =
                "lazy";


              /*
                書影が存在しない場合は
                元画像へフォールバック
              */

              image.onerror =
                () => {

                  if (
                    image.src.indexOf(
                      book.image
                    ) === -1
                  ) {

                    image.src =
                      book.image;

                  }

                };


              coverWrap.appendChild(
                image
              );


              const info =
                document.createElement(
                  "div"
                );


              info.className =
                "book-info";


              const title =
                document.createElement(
                  "div"
                );


              title.className =
                "book-title";


              title.textContent =
                book.bookTitle ||
                book.title ||
                "";


              info.appendChild(
                title
              );


              if (
                book.authors &&
                book.authors.length
              ) {

                const author =
                  document.createElement(
                    "div"
                  );


                author.className =
                  "book-author";


                author.textContent =
                  book.authors.join(
                    " / "
                  );


                info.appendChild(
                  author
                );

              }


              link.appendChild(
                coverWrap
              );


              link.appendChild(
                info
              );


              shelf.appendChild(
                link
              );

            }
          );


          library.appendChild(
            shelf
          );

        }

      }


      catch (
        error
      ) {

        console.error(
          error
        );


        library.innerHTML =
          '<div class="empty">BOOKを読み込めませんでした。</div>';

      }

    }


    loadBooks();

  </script>


</body>

</html>

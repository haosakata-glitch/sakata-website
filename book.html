<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOOK | SAKATA KATSUYUKI</title>

  <style>
    :root {
      --background: #E9E5DE;
      --text: #24231F;
      --secondary: #77736B;
      --line: #CBC5BB;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      background: var(--background);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      height: 58px;
      padding: 0 28px;

      background: rgba(233, 229, 222, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .site-title {
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .header-category {
      border: 0;
      padding: 0;

      background: none;
      color: var(--secondary);

      font-family: inherit;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.08em;

      cursor: pointer;
      white-space: nowrap;
    }

    .header-category.active {
      color: var(--text);
    }

    .about-link {
      margin-left: 8px;
      padding-left: 22px;
      border-left: 1px solid var(--line);
    }

    /* =========================
       PAGE
    ========================= */

    main {
      padding: 94px 28px 70px;
    }

    .page-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;

      margin-bottom: 32px;
    }

    .page-title {
      margin: 0;

      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .book-count {
      color: var(--secondary);

      font-size: 10px;
      letter-spacing: 0.08em;
    }

    /* =========================
       BOOK GRID
    ========================= */

    .book-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      column-gap: 18px;
      row-gap: 42px;
      align-items: start;
    }

    .book-item {
      display: block;
      min-width: 0;
    }

    .book-cover-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;

      background: #DED9D1;
    }

    .book-cover {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;

      transition:
        opacity 0.18s ease;
    }

    .book-item:hover .book-cover {
      opacity: 0.72;
    }

    .book-info {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;

      padding: 7px 8px;

      background: rgba(233, 229, 222, 0.92);

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.18s ease;
    }

    .book-item:hover .book-info {
      opacity: 1;
    }

    .book-title {
      margin: 0;

      color: var(--text);

      font-size: 10px;
      line-height: 1.35;
      letter-spacing: 0.02em;
    }

    .book-authors {
      margin-top: 3px;

      color: var(--secondary);

      font-size: 9px;
      line-height: 1.35;
    }

    /* =========================
       LOADING / EMPTY
    ========================= */

    .status {
      color: var(--secondary);

      font-size: 10px;
      letter-spacing: 0.04em;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {
      .book-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        column-gap: 16px;
      }
    }

    @media (max-width: 760px) {
      .site-header {
        height: 54px;
        padding: 0 18px;
      }

      .site-title {
        font-size: 12px;
      }

      .header-right {
        gap: 13px;
      }

      .header-category {
        font-size: 9px;
      }

      .about-link {
        margin-left: 2px;
        padding-left: 13px;
      }

      main {
        padding: 82px 18px 50px;
      }

      .page-heading {
        margin-bottom: 24px;
      }

      .book-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        column-gap: 12px;
        row-gap: 28px;
      }

      .book-info {
        left: 5px;
        right: 5px;
        bottom: 5px;
        padding: 5px 6px;
      }

      .book-title {
        font-size: 8px;
      }

      .book-authors {
        font-size: 7px;
      }
    }

    @media (max-width: 480px) {
      .header-right {
        gap: 9px;
      }

      .header-category {
        font-size: 8px;
      }

      .about-link {
        padding-left: 9px;
      }

      main {
        padding-left: 12px;
        padding-right: 12px;
      }

      .book-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 9px;
        row-gap: 24px;
      }

      .book-info {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <a href="index.html" class="site-title">
      SAKATA KATSUYUKI
    </a>

    <nav class="header-right">

      <a href="index.html" class="header-category">
        ALL
      </a>

      <a href="index.html?category=ARCHITECTURE" class="header-category">
        ARCHITECTURE
      </a>

      <a href="index.html?category=OBJECT" class="header-category">
        OBJECT
      </a>

      <a href="index.html?category=FOOD" class="header-category">
        FOOD
      </a>

      <a href="book.html" class="header-category active">
        BOOK
      </a>

      <a href="index.html?category=TEXT" class="header-category">
        TEXT
      </a>

      <a href="index.html?category=PHOTO" class="header-category">
        PHOTO
      </a>

      <a href="index.html?category=PLACE" class="header-category">
        PLACE
      </a>

      <a href="index.html?category=OTHER" class="header-category">
        OTHER
      </a>

      <a href="index.html#about" class="header-category about-link">
        ABOUT
      </a>

    </nav>

  </header>


  <main>

    <div class="page-heading">
      <h1 class="page-title">BOOK</h1>
      <div class="book-count" id="bookCount"></div>
    </div>

    <div class="book-grid" id="bookGrid">
      <div class="status">Loading...</div>
    </div>

  </main>


  <script>

    const bookGrid = document.getElementById("bookGrid");
    const bookCount = document.getElementById("bookCount");


    function escapeHtml(value) {
      if (value === undefined || value === null) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function renderBooks(items) {

      const books = items.filter(item => {
        return item.category === "BOOK";
      });

      bookCount.textContent = `${books.length} BOOKS`;

      if (!books.length) {
        bookGrid.innerHTML = `
          <div class="status">
            No books yet.
          </div>
        `;
        return;
      }


      bookGrid.innerHTML = books.map(book => {

        const image =
          book.coverImage ||
          book.image ||
          "";

        const fallback =
          book.image ||
          "";

        const title =
          book.bookTitle ||
          book.title ||
          "";

        const authors =
          Array.isArray(book.authors)
            ? book.authors.join(", ")
            : (book.authors || "");


        return `
          <a
            class="book-item"
            href="${escapeHtml(book.detailPage || "#")}"
          >

            <div class="book-cover-wrap">

              <img
                class="book-cover"
                src="${escapeHtml(image)}"
                data-fallback="${escapeHtml(fallback)}"
                alt="${escapeHtml(title)}"
                loading="lazy"
              >

              <div class="book-info">

                <p class="book-title">
                  ${escapeHtml(title)}
                </p>

                ${
                  authors
                    ? `<div class="book-authors">
                        ${escapeHtml(authors)}
                       </div>`
                    : ""
                }

              </div>

            </div>

          </a>
        `;

      }).join("");


      document
        .querySelectorAll(".book-cover")
        .forEach(img => {

          img.addEventListener("error", () => {

            const fallback =
              img.dataset.fallback;

            if (
              fallback &&
              img.src !== new URL(
                fallback,
                window.location.href
              ).href
            ) {
              img.src = fallback;
            }

          });

        });

    }


    fetch(
      "archive-data.json?v=" +
      Date.now()
    )
      .then(response => {

        if (!response.ok) {
          throw new Error(
            "archive-data.json could not be loaded."
          );
        }

        return response.json();

      })
      .then(data => {

        renderBooks(data);

      })
      .catch(error => {

        console.error(error);

        bookGrid.innerHTML = `
          <div class="status">
            Could not load books.
          </div>
        `;

      });

  </script>

</body>
</html>

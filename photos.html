<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photos｜坂田雄志</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }


    /* Header */

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #111;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 18px;
    }

    .about-link {
      font-size: 14px;
    }


    /* Main */

    main {
      padding: 30px;
    }


    /* Page title */

    .page-title {
      margin-bottom: 50px;
    }

    .page-title-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;
      margin: 0;
    }


    /* Photo archive */

    .photos {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 20px;

    }


    /* Photo */

    .photo {

      display: block;

      color: #111;

      text-decoration: none;

    }

    .photo-image {

      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      display: block;

      margin-bottom: 10px;

    }

    .photo-info {

      font-size: 12px;

      color: #777;

      line-height: 1.6;

    }

    .photo:hover .photo-image {

      opacity: 0.7;

    }


    /* Back */

    .back {

      margin-top: 80px;

    }

    .back a {

      color: #111;

      text-decoration: none;

      font-size: 13px;

    }

    .back a:hover {

      opacity: 0.5;

    }


    /* Footer */

    footer {

      padding:
        100px
        30px
        30px;

      font-size: 12px;

      color: #666;

    }


    /* Tablet */

    @media (max-width: 900px) {

      .photos {

        grid-template-columns:
          repeat(3, 1fr);

      }

    }


    /* Mobile */

    @media (max-width: 600px) {

      header {

        padding:
          18px
          20px;

      }

      main {

        padding:
          20px;

      }

      .photos {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 15px;

      }

      h1 {

        font-size: 28px;

      }

    }

  </style>

</head>


<body>


  <!-- Header -->

  <header>

    <a
      href="index.html"
      class="site-title"
    >
      坂田雄志
    </a>

    <a
      href="about.html"
      class="about-link"
    >
      About
    </a>

  </header>



  <!-- Main -->

  <main>


    <!-- Page title -->

    <section class="page-title">

      <div class="page-title-label">
        ARCHIVE / PHOTO
      </div>

      <h1>
        Photos
      </h1>

    </section>



    <!-- Photo archive -->

    <section class="photos">


      <!-- Photo 01 -->

      <a
        href="photo-01.html"
        class="photo"
      >

        <img
          src="photo-01.jpg"
          alt=""
          class="photo-image"
        >

        <div class="photo-info">
          2026.10.07
        </div>

      </a>


      <!-- Photo 02 -->

      <a
        href="photo-02.html"
        class="photo"
      >

        <img
          src="photo-02.jpg"
          alt=""
          class="photo-image"
        >

        <div class="photo-info">
          2026.10.07
        </div>

      </a>


    </section>



    <!-- Back -->

    <p class="back">

      <a href="index.html">
        ← Archive
      </a>

    </p>


  </main>



  <!-- Footer -->

  <footer>

    © 坂田雄志

  </footer>


</body>
</html>

name: Verify GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        shell: bash
        run: |
          set -euo pipefail
          url="https://haosakata-glitch.github.io/sakata-website/"
          for attempt in $(seq 1 18); do
            echo "Checking published site (attempt ${attempt}/18)..."
            if curl --fail --silent --show-error --location --max-time 15 "$url" -o /tmp/published.html; then
              if grep -q "SAKATA KATSUYUKI" /tmp/published.html; then
                echo "Published site responds and contains the expected site title."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::GitHub Pages did not become available with the expected site title within 3 minutes."
          exit 1

      - name: Report deployment check
        if: always()
        shell: bash
        run: |
          {
            echo "## GitHub Pages publication check"
            echo ""
            echo "- Site: https://haosakata-glitch.github.io/sakata-website/"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Generate Archive v5

on:
  push:
    branches:
      - main
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.webp"
      - "*.html"
      - "index.html"
      - "archive-data.json"
      - ".github/workflows/generate-archive.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync image and HTML names
        shell: bash
        run: |
          set -e

          PREV=$(git rev-parse HEAD^ 2>/dev/null || true)

          if [ -z "$PREV" ]; then
            exit 0
          fi

          git diff --name-status -M "$PREV" HEAD | while IFS=$'\t' read -r STATUS OLD NEW; do
            if [[ "$STATUS" =~ ^R ]]; then

              OLD_EXT="${OLD##*.}"
              NEW_EXT="${NEW##*.}"

              OLD_EXT=$(echo "$OLD_EXT" | tr '[:upper:]' '[:lower:]')
              NEW_EXT=$(echo "$NEW_EXT" | tr '[:upper:]' '[:lower:]')

              if [[ "$OLD_EXT" =~ ^(jpg|jpeg|png|webp)$ ]] &&
                 [[ "$NEW_EXT" =~ ^(jpg|jpeg|png|webp)$ ]]; then

                OLD_STEM="${OLD%.*}"
                NEW_STEM="${NEW%.*}"

                OLD_HTML="${OLD_STEM}.html"
                NEW_HTML="${NEW_STEM}.html"

                if [ -f "$OLD_HTML" ] && [ ! -f "$NEW_HTML" ]; then
                  mv "$OLD_HTML" "$NEW_HTML"

                  sed -i "s|${OLD}|${NEW}|g" "$NEW_HTML"
                  sed -i "s|${OLD##*/}|${NEW##*/}|g" "$NEW_HTML"
                fi
              fi
            fi

            if [ "$STATUS" = "D" ]; then
              EXT="${OLD##*.}"
              EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')

              if [[ "$EXT" =~ ^(jpg|jpeg|png|webp)$ ]]; then
                STEM="${OLD%.*}"
                HTML="${STEM}.html"

                if [ -f "$HTML" ]; then
                  rm "$HTML"
                fi
              fi
            fi
          done

      - name: Create missing detail pages
        shell: bash
        run: |
          set -e

          for IMAGE in *.jpg *.jpeg *.png *.webp; do
            [ -f "$IMAGE" ] || continue

            STEM="${IMAGE%.*}"
            HTML="${STEM}.html"

            if [ -f "$HTML" ]; then
              continue
            fi

            case "$STEM" in
              work-*)
                CATEGORY="ARCHITECTURE"
                ;;
              object-*)
                CATEGORY="OBJECT"
                ;;
              food-*)
                CATEGORY="FOOD"
                ;;
              book-*)
                CATEGORY="BOOK"
                ;;
              text-*)
                CATEGORY="TEXT"
                ;;
              photo-*)
                CATEGORY="PHOTO"
                ;;
              place-*)
                CATEGORY="PLACE"
                ;;
              *)
                CATEGORY="PHOTO"
                ;;
            esac

            TITLE="$STEM"

            cat > "$HTML" <<EOF
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${TITLE}</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 30px;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 16px;
    }

    .about {
      font-size: 14px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 70px 30px 120px;
    }

    .category {
      font-size: 12px;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      margin: 0 0 40px;
    }

    .image {
      width: 100%;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back {
      font-size: 14px;
    }

    .back a {
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="site-title">坂田雄志</a>
    <a href="about.html" class="about">About</a>
  </header>

  <main>
    <div class="category">${CATEGORY}</div>
    <h1>${TITLE}</h1>

    <div class="image">
      <img src="${IMAGE}" alt="${TITLE}">
    </div>

    <div class="back">
      <a href="index.html">← Archive</a>
    </div>
  </main>
</body>
</html>
EOF
          done

      - name: Update image references
        shell: bash
        run: |
          set -e

          for HTML in *.html; do
            [ -f "$HTML" ] || continue

            STEM="${HTML%.html}"

            for EXT in jpg jpeg png webp; do
              IMAGE="${STEM}.${EXT}"

              if [ -f "$IMAGE" ]; then
                CURRENT_IMAGE=$(grep -oE 'src="[^"]+"' "$HTML" | head -1 | sed 's/src="//;s/"//' || true)

                if [ "$CURRENT_IMAGE" != "$IMAGE" ]; then
                  if [ -n "$CURRENT_IMAGE" ]; then
                    sed -i "0|src=\"[^\"]*\"|s|src=\"[^\"]*\"|src=\"${IMAGE}\"|" "$HTML"
                  fi
                fi

                break
              fi
            done
          done

      - name: Generate archive-data.json
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import glob
          import os
          import re

          CATEGORY_MAP = {
              "work-": "ARCHITECTURE",
              "object-": "OBJECT",
              "food-": "FOOD",
              "book-": "BOOK",
              "text-": "TEXT",
              "photo-": "PHOTO",
              "place-": "PLACE",
          }

          extensions = ("*.jpg", "*.jpeg", "*.png", "*.webp")
          images = []

          for ext in extensions:
              images.extend(glob.glob(ext))

          images = sorted(set(images))

          archive = []

          for image in images:
              stem = os.path.splitext(os.path.basename(image))[0]
              detail_page = stem + ".html"

              category = "PHOTO"

              for prefix, value in CATEGORY_MAP.items():
                  if stem.startswith(prefix):
                      category = value
                      break

              title = stem

              if os.path.exists(detail_page):
                  with open(detail_page, "r", encoding="utf-8") as f:
                      html = f.read()

                  match = re.search(r"<h1[^>]*>(.*?)</h1>", html, re.S | re.I)

                  if match:
                      title = re.sub(r"<[^>]+>", "", match.group(1)).strip()

              archive.append({
                  "image": image,
                  "detailPage": detail_page,
                  "category": category,
                  "title": title
              })

          with open("archive-data.json", "w", encoding="utf-8") as f:
              json.dump(
                  archive,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update archive"
          git push

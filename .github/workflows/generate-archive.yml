name: Generate Archive v6

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ----------------------------------------
      # 1. 画像の名前変更に合わせてHTMLも変更
      # ----------------------------------------

      - name: Sync renamed images and HTML files
        shell: bash
        run: |
          set -e

          PREV=$(git rev-parse HEAD^ 2>/dev/null || true)

          if [ -z "$PREV" ]; then
            exit 0
          fi

          git diff --name-status -M "$PREV" HEAD > /tmp/changes.txt

          while IFS=$'\t' read -r STATUS OLD NEW; do

            if [[ "$STATUS" =~ ^R ]]; then

              OLD_EXT="${OLD##*.}"
              NEW_EXT="${NEW##*.}"

              OLD_EXT=$(echo "$OLD_EXT" | tr '[:upper:]' '[:lower:]')
              NEW_EXT=$(echo "$NEW_EXT" | tr '[:upper:]' '[:lower:]')

              if [[ "$OLD_EXT" =~ ^(jpg|jpeg|png|webp)$ ]] &&
                 [[ "$NEW_EXT" =~ ^(jpg|jpeg|png|webp)$ ]]; then

                OLD_STEM="${OLD%.*}"
                NEW_STEM="${NEW%.*}"

                OLD_HTML="${OLD_STEM}.html"
                NEW_HTML="${NEW_STEM}.html"

                echo "Image renamed:"
                echo "  $OLD"
                echo "  $NEW"

                if [ -f "$OLD_HTML" ]; then

                  if [ ! -f "$NEW_HTML" ]; then
                    mv "$OLD_HTML" "$NEW_HTML"

                    echo "HTML renamed:"
                    echo "  $OLD_HTML"
                    echo "  $NEW_HTML"
                  fi

                  if [ -f "$NEW_HTML" ]; then

                    sed -i \
                      "s|${OLD##*/}|${NEW##*/}|g" \
                      "$NEW_HTML"

                    sed -i \
                      "s|${OLD}|${NEW}|g" \
                      "$NEW_HTML"

                  fi

                fi

              fi

            fi

          done < /tmp/changes.txt


      # ----------------------------------------
      # 2. 画像に対応するHTMLがなければ作成
      # ----------------------------------------

      - name: Create missing detail pages
        shell: bash
        run: |
          set -e

          for IMAGE in *.jpg *.jpeg *.png *.webp; do

            [ -f "$IMAGE" ] || continue

            STEM="${IMAGE%.*}"
            HTML="${STEM}.html"

            if [ -f "$HTML" ]; then
              continue
            fi

            case "$STEM" in

              work-*)
                CATEGORY="ARCHITECTURE"
                ;;

              object-*)
                CATEGORY="OBJECT"
                ;;

              food-*)
                CATEGORY="FOOD"
                ;;

              book-*)
                CATEGORY="BOOK"
                ;;

              text-*)
                CATEGORY="TEXT"
                ;;

              photo-*)
                CATEGORY="PHOTO"
                ;;

              place-*)
                CATEGORY="PLACE"
                ;;

              *)
                CATEGORY="PHOTO"
                ;;

            esac

            TITLE="$STEM"

            cat > "$HTML" <<EOF
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>${TITLE}</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 30px;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 16px;
    }

    .about {
      font-size: 14px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 70px 30px 120px;
    }

    .category {
      font-size: 12px;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      margin: 0 0 40px;
    }

    .image {
      width: 100%;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back {
      font-size: 14px;
    }

    .back a {
      color: #111;
      text-decoration: none;
    }

  </style>

</head>

<body>

  <header>

    <a
      href="index.html"
      class="site-title"
    >
      坂田雄志
    </a>

    <a
      href="about.html"
      class="about"
    >
      About
    </a>

  </header>


  <main>

    <div class="category">
      ${CATEGORY}
    </div>

    <h1>
      ${TITLE}
    </h1>

    <div class="image">

      <img
        src="${IMAGE}"
        alt="${TITLE}"
      >

    </div>

    <div class="back">

      <a href="index.html">
        ← Archive
      </a>

    </div>

  </main>

</body>

</html>
EOF

            echo "Created: $HTML"

          done


      # ----------------------------------------
      # 3. HTML内の画像リンクを自動修正
      # ----------------------------------------

      - name: Update HTML image references
        shell: bash
        run: |
          set -e

          for HTML in *.html; do

            [ -f "$HTML" ] || continue

            STEM="${HTML%.html}"

            for EXT in jpg jpeg png webp; do

              IMAGE="${STEM}.${EXT}"

              if [ -f "$IMAGE" ]; then

                python3 - "$HTML" "$IMAGE" <<'PY'

import sys
import re

html_file = sys.argv[1]
image_file = sys.argv[2]

with open(
    html_file,
    "r",
    encoding="utf-8"
) as f:
    html = f.read()

html = re.sub(
    r'<img([^>]+)src="[^"]*"',
    lambda m:
        f'<img{m.group(1)}src="{image_file}"',
    html,
    count=1
)

with open(
    html_file,
    "w",
    encoding="utf-8"
) as f:
    f.write(html)

PY

                break

              fi

            done

          done


      # ----------------------------------------
      # 4. archive-data.jsonを自動生成
      # ----------------------------------------

      - name: Generate archive-data.json
        shell: bash
        run: |

          python3 <<'PY'

import json
import glob
import os
import re


CATEGORY_MAP = {

    "work-": "ARCHITECTURE",
    "object-": "OBJECT",
    "food-": "FOOD",
    "book-": "BOOK",
    "text-": "TEXT",
    "photo-": "PHOTO",
    "place-": "PLACE",

}


images = []


for pattern in [
    "*.jpg",
    "*.jpeg",
    "*.png",
    "*.webp"
]:

    images.extend(
        glob.glob(pattern)
    )


images = sorted(
    set(images)
)


archive = []


for image in images:

    filename = os.path.basename(image)

    stem = os.path.splitext(
        filename
    )[0]

    detail_page = (
        stem + ".html"
    )

    category = "PHOTO"


    for prefix, value in CATEGORY_MAP.items():

        if stem.startswith(prefix):

            category = value

            break


    title = stem


    if os.path.exists(
        detail_page
    ):

        with open(
            detail_page,
            "r",
            encoding="utf-8"
        ) as f:

            html = f.read()


        match = re.search(
            r"<h1[^>]*>(.*?)</h1>",
            html,
            re.S | re.I
        )


        if match:

            title = re.sub(
                r"<[^>]+>",
                "",
                match.group(1)
            ).strip()


    archive.append({

        "image": filename,

        "detailPage": detail_page,

        "category": category,

        "title": title

    })


with open(
    "archive-data.json",
    "w",
    encoding="utf-8"
) as f:

    json.dump(
        archive,
        f,
        ensure_ascii=False,
        indent=2
    )

    f.write("\n")


print(
    f"Generated archive-data.json with {len(archive)} items."
)

PY


      # ----------------------------------------
      # 5. 変更をGitHubに保存
      # ----------------------------------------

      - name: Commit generated files
        shell: bash
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add .


          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi


          git commit \
            -m "Update archive"


          git push

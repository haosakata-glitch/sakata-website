name: Generate Archive v3

on:
  push:
    branches:
      - main
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      - '**.html'
      - 'index.html'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename detail pages when image names change
        run: |
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          try:
              previous = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"],
                  text=True
              ).strip()
          except subprocess.CalledProcessError:
              previous = None

          if previous:
              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--name-status",
                      "-M",
                      previous,
                      "HEAD"
                  ],
                  capture_output=True,
                  text=True
              )

              lines = result.stdout.splitlines()

              for line in lines:
                  parts = line.split("\t")

                  if not parts:
                      continue

                  status = parts[0]

                  # 画像ファイルの名前変更
                  if status.startswith("R") and len(parts) >= 3:
                      old_name = parts[1]
                      new_name = parts[2]

                      old_path = Path(old_name)
                      new_path = Path(new_name)

                      if (
                          old_path.suffix.lower() in extensions
                          and new_path.suffix.lower() in extensions
                      ):
                          old_stem = old_path.stem
                          new_stem = new_path.stem

                          old_html = Path(f"{old_stem}.html")
                          new_html = Path(f"{new_stem}.html")

                          if old_html.exists():
                              old_html.rename(new_html)

                              # HTML内の画像ファイル名も変更
                              content = new_html.read_text(
                                  encoding="utf-8"
                              )

                              content = content.replace(
                                  old_name,
                                  new_name
                              )

                              new_html.write_text(
                                  content,
                                  encoding="utf-8"
                              )

                              print(
                                  f"Renamed: {old_html} -> {new_html}"
                              )

                  # 画像が削除された場合、
                  # 対応するHTMLも削除
                  elif status == "D" and len(parts) >= 2:
                      old_name = parts[1]
                      old_path = Path(old_name)

                      if old_path.suffix.lower() in extensions:
                          old_html = Path(
                              f"{old_path.stem}.html"
                          )

                          if old_html.exists():
                              old_html.unlink()

                              print(
                                  f"Deleted: {old_html}"
                              )

          PY

      - name: Generate detail pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          categories = {
              "work-": "ARCHITECTURE",
              "book-": "BOOK",
              "food-": "FOOD",
              "object-": "OBJECT",
              "place-": "PLACE",
              "text-": "TEXT",
              "photo-": "PHOTO",
          }

          for image in Path(".").iterdir():

              if not image.is_file():
                  continue

              if image.suffix.lower() not in extensions:
                  continue

              filename = image.name
              stem = image.stem

              category = "PHOTO"

              for prefix, value in categories.items():
                  if stem.lower().startswith(prefix):
                      category = value
                      break

              title = stem

              for prefix in categories:
                  if stem.lower().startswith(prefix):
                      title = stem[len(prefix):]
                      break

              title = title.replace("-", " ").replace("_", " ")
              title = html.escape(title)

              output = Path(f"{stem}.html")

              # 既存ページは上書きしない
              # → 手動で設定したタイトルや文章を維持
              if output.exists():
                  continue

              page_html = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>{title}｜坂田雄志</title>

            <style>
              body {{
                margin: 0;
                font-family: Arial, sans-serif;
                color: #111;
                background: #fff;
              }}

              header {{
                padding: 20px 30px;
                border-bottom: 1px solid #111;
                display: flex;
                justify-content: space-between;
                align-items: center;
              }}

              header a {{
                color: #111;
                text-decoration: none;
              }}

              .site-title {{
                font-size: 18px;
              }}

              .about-link {{
                font-size: 14px;
              }}

              main {{
                max-width: 1000px;
                margin: 0 auto;
                padding: 70px 30px 100px;
              }}

              .category {{
                font-size: 13px;
                color: #666;
                margin-bottom: 15px;
              }}

              h1 {{
                font-size: 36px;
                font-weight: normal;
                line-height: 1.4;
                margin: 0 0 15px;
              }}

              .main-image {{
                width: 100%;
                height: auto;
                display: block;
                margin-top: 40px;
              }}

              .back {{
                margin-top: 70px;
              }}

              .back a {{
                color: #111;
                text-decoration: none;
                font-size: 13px;
              }}

              @media (max-width: 600px) {{
                header {{
                  padding: 18px 20px;
                }}

                main {{
                  padding: 55px 20px 80px;
                }}

                h1 {{
                  font-size: 30px;
                }}
              }}
            </style>
          </head>

          <body>

          <header>
            <a href="index.html" class="site-title">坂田雄志</a>
            <a href="about.html" class="about-link">About</a>
          </header>

          <main>

            <div class="category">{category}</div>

            <h1>{title}</h1>

            <img
              src="{filename}"
              alt=""
              class="main-image"
            >

            <p class="back">
              <a href="index.html">← Archive</a>
            </p>

          </main>

          </body>
          </html>
          """

              output.write_text(
                  page_html,
                  encoding="utf-8"
              )

          PY

      - name: Generate archive data
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import json

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          categories = {
              "work-": "ARCHITECTURE",
              "book-": "BOOK",
              "food-": "FOOD",
              "object-": "OBJECT",
              "place-": "PLACE",
              "text-": "TEXT",
              "photo-": "PHOTO",
          }

          items = []

          for image in Path(".").iterdir():

              if not image.is_file():
                  continue

              if image.suffix.lower() not in extensions:
                  continue

              filename = image.name
              stem = image.stem

              category = "PHOTO"

              for prefix, value in categories.items():
                  if stem.lower().startswith(prefix):
                      category = value
                      break

              title = stem

              detail_page = Path(f"{stem}.html")

              if detail_page.exists():
                  page = detail_page.read_text(
                      encoding="utf-8"
                  )

                  match = re.search(
                      r"<h1[^>]*>(.*?)</h1>",
                      page,
                      re.IGNORECASE | re.DOTALL
                  )

                  if match:
                      title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      ).strip()

              items.append({
                  "image": filename,
                  "category": category,
                  "title": title,
                  "detailPage": f"{stem}.html"
              })

          items.sort(
              key=lambda item: item["image"].lower()
          )

          Path("archive-data.json").write_text(
              json.dumps(
                  items,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Update archive"

          git push

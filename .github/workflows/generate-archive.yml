name: Generate Archive v8

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate archive
        shell: python
        run: |
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path(".")
          image_extensions = {".jpg", ".jpeg", ".png", ".webp"}

          category_map = {
              "work-": "ARCHITECTURE",
              "object-": "OBJECT",
              "food-": "FOOD",
              "book-": "BOOK",
              "text-": "TEXT",
              "photo-": "PHOTO",
              "place-": "PLACE",
          }

          def category_for(stem):
              stem_lower = stem.lower()

              for prefix, category in category_map.items():
                  if stem_lower.startswith(prefix):
                      return category

              return "PHOTO"

          # --------------------------------------------------
          # 1. Detect renamed image files
          # --------------------------------------------------

          try:
              diff = subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-status",
                      "-M",
                      "HEAD^",
                      "HEAD"
                  ],
                  text=True
              )
          except subprocess.CalledProcessError:
              diff = ""

          for line in diff.splitlines():
              parts = line.split("\t")

              if len(parts) < 3:
                  continue

              status = parts[0]

              if not status.startswith("R"):
                  continue

              old_image = parts[1]
              new_image = parts[2]

              old_path = Path(old_image)
              new_path = Path(new_image)

              if old_path.suffix.lower() not in image_extensions:
                  continue

              if new_path.suffix.lower() not in image_extensions:
                  continue

              old_html = old_path.with_suffix(".html")
              new_html = new_path.with_suffix(".html")

              print("Image renamed:")
              print(" ", old_image)
              print(" ", new_image)

              if old_html.exists() and not new_html.exists():
                  old_html.rename(new_html)

                  print("HTML renamed:")
                  print(" ", old_html)
                  print(" ", new_html)

              if new_html.exists():
                  html = new_html.read_text(
                      encoding="utf-8"
                  )

                  html = html.replace(
                      old_path.name,
                      new_path.name
                  )

                  new_html.write_text(
                      html,
                      encoding="utf-8"
                  )

          # --------------------------------------------------
          # 2. Create missing detail pages
          # --------------------------------------------------

          for image in sorted(root.iterdir()):

              if not image.is_file():
                  continue

              if image.suffix.lower() not in image_extensions:
                  continue

              stem = image.stem
              html_file = root / f"{stem}.html"

              if html_file.exists():
                  continue

              category = category_for(stem)
              title = stem

              html = """<!DOCTYPE html>
          <html lang="ja">

          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>__TITLE__</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                color: #111;
                background: #fff;
              }

              header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 28px 30px;
              }

              header a {
                color: #111;
                text-decoration: none;
              }

              .site-title {
                font-size: 16px;
              }

              .about {
                font-size: 14px;
              }

              main {
                max-width: 1280px;
                margin: 0 auto;
                padding: 70px 30px 120px;
              }

              .category {
                font-size: 12px;
                margin-bottom: 14px;
                letter-spacing: 0.05em;
              }

              h1 {
                font-size: 32px;
                font-weight: 400;
                margin: 0 0 40px;
              }

              .image {
                width: 100%;
                max-width: 900px;
                margin-bottom: 40px;
              }

              .image img {
                display: block;
                width: 100%;
                height: auto;
              }

              .back {
                font-size: 14px;
              }

              .back a {
                color: #111;
                text-decoration: none;
              }
            </style>
          </head>

          <body>

            <header>
              <a href="index.html" class="site-title">坂田雄志</a>
              <a href="about.html" class="about">About</a>
            </header>

            <main>

              <div class="category">__CATEGORY__</div>

              <h1>__TITLE__</h1>

              <div class="image">
                <img src="__IMAGE__" alt="__TITLE__">
              </div>

              <div class="back">
                <a href="index.html">← Archive</a>
              </div>

            </main>

          </body>

          </html>
          """

              html = html.replace(
                  "__TITLE__",
                  title
              )

              html = html.replace(
                  "__CATEGORY__",
                  category
              )

              html = html.replace(
                  "__IMAGE__",
                  image.name
              )

              html_file.write_text(
                  html,
                  encoding="utf-8"
              )

              print("Created:", html_file)

          # --------------------------------------------------
          # 3. Update image references in all detail pages
          # --------------------------------------------------

          for html_file in root.glob("*.html"):

              if html_file.name == "index.html":
                  continue

              stem = html_file.stem

              for ext in image_extensions:

                  image = root / f"{stem}{ext}"

                  if not image.exists():
                      continue

                  html = html_file.read_text(
                      encoding="utf-8"
                  )

                  html = re.sub(
                      r'(<img[^>]*src=")[^"]*(")',
                      rf'\g<1>{image.name}\g<2>',
                      html,
                      count=1
                  )

                  html_file.write_text(
                      html,
                      encoding="utf-8"
                  )

                  break

          # --------------------------------------------------
          # 4. Generate archive-data.json
          # --------------------------------------------------

          archive = []

          for image in sorted(root.iterdir()):

              if not image.is_file():
                  continue

              if image.suffix.lower() not in image_extensions:
                  continue

              filename = image.name
              stem = image.stem
              detail_page = f"{stem}.html"

              category = category_for(stem)
              title = stem

              html_file = root / detail_page

              if html_file.exists():

                  html = html_file.read_text(
                      encoding="utf-8"
                  )

                  match = re.search(
                      r"<h1[^>]*>(.*?)</h1>",
                      html,
                      re.S | re.I
                  )

                  if match:
                      title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      ).strip()

              archive.append({
                  "image": filename,
                  "detailPage": detail_page,
                  "category": category,
                  "title": title
              })

          Path("archive-data.json").write_text(
              json.dumps(
                  archive,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Generated archive-data.json with {len(archive)} items."
          )

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update archive"
          git push

name: Generate Archive v11

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      # ========================================
      # 2. Install OCR
      # ========================================

      - name: Install OCR tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert


      # ========================================
      # 3. Generate Archive
      # ========================================

      - name: Generate archive
        shell: python
        run: |

          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path


          root = Path(".")

          image_extensions = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp"
          }


          category_map = {
              "architecture-": "ARCHITECTURE",
              "object-": "OBJECT",
              "work-": "OBJECT",
              "food-": "FOOD",
              "book-": "BOOK",
              "text-": "TEXT",
              "photo-": "PHOTO",
              "place-": "PLACE",
          }


          def category_for(stem):
              stem_lower = stem.lower()

              for prefix, category in category_map.items():
                  if stem_lower.startswith(prefix):
                      return category

              return "OTHER"


          # ========================================
          # 4. Detect renamed images
          # ========================================

          try:
              diff = subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-status",
                      "-M",
                      "HEAD^",
                      "HEAD"
                  ],
                  text=True
              )
          except subprocess.CalledProcessError:
              diff = ""


          for line in diff.splitlines():

              parts = line.split("\t")

              if len(parts) < 3:
                  continue

              if not parts[0].startswith("R"):
                  continue

              old_path = Path(parts[1])
              new_path = Path(parts[2])

              if old_path.suffix.lower() not in image_extensions:
                  continue

              if new_path.suffix.lower() not in image_extensions:
                  continue

              old_html = old_path.with_suffix(".html")
              new_html = new_path.with_suffix(".html")

              if old_html.exists() and not new_html.exists():
                  old_html.rename(new_html)

              if new_html.exists():

                  html = new_html.read_text(
                      encoding="utf-8"
                  )

                  html = html.replace(
                      old_path.name,
                      new_path.name
                  )

                  new_html.write_text(
                      html,
                      encoding="utf-8"
                  )


          # ========================================
          # 5. Shared design for detail pages
          # ========================================

          shared_css = """
          <style id="site-design">

            :root {
              --background: #E9E5DE;
              --text: #24231F;
              --secondary: #77736B;
              --line: #CBC5BB;
            }

            * {
              box-sizing: border-box;
            }

            body {
              margin: 0;
              font-family: Arial, Helvetica, sans-serif;
              font-weight: 300;
              color: var(--text);
              background: var(--background);
            }

            header {
              position: fixed;
              top: 0;
              left: 0;
              z-index: 100;
              width: 100%;
              min-height: 54px;
              padding: 0 24px;

              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 18px;

              background: rgba(233, 229, 222, 0.88);

              backdrop-filter: blur(10px);
              -webkit-backdrop-filter: blur(10px);
            }

            header a {
              color: var(--text);
              text-decoration: none;
            }

            .header-left {
              display: flex;
              align-items: center;
              gap: 25px;
              min-width: 0;
              flex: 1;
            }

            .site-title {
              flex-shrink: 0;
              font-size: 11px;
              font-weight: 600;
              letter-spacing: .035em;
              white-space: nowrap;
            }

            .category-nav {
              display: flex;
              align-items: center;
              gap: 15px;
              min-width: 0;
              overflow-x: auto;
              scrollbar-width: none;
            }

            .category-nav::-webkit-scrollbar {
              display: none;
            }

            .header-category {
              flex-shrink: 0;
              font-size: 9px;
              font-weight: 300;
              letter-spacing: .035em;
              color: var(--secondary);
              white-space: nowrap;
            }

            .about-link {
              flex-shrink: 0;
              padding-left: 14px;
              border-left: 1px solid var(--line);
              font-size: 10px;
              white-space: nowrap;
            }

            main {
              max-width: 1500px;
              margin: 0 auto;
              padding: 90px 24px 80px;
            }

            .category {
              margin-bottom: 7px;
              color: var(--secondary);
              font-size: 8px;
              letter-spacing: .075em;
            }

            h1 {
              margin: 0 0 24px;
              font-size: 18px;
              font-weight: 400;
              line-height: 1.5;
            }

            .image {
              width: 100%;
              max-width: 900px;
              margin: 0 0 35px;
            }

            .image img {
              display: block;
              width: 100%;
              height: auto;
            }

            .back {
              margin-top: 30px;
              font-size: 10px;
            }

            .back a {
              color: var(--secondary);
            }

            @media (max-width: 600px) {

              header {
                min-height: 48px;
                padding: 0 12px;
                gap: 10px;
              }

              .header-left {
                gap: 15px;
              }

              .site-title {
                font-size: 10px;
              }

              .category-nav {
                gap: 12px;
              }

              .header-category {
                font-size: 8px;
              }

              .about-link {
                padding-left: 10px;
                font-size: 9px;
              }

              main {
                padding: 76px 12px 60px;
              }

              h1 {
                font-size: 16px;
              }

            }

          </style>
          """


          categories = [
              "ALL",
              "ARCHITECTURE",
              "OBJECT",
              "FOOD",
              "BOOK",
              "TEXT",
              "PHOTO",
              "PLACE",
              "OTHER"
          ]


          header_html = """
          <header>

            <div class="header-left">

              <a
                href="index.html"
                class="site-title"
              >
                SAKATA KATSUYUKI
              </a>

              <nav
                class="category-nav"
                aria-label="Archive categories"
              >

          """ + "\n".join(
              f'<a class="header-category" href="index.html">{category}</a>'
              for category in categories
          ) + """

              </nav>

            </div>

            <a
              href="about.html"
              class="about-link"
            >
              About
            </a>

          </header>
          """


          # ========================================
          # 6. Create missing detail pages
          # ========================================

          for image in sorted(root.iterdir()):

              if not image.is_file():
                  continue

              if image.suffix.lower() not in image_extensions:
                  continue

              # Google Booksで取得した書影は除外
              if image.stem.startswith("book-cover-"):
                  continue

              stem = image.stem

              html_file = root / f"{stem}.html"

              if html_file.exists():
                  continue

              category = category_for(stem)

              html = """<!DOCTYPE html>
          <html lang="ja">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>__TITLE__ | 坂田雄志</title>

          </head>

          <body>

            <main>

              <div class="category">
                __CATEGORY__
              </div>

              <h1>
                __TITLE__
              </h1>

              <div class="image">

                <img
                  src="__IMAGE__"
                  alt="__TITLE__"
                >

              </div>

              <div class="back">

                <a href="index.html">
                  ← Archive
                </a>

              </div>

            </main>

          </body>

          </html>
          """

              html = html.replace(
                  "__TITLE__",
                  stem
              )

              html = html.replace(
                  "__CATEGORY__",
                  category
              )

              html = html.replace(
                  "__IMAGE__",
                  image.name
              )

              html_file.write_text(
                  html,
                  encoding="utf-8"
              )

              print(
                  "Created:",
                  html_file
              )


          # ========================================
          # 7. Update detail pages
          # ========================================

          for html_file in root.glob("*.html"):

              if html_file.name == "index.html":
                  continue

              if html_file.name == "book.html":
                  continue

              html = html_file.read_text(
                  encoding="utf-8"
              )

              stem = html_file.stem

              for ext in image_extensions:

                  image = root / f"{stem}{ext}"

                  if image.exists():

                      html = re.sub(
                          r'(<img\b[^>]*\bsrc=")[^"]*(")',
                          lambda m:
                              m.group(1)
                              + image.name
                              + m.group(2),
                          html,
                          count=1,
                          flags=re.I
                      )

                      break

              if re.search(
                  r"<header\b[^>]*>.*?</header>",
                  html,
                  re.I | re.S
              ):

                  html = re.sub(
                      r"<header\b[^>]*>.*?</header>",
                      lambda _: header_html,
                      html,
                      count=1,
                      flags=re.I | re.S
                  )

              else:

                  html = re.sub(
                      r"<body\b[^>]*>",
                      lambda m:
                          m.group(0)
                          + "\n"
                          + header_html,
                      html,
                      count=1,
                      flags=re.I
                  )

              html = re.sub(
                  r'<style id="site-design">.*?</style>',
                  "",
                  html,
                  flags=re.I | re.S
              )

              html = re.sub(
                  r"</head>",
                  lambda _:
                      shared_css
                      + "\n</head>",
                  html,
                  count=1,
                  flags=re.I
              )

              html_file.write_text(
                  html,
                  encoding="utf-8"
              )


          # ========================================
          # 8. BOOK metadata
          # ========================================

          metadata_path = root / "book-metadata.json"


          if metadata_path.exists():

              try:

                  book_metadata = json.loads(
                      metadata_path.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  book_metadata = {}

          else:

              book_metadata = {}


          def clean_ocr(text):

              text = text.replace(
                  "\x0c",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def get_ocr_candidates(text):

              text = clean_ocr(text)

              if not text:
                  return []

              candidates = []

              for line in text.split(" "):

                  line = line.strip()

                  line = re.sub(
                      r"[|¦_~＝=]+",
                      " ",
                      line
                  )

                  line = re.sub(
                      r"\s+",
                      " ",
                      line
                  )

                  if len(line) >= 2:
                      candidates.append(line)

              # 長いものを優先
              candidates.sort(
                  key=len,
                  reverse=True
              )

              # 重複除去
              result = []

              for candidate in candidates:

                  if candidate not in result:

                      result.append(candidate)

                  if len(result) >= 8:
                      break

              return result


          def google_books_search(query):

              if not query:
                  return None

              params = urllib.parse.urlencode(
                  {
                      "q": query,
                      "maxResults": 10,
                      "printType": "books",
                      "langRestrict": "ja"
                  }
              )

              url = (
                  "https://www.googleapis.com/books/v1/volumes?"
                  + params
              )

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

              except Exception as error:

                  print(
                      "Google Books error:",
                      error
                  )

                  return None

              items = data.get(
                  "items",
                  []
              )

              for item in items:

                  info = item.get(
                      "volumeInfo",
                      {}
                  )

                  title = info.get(
                      "title",
                      ""
                  )

                  image_links = info.get(
                      "imageLinks",
                      {}
                  )

                  cover = (
                      image_links.get("extraLarge")
                      or image_links.get("large")
                      or image_links.get("medium")
                      or image_links.get("small")
                      or image_links.get("thumbnail")
                      or image_links.get("smallThumbnail")
                  )

                  if not cover:
                      continue

                  return {
                      "title": title,
                      "authors": info.get(
                          "authors",
                          []
                      ),
                      "publisher": info.get(
                          "publisher",
                          ""
                      ),
                      "publishedDate": info.get(
                          "publishedDate",
                          ""
                      ),
                      "cover": cover,
                      "infoLink": info.get(
                          "infoLink",
                          ""
                      )
                  }

              return None


          def download_cover(
              cover_url,
              output_path
          ):

              if not cover_url:
                  return False

              cover_url = cover_url.replace(
                  "http://",
                  "https://"
              )

              try:

                  request = urllib.request.Request(
                      cover_url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = response.read()

                  output_path.write_bytes(
                      data
                  )

                  return True

              except Exception as error:

                  print(
                      "Cover download error:",
                      error
                  )

                  return False


          # ========================================
          # 9. Find BOOK images
          # ========================================

          book_images = []

          for image in sorted(
              root.iterdir()
          ):

              if not image.is_file():
                  continue

              if image.suffix.lower() not in image_extensions:
                  continue

              if image.stem.startswith(
                  "book-cover-"
              ):
                  continue

              if category_for(
                  image.stem
              ) != "BOOK":
                  continue

              book_images.append(
                  image
              )


          # ========================================
          # 10. OCR + Google Books
          # ========================================

          for image in book_images:

              key = image.name

              existing = book_metadata.get(
                  key,
                  {}
              )

              cover_filename = (
                  "book-cover-"
                  + image.stem
                  + ".jpg"
              )

              cover_path = (
                  root / cover_filename
              )


              # ------------------------------
              # OCR
              # ------------------------------

              ocr_base = (
                  root
                  / f".book-ocr-{image.stem}"
              )

              ocr_txt = Path(
                  str(ocr_base) + ".txt"
              )


              try:

                  subprocess.run(
                      [
                          "tesseract",
                          str(image),
                          str(ocr_base),
                          "-l",
                          "jpn+jpn_vert",
                          "--psm",
                          "11"
                      ],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  if ocr_txt.exists():

                      ocr_text = ocr_txt.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )

                  else:

                      ocr_text = ""

              except Exception as error:

                  print(
                      "OCR error:",
                      error
                  )

                  ocr_text = ""


              candidates = get_ocr_candidates(
                  ocr_text
              )


              # ファイル名も候補にする
              filename_query = re.sub(
                  r"^book[-_]",
                  "",
                  image.stem,
                  flags=re.I
              )

              if filename_query:
                  candidates.append(
                      filename_query
                  )


              print(
                  "================================"
              )

              print(
                  "BOOK:",
                  image.name
              )

              print(
                  "OCR candidates:",
                  candidates
              )


              # ------------------------------
              # Google Books search
              # ------------------------------

              result = None

              used_query = ""


              for query in candidates:

                  print(
                      "Searching:",
                      query
                  )

                  result = google_books_search(
                      query
                  )

                  if result is not None:

                      used_query = query

                      break


              # ------------------------------
              # Download cover
              # ------------------------------

              cover_image = ""

              if result is not None:

                  print(
                      "Found:",
                      result["title"]
                  )

                  if download_cover(
                      result["cover"],
                      cover_path
                  ):

                      cover_image = (
                          cover_filename
                      )

                      print(
                          "Cover saved:",
                          cover_filename
                      )

              else:

                  print(
                      "No Google Books result."
                  )


              # ------------------------------
              # Save metadata
              # ------------------------------

              if result is not None:

                  book_metadata[key] = {

                      "sourceImage":
                          image.name,

                      "coverImage":
                          cover_image,

                      "title":
                          result.get(
                              "title",
                              ""
                          ),

                      "authors":
                          result.get(
                              "authors",
                              []
                          ),

                      "publisher":
                          result.get(
                              "publisher",
                              ""
                          ),

                      "publishedDate":
                          result.get(
                              "publishedDate",
                              ""
                          ),

                      "infoLink":
                          result.get(
                              "infoLink",
                              ""
                          ),

                      "ocr":
                          used_query

                  }

              else:

                  book_metadata[key] = {

                      "sourceImage":
                          image.name,

                      "coverImage":
                          "",

                      "title":
                          existing.get(
                              "title",
                              image.stem
                          ),

                      "authors":
                          existing.get(
                              "authors",
                              []
                          ),

                      "publisher":
                          existing.get(
                              "publisher",
                              ""
                          ),

                      "publishedDate":
                          existing.get(
                              "publishedDate",
                              ""
                          ),

                      "infoLink":
                          existing.get(
                              "infoLink",
                              ""
                          ),

                      "ocr":
                          existing.get(
                              "ocr",
                              ""
                          )

                  }


              # OCR temporary file削除

              if ocr_txt.exists():

                  ocr_txt.unlink()


          # ========================================
          # 11. Save book metadata
          # ========================================

          metadata_path.write_text(
              json.dumps(
                  book_metadata,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          # ========================================
          # 12. Generate archive-data.json
          # ========================================

          archive = []


          for image in sorted(
              root.iterdir()
          ):

              if not image.is_file():
                  continue

              if image.suffix.lower() not in image_extensions:
                  continue

              # 書影は通常Archiveに出さない
              if image.stem.startswith(
                  "book-cover-"
              ):
                  continue

              stem = image.stem

              html_file = (
                  root / f"{stem}.html"
              )

              title = stem


              if html_file.exists():

                  html = html_file.read_text(
                      encoding="utf-8"
                  )

                  match = re.search(
                      r"<h1[^>]*>(.*?)</h1>",
                      html,
                      re.I | re.S
                  )

                  if match:

                      title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      ).strip()


              item = {
                  "image": image.name,
                  "detailPage": f"{stem}.html",
                  "category": category_for(stem),
                  "title": title
              }


              # BOOKだけ追加情報
              if category_for(stem) == "BOOK":

                  metadata = book_metadata.get(
                      image.name,
                      {}
                  )

                  if metadata.get(
                      "coverImage"
                  ):

                      item["coverImage"] = (
                          metadata[
                              "coverImage"
                          ]
                      )

                  if metadata.get(
                      "title"
                  ):

                      item["bookTitle"] = (
                          metadata[
                              "title"
                          ]
                      )

                  if metadata.get(
                      "authors"
                  ):

                      item["authors"] = (
                          metadata[
                              "authors"
                          ]
                      )


              archive.append(
                  item
              )


          Path(
              "archive-data.json"
          ).write_text(
              json.dumps(
                  archive,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          print(
              "Generated archive-data.json with",
              len(archive),
              "items."
          )


      # ========================================
      # 13. Commit generated files
      # ========================================

      - name: Commit generated files
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Update archive and book covers"

          git push

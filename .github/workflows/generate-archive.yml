name: Generate Archive v4

on:
  push:
    branches:
      - main
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      - '**.html'
      - 'index.html'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync image and HTML names
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          # 現在存在する画像
          images = {
              p.stem: p.name
              for p in Path(".").iterdir()
              if p.is_file() and p.suffix.lower() in extensions
          }

          # 現在存在するHTML
          html_files = {
              p.stem: p
              for p in Path(".").iterdir()
              if p.is_file()
              and p.suffix.lower() == ".html"
              and p.name != "index.html"
          }

          # Gitの変更履歴から、画像の名前変更を確認
          try:
              previous = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"],
                  text=True
              ).strip()
          except subprocess.CalledProcessError:
              previous = None

          if previous:
              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--name-status",
                      "-M",
                      previous,
                      "HEAD"
                  ],
                  capture_output=True,
                  text=True
              )

              for line in result.stdout.splitlines():

                  parts = line.split("\t")

                  if not parts:
                      continue

                  status = parts[0]

                  if status.startswith("R") and len(parts) >= 3:

                      old_name = parts[1]
                      new_name = parts[2]

                      old_path = Path(old_name)
                      new_path = Path(new_name)

                      if (
                          old_path.suffix.lower() in extensions
                          and new_path.suffix.lower() in extensions
                      ):

                          old_html = Path(
                              f"{old_path.stem}.html"
                          )

                          new_html = Path(
                              f"{new_path.stem}.html"
                          )

                          # HTMLが存在していて、新しい名前のHTMLがない場合
                          if (
                              old_html.exists()
                              and not new_html.exists()
                          ):
                              old_html.rename(new_html)

                              content = new_html.read_text(
                                  encoding="utf-8"
                              )

                              content = content.replace(
                                  old_name,
                                  new_name
                              )

                              new_html.write_text(
                                  content,
                                  encoding="utf-8"
                              )

                              print(
                                  f"HTML renamed: "
                                  f"{old_html} -> {new_html}"
                              )

          PY

      - name: Create missing detail pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          categories = {
              "work-": "ARCHITECTURE",
              "book-": "BOOK",
              "food-": "FOOD",
              "object-": "OBJECT",
              "place-": "PLACE",
              "text-": "TEXT",
              "photo-": "PHOTO",
          }

          for image in Path(".").iterdir():

              if not image.is_file():
                  continue

              if image.suffix.lower() not in extensions:
                  continue

              filename = image.name
              stem = image.stem

              output = Path(f"{stem}.html")

              if output.exists():
                  continue

              category = "PHOTO"

              for prefix, value in categories.items():
                  if stem.lower().startswith(prefix):
                      category = value
                      break

              title = stem

              for prefix in categories:
                  if stem.lower().startswith(prefix):
                      title = stem[len(prefix):]
                      break

              title = title.replace("-", " ")
              title = title.replace("_", " ")
              title = html.escape(title)

              page_html = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>{title}｜坂田雄志</title>

            <style>
              body {{
                margin: 0;
                font-family: Arial, sans-serif;
                color: #111;
                background: #fff;
              }}

              header {{
                padding: 20px 30px;
                border-bottom: 1px solid #111;
                display: flex;
                justify-content: space-between;
                align-items: center;
              }}

              header a {{
                color: #111;
                text-decoration: none;
              }}

              .site-title {{
                font-size: 18px;
              }}

              .about-link {{
                font-size: 14px;
              }}

              main {{
                max-width: 1000px;
                margin: 0 auto;
                padding: 70px 30px 100px;
              }}

              .category {{
                font-size: 13px;
                color: #666;
                margin-bottom: 15px;
              }}

              h1 {{
                font-size: 36px;
                font-weight: normal;
                line-height: 1.4;
                margin: 0 0 15px;
              }}

              .main-image {{
                width: 100%;
                height: auto;
                display: block;
                margin-top: 40px;
              }}

              .back {{
                margin-top: 70px;
              }}

              .back a {{
                color: #111;
                text-decoration: none;
                font-size: 13px;
              }}

              @media (max-width: 600px) {{
                header {{
                  padding: 18px 20px;
                }}

                main {{
                  padding: 55px 20px 80px;
                }}

                h1 {{
                  font-size: 30px;
                }}
              }}
            </style>
          </head>

          <body>

          <header>
            <a href="index.html" class="site-title">坂田雄志</a>
            <a href="about.html" class="about-link">About</a>
          </header>

          <main>

            <div class="category">{category}</div>

            <h1>{title}</h1>

            <img
              src="{filename}"
              alt=""
              class="main-image"
            >

            <p class="back">
              <a href="index.html">← Archive</a>
            </p>

          </main>

          </body>
          </html>
          """

              output.write_text(
                  page_html,
                  encoding="utf-8"
              )

              print(f"Created: {output}")

          PY

      - name: Update image references
        run: |
          python3 <<'PY'
          from pathlib import Path

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          images = [
              p.name
              for p in Path(".").iterdir()
              if p.is_file() and p.suffix.lower() in extensions
          ]

          for html_file in Path(".").glob("*.html"):

              if html_file.name == "index.html":
                  continue

              content = html_file.read_text(
                  encoding="utf-8"
              )

              for image in images:

                  stem = Path(image).stem

                  if f'src="{image}"' in content:
                      continue

                  # 同じHTML名の画像を参照
                  if html_file.stem == stem:

                      import re

                      content = re.sub(
                          r'src="[^"]+\.(jpg|jpeg|png|webp)"',
                          f'src="{image}"',
                          content,
                          count=1,
                          flags=re.IGNORECASE
                      )

                      html_file.write_text(
                          content,
                          encoding="utf-8"
                      )

          PY

      - name: Generate archive data
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import json

          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          categories = {
              "work-": "ARCHITECTURE",
              "book-": "BOOK",
              "food-": "FOOD",
              "object-": "OBJECT",
              "place-": "PLACE",
              "text-": "TEXT",
              "photo-": "PHOTO",
          }

          items = []

          for image in Path(".").iterdir():

              if not image.is_file():
                  continue

              if image.suffix.lower() not in extensions:
                  continue

              filename = image.name
              stem = image.stem

              category = "PHOTO"

              for prefix, value in categories.items():
                  if stem.lower().startswith(prefix):
                      category = value
                      break

              title = stem

              detail_page = Path(f"{stem}.html")

              if detail_page.exists():

                  page = detail_page.read_text(
                      encoding="utf-8"
                  )

                  match = re.search(
                      r"<h1[^>]*>(.*?)</h1>",
                      page,
                      re.IGNORECASE | re.DOTALL
                  )

                  if match:

                      title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      ).strip()

              items.append({
                  "image": filename,
                  "category": category,
                  "title": title,
                  "detailPage": f"{stem}.html"
              })

          items.sort(
              key=lambda item: item["image"].lower()
          )

          Path("archive-data.json").write_text(
              json.dumps(
                  items,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Sync archive"

          git push

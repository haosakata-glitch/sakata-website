name: Generate Archive v14

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install image optimization tools
        run: python -m pip install --upgrade Pillow

      - name: Optimize archive images
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path(".")
          output_dir = root / "assets" / "optimized"
          output_dir.mkdir(parents=True, exist_ok=True)
          extensions = {".jpg", ".jpeg", ".png", ".webp"}

          for source in sorted(root.iterdir()):
              if not source.is_file() or source.suffix.lower() not in extensions:
                  continue
              if source.stem.startswith("book-cover-"):
                  continue

              destination = output_dir / (source.stem + ".webp")
              try:
                  with Image.open(source) as original:
                      image = ImageOps.exif_transpose(original)
                      if image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                      image.thumbnail((2000, 2000), Image.Resampling.LANCZOS)
                      image.save(destination, "WEBP", quality=87, method=6)
                  print(f"Optimized {source.name} -> {destination} ({destination.stat().st_size:,} bytes)")
              except Exception as error:
                  print(f"Could not optimize {source.name}: {error}")
                  raise

      - name: Install OCR tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert

      - name: Generate archive
        shell: python
        run: |
          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from PIL import Image

          root = Path(".")
          image_extensions = {".jpg", ".jpeg", ".png", ".webp"}
          optimized_dir = root / "assets" / "optimized"

          def optimized_image_path(image):
              optimized = optimized_dir / (image.stem + ".webp")
              return optimized.as_posix() if optimized.exists() else image.name

          def captured_at(image):
              # Convert only after reading EXIF from the original image.
              try:
                  with Image.open(image) as source:
                      exif = source.getexif()
                      exif_ifd = exif.get_ifd(0x8769) if 0x8769 in exif else {}
                      raw = (
                          exif.get(0x9003)  # DateTimeOriginal
                          or exif_ifd.get(0x9003)
                          or exif.get(0x9004)  # DateTimeDigitized
                          or exif.get(0x0132)  # DateTime
                      )
                  if raw:
                      parsed = datetime.strptime(str(raw).strip(), "%Y:%m:%d %H:%M:%S")
                      return parsed.isoformat(timespec="seconds")
              except Exception as error:
                  print(f"Could not read capture date from {image.name}: {error}")
              return None

          category_map = {
              "architecture-": "ARCHITECTURE",
              "object-": "OBJECT",
              "work-": "OBJECT",
              "food-": "FOOD",
              "book-": "BOOK",
              "text-": "TEXT",
              "photo-": "PHOTO",
              "place-": "PLACE",
          }

          categories = [
              "ALL",
              "ARCHITECTURE",
              "OBJECT",
              "FOOD",
              "BOOK",
              "TEXT",
              "PHOTO",
              "PLACE",
              "OTHER",
          ]

          def category_for(stem):
              stem_lower = stem.lower()
              # 個別作品のカテゴリを上書き
              category_overrides = {
                  "work-01": "ARCHITECTURE",
              }
              if stem_lower in category_overrides:
                  return category_overrides[stem_lower]

              for prefix, category in category_map.items():
                  if stem_lower.startswith(prefix):
                      return category
              return "OTHER"

          # 共通ヘッダー
          header_html = """
          <header>
            <div class="header-left">
              <a href="index.html" class="site-title">SAKATA YUSHI</a>
              <nav class="category-nav" aria-label="Archive categories">
          """ + "\n".join(
              f'<a class="header-category category-{category}" href="index.html">{category}</a>'
              for category in categories
          ) + """
              </nav>
            </div>
            <a href="about.html" class="about-link">About</a>
          </header>
          """

          # 詳細ページ共通デザイン
          shared_css = """
          <style id="site-design">
            :root {
              --background: #E9E5DE;
              --text: #24231F;
              --secondary: #77736B;
              --line: #CBC5BB;
            }

            * {
              box-sizing: border-box;
            }

            body {
              margin: 0;
              font-family: Arial, Helvetica, sans-serif;
              font-weight: 300;
              color: var(--text);
              background: var(--background);
            }

            header {
              position: fixed;
              top: 0;
              left: 0;
              z-index: 100;
              width: 100%;
              min-height: 58px;
              padding: 0 22px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 30px;
              background: rgba(233, 229, 222, 0.88);
              backdrop-filter: blur(10px);
              -webkit-backdrop-filter: blur(10px);
            }

            header a {
              text-decoration: none;
            }

            .header-left {
              display: flex;
              align-items: center;
              gap: 30px;
              min-width: 0;
              flex: 1;
            }

            .site-title {
              flex: 0 0 auto;
              color: var(--text);
              font-size: 11px;
              font-weight: 600;
              letter-spacing: .035em;
              white-space: nowrap;
            }

            .category-nav {
              display: flex;
              align-items: center;
              gap: 18px;
              min-width: 0;
              overflow-x: auto;
              scrollbar-width: none;
            }

            .category-nav::-webkit-scrollbar {
              display: none;
            }

            .header-category {
              flex: 0 0 auto;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              height: 20px;
              padding: 0;
              color: rgba(34, 34, 34, 0.48);
              font-size: 10px;
              font-weight: 300;
              line-height: 1;
              letter-spacing: .04em;
              white-space: nowrap;
              border-bottom: 1px solid transparent;
            }

            .header-category.active {
              color: #222;
              border-bottom-color: #222;
            }

            .about-link {
              flex: 0 0 auto;
              display: inline-flex;
              align-items: center;
              height: 20px;
              padding: 0 0 0 14px;
              border-left: 1px solid var(--line);
              color: rgba(34, 34, 34, 0.48);
              font-size: 10px;
              font-weight: 300;
              line-height: 1;
              letter-spacing: .04em;
              white-space: nowrap;
            }

            main {
              max-width: 1500px;
              margin: 0 auto;
              padding: 90px 24px 80px;
            }

            .category {
              margin-bottom: 7px;
              color: var(--secondary);
              font-size: 8px;
              letter-spacing: .075em;
            }

            h1 {
              margin: 0 0 24px;
              font-size: 18px;
              font-weight: 400;
              line-height: 1.5;
            }

            .image {
              width: 100%;
              max-width: 900px;
              margin: 0 0 35px;
            }

            .image img {
              display: block;
              width: 100%;
              height: auto;
            }

            .back {
              margin-top: 30px;
              font-size: 10px;
            }

            .back a {
              color: var(--secondary);
            }

            @media (max-width: 600px) {
              header {
                min-height: 52px;
                padding: 0 14px;
                gap: 10px;
              }

              .header-left {
                gap: 20px;
              }

              .site-title {
                font-size: 10px;
              }

              .category-nav {
                gap: 10px;
              }

              .header-category {
                height: 18px;
                font-size: 9px;
              }

              .about-link {
                height: 18px;
                padding-left: 10px;
                font-size: 9px;
              }

              main {
                padding: 76px 12px 60px;
              }

              h1 {
                font-size: 16px;
              }
            }
          </style>
          """

          # 画像のリネームに合わせて詳細ページ名と画像参照を更新
          try:
              diff = subprocess.check_output(
                  ["git", "diff", "--name-status", "-M", "HEAD^", "HEAD"],
                  text=True
              )
          except subprocess.CalledProcessError:
              diff = ""

          for line in diff.splitlines():
              parts = line.split("\t")
              if len(parts) < 3 or not parts[0].startswith("R"):
                  continue

              old_path = Path(parts[1])
              new_path = Path(parts[2])

              if old_path.suffix.lower() not in image_extensions:
                  continue
              if new_path.suffix.lower() not in image_extensions:
                  continue

              old_html = old_path.with_suffix(".html")
              new_html = new_path.with_suffix(".html")

              if old_html.exists() and not new_html.exists():
                  old_html.rename(new_html)

              if new_html.exists():
                  html = new_html.read_text(encoding="utf-8")
                  html = html.replace(old_path.name, new_path.name)
                  new_html.write_text(html, encoding="utf-8")

          # 不足している詳細ページを作成
          for image in sorted(root.iterdir()):
              if not image.is_file():
                  continue
              if image.suffix.lower() not in image_extensions:
                  continue
              if image.stem.startswith("book-cover-"):
                  continue

              stem = image.stem
              html_file = root / f"{stem}.html"

              if html_file.exists():
                  continue

              category = category_for(stem)

              html = """<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>__TITLE__ | 坂田雄志</title>
          </head>
          <body>
            <main>
              <div class="category">__CATEGORY__</div>
              <h1>__TITLE__</h1>
              <div class="image">
                <img src="__IMAGE__" alt="__TITLE__" loading="lazy" decoding="async">
              </div>
              <div class="back"><a href="index.html">← Archive</a></div>
            </main>
          </body>
          </html>
          """

              html = html.replace("__TITLE__", stem)
              html = html.replace("__CATEGORY__", category)
              html = html.replace("__IMAGE__", optimized_image_path(image))
              html_file.write_text(html, encoding="utf-8")
              print("Created:", html_file)

          # 詳細ページのヘッダーと共通デザインを更新
          # index.html、book.html、about.htmlの本文は変更しない
          for html_file in root.glob("*.html"):
              if html_file.name in {"index.html", "book.html", "about.html"}:
                  continue

              html = html_file.read_text(encoding="utf-8")
              stem = html_file.stem
              category = category_for(stem)

              # 既存のアクティブ状態を解除
              html = re.sub(
                  r'(<a class="header-category category-[^"]+) active(")',
                  r'\1\2',
                  html
              )

              # 該当カテゴリをアクティブにする
              html = re.sub(
                  r'(<a class="header-category category-' +
                  re.escape(category) + r')(")',
                  r'\1 active\2',
                  html
              )

              # 画像の参照先を現在の画像ファイル名に合わせる
              for ext in image_extensions:
                  image = root / f"{stem}{ext}"
                  if image.exists():
                      html = re.sub(
                          r'(<img\b[^>]*\bsrc=")[^"]*(")',
                          lambda match: match.group(1) + optimized_image_path(image) + match.group(2),
                          html,
                          count=1,
                          flags=re.I
                      )
                      break

              # ヘッダーを共通のものに置き換える
              if re.search(r"<header\b[^>]*>.*?</header>", html, re.I | re.S):
                  html = re.sub(
                      r"<header\b[^>]*>.*?</header>",
                      lambda _: header_html,
                      html,
                      count=1,
                      flags=re.I | re.S
                  )
              else:
                  html = re.sub(
                      r"<body\b[^>]*>",
                      lambda match: match.group(0) + "\n" + header_html,
                      html,
                      count=1,
                      flags=re.I
                  )

              # 共通CSSを重複させず挿入
              html = re.sub(
                  r'<style id="site-design">.*?</style>',
                  "",
                  html,
                  flags=re.I | re.S
              )

              if "</head>" in html:
                  html = html.replace("</head>", shared_css + "\n</head>", 1)
              else:
                  html = html.replace("<body", shared_css + "\n<body", 1)

              html_file.write_text(html, encoding="utf-8")

          # BOOK画像からOCRを行い、Google Booksの情報を取得
          metadata_path = root / "book-metadata.json"

          try:
              book_metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              book_metadata = {}

          def google_books_search(query):
              if not query.strip():
                  return None

              url = (
                  "https://www.googleapis.com/books/v1/volumes?q="
                  + urllib.parse.quote(query)
                  + "&maxResults=5"
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  for item in data.get("items", []):
                      info = item.get("volumeInfo", {})
                      title = info.get("title", "")
                      image_links = info.get("imageLinks", {})
                      cover = (
                          image_links.get("thumbnail")
                          or image_links.get("smallThumbnail")
                          or ""
                      )

                      if title:
                          return {
                              "title": title,
                              "authors": info.get("authors", []),
                              "publisher": info.get("publisher", ""),
                              "publishedDate": info.get("publishedDate", ""),
                              "infoLink": info.get("infoLink", ""),
                              "cover": cover.replace("http://", "https://"),
                          }
              except Exception as error:
                  print("Google Books search error:", error)

              return None

          def download_cover(url, destination):
              if not url:
                  return False

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      content = response.read()

                  if not content:
                      return False

                  destination.write_bytes(content)
                  return True
              except Exception as error:
                  print("Cover download error:", error)
                  return False

          for image in sorted(root.iterdir()):
              if not image.is_file():
                  continue
              if image.suffix.lower() not in image_extensions:
                  continue
              if category_for(image.stem) != "BOOK":
                  continue
              if image.stem.startswith("book-cover-"):
                  continue

              key = image.name
              existing = book_metadata.get(key, {})
              cover_filename = f"book-cover-{image.stem}.jpg"
              cover_path = root / cover_filename

              if existing.get("title") and existing.get("coverImage") and cover_path.exists():
                  continue

              ocr_text = ""
              ocr_txt = root / f"{image.stem}-ocr.txt"

              try:
                  subprocess.run(
                      [
                          "tesseract",
                          str(image),
                          str(root / f"{image.stem}-ocr"),
                          "-l",
                          "jpn+jpn_vert",
                          "--psm",
                          "11",
                      ],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )

                  if ocr_txt.exists():
                      ocr_text = ocr_txt.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      )
              except Exception as error:
                  print("OCR error:", error)

              candidates = []
              for line in ocr_text.splitlines():
                  line = re.sub(r"\s+", " ", line).strip()
                  if len(line) >= 2:
                      candidates.append(line)

              filename_query = re.sub(
                  r"^book[-_]",
                  "",
                  image.stem,
                  flags=re.I
              )

              if filename_query:
                  candidates.append(filename_query)

              result = None
              used_query = ""

              for query in candidates[:20]:
                  result = google_books_search(query)
                  if result:
                      used_query = query
                      break

              cover_image = ""

              if result:
                  if download_cover(result["cover"], cover_path):
                      cover_image = cover_filename

                  book_metadata[key] = {
                      "sourceImage": image.name,
                      "coverImage": cover_image,
                      "title": result.get("title", ""),
                      "authors": result.get("authors", []),
                      "publisher": result.get("publisher", ""),
                      "publishedDate": result.get("publishedDate", ""),
                      "infoLink": result.get("infoLink", ""),
                      "ocr": used_query,
                  }
              else:
                  book_metadata[key] = {
                      "sourceImage": image.name,
                      "coverImage": "",
                      "title": existing.get("title", image.stem),
                      "authors": existing.get("authors", []),
                      "publisher": existing.get("publisher", ""),
                      "publishedDate": existing.get("publishedDate", ""),
                      "infoLink": existing.get("infoLink", ""),
                      "ocr": existing.get("ocr", ""),
                  }

              if ocr_txt.exists():
                  ocr_txt.unlink()

          metadata_path.write_text(
              json.dumps(book_metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Archive用データを生成
          archive = []

          for image in sorted(root.iterdir()):
              if not image.is_file():
                  continue
              if image.suffix.lower() not in image_extensions:
                  continue
              if image.stem.startswith("book-cover-"):
                  continue

              stem = image.stem
              html_file = root / f"{stem}.html"
              title = stem

              if html_file.exists():
                  html = html_file.read_text(encoding="utf-8")
                  match = re.search(r"<h1[^>]*>(.*?)</h1>", html, re.I | re.S)
                  if match:
                      title = re.sub(r"<[^>]+>", "", match.group(1)).strip()

              item = {
                  "image": optimized_image_path(image),
                  "detailPage": f"{stem}.html",
                  "category": category_for(stem),
                  "title": title,
                  "capturedAt": captured_at(image),
              }

              if category_for(stem) == "BOOK":
                  metadata = book_metadata.get(image.name, {})

                  if metadata.get("coverImage"):
                      item["coverImage"] = metadata["coverImage"]
                  if metadata.get("title"):
                      item["bookTitle"] = metadata["title"]
                  if metadata.get("authors"):
                      item["authors"] = metadata["authors"]

              archive.append(item)

          Path("archive-data.json").write_text(
              json.dumps(archive, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Generated archive-data.json with", len(archive), "items.")

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update archive and book covers"
          git push

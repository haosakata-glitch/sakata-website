<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE｜SAKATA YUSHI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #E9E5DE;
      color: rgba(34, 34, 34, 0.68);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font-family: inherit;
    }

    /* HEADER */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(233, 229, 222, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(34, 34, 34, 0.06);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      min-height: 58px;
      padding: 0 22px;
    }

    .site-title {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: rgba(34, 34, 34, 0.72);
    }

    .main-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .main-nav a,
    .main-nav button {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 0 0 auto;
      height: 20px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: rgba(34, 34, 34, 0.48);
      text-decoration: none;
      text-underline-offset: 3px;
    }

    .main-nav a:hover,
    .main-nav button:hover {
      color: rgba(34, 34, 34, 0.72);
    }

    .main-nav .active {
      color: #222222;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .about-link {
      margin-left: 10px !important;
      padding-left: 18px !important;
      border-left: 1px solid rgba(34, 34, 34, 0.14) !important;
    }

    /* MAIN */

    main {
      padding: 86px 22px 100px;
    }


    /* HOT FEATURE SLIDER */
    .archive-page-title {
      margin: 0 0 30px;
      color: #24231F;
      font-size: clamp(46px, 9vw, 112px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .025em;
    }
    .hot-section { margin: 0 0 26px; max-width: 1080px; }
    .hot-heading, .archive-label {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 0 0 12px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(34,34,34,.18);
      font-size: 10px; letter-spacing: .1em;
    }
    .hot-count { color: rgba(34,34,34,.45); font-size: 9px; letter-spacing: .04em; }
    .hot-slider { position: relative; overflow: hidden; background: rgba(255,255,255,.18); touch-action: pan-y; }
    .hot-track { display: flex; width: 100%; transition: transform .65s cubic-bezier(.22,.61,.36,1); }
    .hot-slide {
      flex: 0 0 100%; display: grid;
      grid-template-columns: minmax(0,2.2fr) minmax(220px,.8fr);
      min-height: clamp(300px,34vw,460px); color: rgba(34,34,34,.82);
    }
    .hot-image-link { display: block; min-width: 0; min-height: 0; overflow: hidden; background: rgba(34,34,34,.04); }
    .hot-image { display: block; width: 100%; height: 100%; min-height: 300px; max-height: 460px; object-fit: cover; }
    .hot-copy {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: clamp(16px,2vw,26px); border: 1px solid rgba(34,34,34,.08); border-left: 0;
    }
    .hot-category { margin-bottom: auto; font-size: 9px; letter-spacing: .1em; color: rgba(34,34,34,.48); }
    .hot-title { margin: 14px 0 10px; font-size: clamp(18px,2vw,27px); line-height: 1.45; font-weight: 400; letter-spacing: .015em; overflow-wrap: anywhere; }
    .hot-description { max-width: 34em; margin: 0 0 12px; font-size: 11px; line-height: 1.8; white-space: pre-line; }
    .hot-more { margin-top: auto; padding-bottom: 4px; border-bottom: 1px solid rgba(34,34,34,.38); font-size: 10px; letter-spacing: .04em; }
    .hot-controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .hot-arrow { appearance: none; border: 1px solid rgba(34,34,34,.2); border-radius: 50%; width: 28px; height: 28px; padding: 0; background: transparent; cursor: pointer; font-size: 13px; }
    .hot-arrow:hover { background: rgba(34,34,34,.06); }
    .hot-dots { display: flex; gap: 7px; margin-left: 2px; }
    .hot-dot { appearance: none; width: 6px; height: 6px; border: 0; border-radius: 50%; padding: 0; background: rgba(34,34,34,.25); cursor: pointer; }
    .hot-dot[aria-current="true"] { background: rgba(34,34,34,.85); }
    .hot-pause { margin-left: auto; appearance: none; border: 0; padding: 4px 0; background: transparent; cursor: pointer; font-size: 9px; letter-spacing: .04em; }
    .archive-label { margin: 30px 0 12px; }
    @media (max-width: 650px) {
      .hot-section { margin-bottom: 26px; }
      .hot-heading { margin-bottom: 8px; }
      .hot-slide { grid-template-columns: 1fr; min-height: auto; }
      .hot-image { height: 68vw; min-height: 240px; max-height: 420px; }
      .hot-copy { min-height: 0; padding: 14px 16px 16px; border-left: 1px solid rgba(34,34,34,.08); border-top: 0; }
      .hot-category { margin-bottom: 0; }
      .hot-title { margin: 10px 0 6px; font-size: 19px; }
      .hot-description { margin-bottom: 10px; font-size: 11px; }
      .archive-label { margin-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { .hot-track { transition: none; } html { scroll-behavior: auto; } }


    .archive-tools { display:flex; justify-content:space-between; gap:12px; margin:0 0 14px; }
    .search-box { flex:1; min-width:0; }
    .search-box input, .sort-box select { width:100%; min-height:34px; border:1px solid rgba(34,34,34,.18); border-radius:0; background:transparent; color:inherit; padding:7px 9px; font:inherit; font-size:10px; letter-spacing:.06em; outline-offset:3px; }
    .search-box input::placeholder { color:rgba(34,34,34,.42); }
    .sort-box { width:130px; flex:0 0 auto; }
    .archive-empty { padding:24px 0; color:rgba(34,34,34,.55); }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .back-to-top { position:fixed; right:18px; bottom:18px; z-index:900; border:1px solid rgba(34,34,34,.25); border-radius:50%; width:38px; height:38px; background:rgba(233,229,222,.92); color:rgba(34,34,34,.8); cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s ease; }
    .back-to-top.is-visible { opacity:1; pointer-events:auto; }
    @media(max-width:650px) { .archive-tools { gap:8px; } .sort-box { width:105px; } .back-to-top { right:12px; bottom:12px; } }

    /* ARCHIVE GRID */

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 18px;
      row-gap: 18px;
      align-items: start;
    }

    .archive-item {
      display: block;
      position: relative;
      min-width: 0;
    }

    .archive-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #FFFFFF;
    }

    .archive-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .archive-text-wrap {
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(34,34,34,.12);
    }
    .archive-text-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      min-height: 150px;
      padding: clamp(14px, 2vw, 24px);
      color: rgba(34,34,34,.78);
    }
    .archive-text-label {
      font-size: 9px;
      letter-spacing: .1em;
      color: rgba(34,34,34,.48);
    }
    .archive-text-title {
      margin: 18px 0;
      font-size: clamp(14px, 1.5vw, 19px);
      font-weight: 400;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .archive-text-arrow {
      align-self: flex-end;
      font-size: 12px;
    }

    /* TITLE / DATE */

    .archive-caption {
      position:absolute; right:0; bottom:0; left:auto; top:auto;
      display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
      gap:3px; max-width:88%; padding:8px 11px;
      background:rgba(233,229,222,.94); color:rgba(34,34,34,.82);
      font-size:9px; font-weight:400; line-height:1.45; letter-spacing:.03em;
      text-align:right; pointer-events:none; opacity:0; transition:opacity .15s ease;
    }

    /* PC：カーソルを合わせると写真が薄く白くなる */

    @media (hover: hover) and (pointer: fine) {
      .archive-image {
        transition: opacity 0.2s ease;
      }

      .archive-item:hover .archive-image {
        opacity: 1;
      }

      .archive-item:hover .archive-caption {
        opacity: 1;
      }
    }

    .archive-item:focus-visible .archive-caption {
      opacity: 1;
    }

    .archive-item:focus-visible .archive-image {
      opacity: 1;
    }

    .archive-caption-title {
      white-space: normal;
      overflow-wrap: anywhere;
      text-overflow: clip;
      max-width: 100%;
    }

    .archive-caption-date {
      flex-shrink: 0;
      color: rgba(34, 34, 34, 0.56);
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .header-inner {
        min-height: 52px;
        padding: 0 14px;
        gap: 15px;
      }

      .site-title {
        font-size: 10px;
      }

      .main-nav {
        gap: 10px;
        flex: 1 1 auto;
        min-width: 0;
        justify-content: flex-start;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .main-nav::-webkit-scrollbar {
        display: none;
      }

      .site-title {
        flex: 0 0 auto;
      }

      .main-nav a,
      .main-nav button {
        font-size: 9px;
        height: 18px;
      }
main {
        padding: 72px 10px 70px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 10px;
        row-gap: 10px;
      }

      .archive-caption {
        padding: 12px;
        font-size: 8px;
      }

      .archive-caption-title {
        font-size: 8px;
      }

      .archive-caption-date {
        font-size: 8px;
        color: rgba(34, 34, 34, 0.56);
      }

      /* スマホ：最初のタップで右下のラベルを表示 */

      .archive-item.is-caption-visible .archive-image {
        opacity: 1;
      }

      .archive-item.is-caption-visible .archive-caption {
        opacity: 1;
      }
}
  </style>

  <!-- MAIN -->

  <main>
    <h1 id="archive-page-title" class="archive-page-title">ALL</h1>
    <section class="hot-section" aria-label="HOT articles">
      <div class="hot-heading">
      </div>
      <div class="hot-slider" id="hot-slider">
        <div class="hot-track" id="hot-track"></div>
      </div>
      <div class="hot-controls">
        <button class="hot-arrow" type="button" id="hot-prev" aria-label="前の記事">←</button>
        <button class="hot-arrow" type="button" id="hot-next" aria-label="次の記事">→</button>
        <div class="hot-dots" id="hot-dots" aria-label="記事を選択"></div>
        <button class="hot-pause" type="button" id="hot-pause" aria-pressed="false">PAUSE</button>
      </div>
    </section>
    <div class="archive-label"><span id="archive-section-label">ITEMS</span><span id="archive-count"></span></div>
    <div class="archive-tools" aria-label="アーカイブ検索と並び替え">
      <label class="search-box"><span class="visually-hidden">キーワード検索</span><input id="archive-search" type="search" placeholder="SEARCH ARCHIVE" autocomplete="off"></label>
      <label class="sort-box"><span class="visually-hidden">並び替え</span><select id="archive-sort"><option value="default">DEFAULT</option><option value="newest">NEWEST</option><option value="oldest">OLDEST</option><option value="title">TITLE A–Z</option></select></label>
    </div>
    <p id="archive-empty" class="archive-empty" hidden>該当する記事はありません。</p>
    <section id="archive" class="archive-grid" aria-live="polite"></section>
  </main>

  <button type="button" id="back-to-top" class="back-to-top" aria-label="ページ上部に戻る">↑</button>
  <script>
    const searchInput = document.getElementById("archive-search");
    const sortSelect = document.getElementById("archive-sort");
    const emptyMessage = document.getElementById("archive-empty");
    const backToTop = document.getElementById("back-to-top");
    const archive = document.getElementById("archive");
    const hotTrack = document.getElementById("hot-track");
    const hotDots = document.getElementById("hot-dots");
    const hotSlider = document.getElementById("hot-slider");
    const hotSection = document.querySelector(".hot-section");
    const archiveCount = document.getElementById("archive-count");
    const hotPause = document.getElementById("hot-pause");

    const hotDescriptions = {
      "work-01.html": "設計の記録。計画の背景や条件を、写真とあわせて整理していく。",
      "work-02.html": "OBJECT / ARCHIVE。かたちや素材を手がかりに、制作の記録をたどる。",
      "book-01.html": "BOOK / READING NOTES。読んだ本を入口に、気になった考えや言葉を記録する。",
      "food-01.html": "FOOD / DAILY NOTES。日々の食事を写真に残し、暮らしの断片をアーカイブする。",
      "photo-01.html": "PHOTO / FIELD NOTES。写真を通して、見たものや場所の記録をたどる。"
    };
    let hotItems = [];
    let allHotItems = [];
    let hotIndex = 0;
    let hotTimer = null;
    let hotIsPaused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const categoryButtons = document.querySelectorAll(
      ".main-nav button[data-category]"
    );
    const navItems = document.querySelectorAll(
      ".main-nav a, .main-nav button"
    );

    let archiveData = [];
    let currentSearch = "";

    const params = new URLSearchParams(window.location.search);
    const initialCategory = params.get("category") || "ALL";
    let currentCategory = initialCategory;

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}.${month}.${day}`;
    }

    function renderHot(category = "ALL") {
      hotTrack.innerHTML = "";
      hotDots.innerHTML = "";

      // スライド表示はALLページだけに出し、カテゴリー別ページでは非表示
      if (category !== "ALL") {
        hotItems = [];
        hotSection.hidden = true;
        stopHotTimer();
        return;
      }

      // ALLページでは各カテゴリーから代表を1点ずつ表示
      const seenCategories = new Set();
      hotItems = allHotItems.filter(item => {
        if (seenCategories.has(item.category)) return false;
        seenCategories.add(item.category);
        return true;
      });
      hotSection.hidden = hotItems.length === 0;
      hotItems.forEach((item, index) => {
        const slide = document.createElement("article");
        slide.className = "hot-slide";
        const imageLink = document.createElement("a");
        imageLink.className = "hot-image-link";
        imageLink.href = item.detailPage || "#";
        const image = document.createElement("img");
        image.className = "hot-image";
        image.src = item.coverImage || item.image;
        image.alt = item.title || "";
        image.loading = index < 4 ? "eager" : "lazy";
        image.decoding = "async";
        if (index === 0) image.fetchPriority = "high";
        image.loading = index === 0 ? "eager" : "lazy";
        imageLink.appendChild(image);

        const copy = document.createElement("div");
        copy.className = "hot-copy";
        const category = document.createElement("div");
        category.className = "hot-category";
        category.textContent = item.category || "ARCHIVE";
        const title = document.createElement("h2");
        title.className = "hot-title";
        title.textContent = item.title || "Untitled";
        const description = document.createElement("p");
        description.className = "hot-description";
        description.textContent = item.description || hotDescriptions[item.detailPage] || "写真と記録を通して、日々の関心をアーカイブする。";
        const more = document.createElement("a");
        more.className = "hot-more";
        more.href = item.detailPage || "#";
        more.textContent = "VIEW ARTICLE ↗";
        copy.append(category, title, description, more);
        slide.append(imageLink, copy);
        hotTrack.appendChild(slide);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "hot-dot";
        dot.setAttribute("aria-label", (index + 1) + "番目の記事");
        dot.addEventListener("click", () => { showHot(index); startHotTimer(); });
        hotDots.appendChild(dot);
      });
      showHot(0);
    }

    function showHot(index) {
      if (!hotItems.length) return;
      hotIndex = (index + hotItems.length) % hotItems.length;
      hotTrack.style.transform = "translateX(-" + (hotIndex * 100) + "%)";
      [...hotDots.children].forEach((dot, i) => dot.setAttribute("aria-current", i === hotIndex ? "true" : "false"));
    }

    function stopHotTimer() {
      if (hotTimer) window.clearInterval(hotTimer);
      hotTimer = null;
    }

    function startHotTimer() {
      stopHotTimer();
      if (hotIsPaused || hotItems.length < 2) return;
      hotTimer = window.setInterval(() => showHot(hotIndex + 1), 6500);
    }

    document.getElementById("hot-prev").addEventListener("click", () => { showHot(hotIndex - 1); startHotTimer(); });
    document.getElementById("hot-next").addEventListener("click", () => { showHot(hotIndex + 1); startHotTimer(); });
    hotPause.addEventListener("click", () => {
      hotIsPaused = !hotIsPaused;
      hotPause.textContent = hotIsPaused ? "PLAY" : "PAUSE";
      hotPause.setAttribute("aria-pressed", hotIsPaused ? "true" : "false");
      startHotTimer();
    });
    // スマートフォンでは左右スワイプでスライドを切り替える
    let hotTouchStartX = 0;
    let hotTouchStartY = 0;
    hotSlider.addEventListener("touchstart", event => {
      if (!event.changedTouches.length) return;
      hotTouchStartX = event.changedTouches[0].clientX;
      hotTouchStartY = event.changedTouches[0].clientY;
      stopHotTimer();
    }, { passive: true });
    hotSlider.addEventListener("touchend", event => {
      if (!event.changedTouches.length) return;
      const deltaX = event.changedTouches[0].clientX - hotTouchStartX;
      const deltaY = event.changedTouches[0].clientY - hotTouchStartY;
      if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
        showHot(hotIndex + (deltaX < 0 ? 1 : -1));
      }
      startHotTimer();
    }, { passive: true });
    hotSlider.addEventListener("touchcancel", startHotTimer, { passive: true });
    hotSlider.addEventListener("mouseenter", stopHotTimer);
    hotSlider.addEventListener("mouseleave", startHotTimer);
    hotSlider.addEventListener("focusin", stopHotTimer);
    hotSlider.addEventListener("focusout", startHotTimer);
    document.addEventListener("visibilitychange", () => document.hidden ? stopHotTimer() : startHotTimer());

    function renderArchive(category) {
      currentCategory = category;
      const pageTitle = category === "ALL" ? "ALL" : category;
      document.getElementById("archive-page-title").textContent = pageTitle;
      document.getElementById("archive-section-label").textContent = pageTitle === "ALL" ? "ARCHIVE" : pageTitle;
      document.title = pageTitle + "｜SAKATA YUSHI";
      archive.innerHTML = "";

      let filteredData = archiveData;

      if (category !== "ALL") {
        filteredData = archiveData.filter(item => item.category === category);
      }
      if (currentSearch) {
        const query = currentSearch.toLocaleLowerCase();
        filteredData = filteredData.filter(item =>
          [item.title, item.category, item.description, item.date, item.bookTitle, item.author, item.location]
            .filter(Boolean).join(" ").toLocaleLowerCase().includes(query)
        );
      }
      const sortMode = sortSelect.value;
      filteredData = [...filteredData];
      if (sortMode === "default" || sortMode === "newest" || sortMode === "oldest") {
        filteredData.sort((a, b) => {
          const dateA = Date.parse(a.capturedAt || a.date || a.createdAt || a.publishedAt || "") || 0;
          const dateB = Date.parse(b.capturedAt || b.date || b.createdAt || b.publishedAt || "") || 0;

          // 日時がある写真を先に並べ、日時がないものは元の順序を保つ
          if (dateA && !dateB) return -1;
          if (!dateA && dateB) return 1;
          if (!dateA && !dateB) return 0;

          if (sortMode === "oldest") return dateA - dateB;
          return dateB - dateA;
        });
      } else if (sortMode === "title") {
        filteredData.sort((a,b) => (a.title || "").localeCompare(b.title || "", "ja"));
      }

      archiveCount.textContent = String(filteredData.length).padStart(2, "0") + " ITEMS";

      emptyMessage.hidden = filteredData.length !== 0;
      filteredData.forEach((item, index) => {
        const link = document.createElement("a");

        link.className = "archive-item";
        link.href = item.detailPage || "#";

        const imageWrap = document.createElement("div");
        imageWrap.className = "archive-image-wrap";

        if (item.image || item.coverImage) {
          const image = document.createElement("img");
          image.className = "archive-image";
          image.src = item.coverImage || item.image;
          image.alt = item.title || "";
          image.loading = "lazy";
          image.decoding = "async";
          imageWrap.appendChild(image);
        } else {
          imageWrap.classList.add("archive-text-wrap");
          const textCard = document.createElement("div");
          textCard.className = "archive-text-card";
          const label = document.createElement("span");
          label.className = "archive-text-label";
          label.textContent = "TEXT / ESSAY";
          const cardTitle = document.createElement("span");
          cardTitle.className = "archive-text-title";
          cardTitle.textContent = item.title || "";
          const arrow = document.createElement("span");
          arrow.className = "archive-text-arrow";
          arrow.textContent = "↗";
          textCard.append(label, cardTitle, arrow);
          imageWrap.appendChild(textCard);
        }

        const caption = document.createElement("div");
        caption.className = "archive-caption";

        const title = document.createElement("span");
        title.className = "archive-caption-title";
        title.textContent = item.title || "";

        const dateValue =
          item.date ||
          item.createdAt ||
          item.publishedAt ||
          "";

        const date = document.createElement("span");
        date.className = "archive-caption-date";
        date.textContent = formatDate(dateValue);

        caption.appendChild(title);

        if (date.textContent) {
          caption.appendChild(date);
        }

        imageWrap.appendChild(caption);
        link.appendChild(imageWrap);

        link.addEventListener("click", event => {
          const isTouchLayout = window.matchMedia(
            "(max-width: 650px) and (hover: none)"
          ).matches;

          if (!isTouchLayout) {
            return;
          }

          if (!link.classList.contains("is-caption-visible")) {
            event.preventDefault();

            document
              .querySelectorAll(".archive-item.is-caption-visible")
              .forEach(openItem => {
                openItem.classList.remove("is-caption-visible");
              });

            link.classList.add("is-caption-visible");
          }
        });

        archive.appendChild(link);
      });
    }

    searchInput.addEventListener("input", () => {
      currentSearch = searchInput.value.trim();
      renderArchive(currentCategory);
    });
    sortSelect.addEventListener("change", () => renderArchive(currentCategory));
    window.addEventListener("scroll", () => {
      backToTop.classList.toggle("is-visible", window.scrollY > 400);
    }, { passive: true });
    backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    /* カテゴリー切り替え */

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        const category = button.dataset.category;

        navItems.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        const url = new URL(window.location.href);

        if (category === "ALL") {
          url.searchParams.delete("category");
        } else {
          url.searchParams.set("category", category);
        }

        window.history.pushState({}, "", url);

        renderHot(category);
        renderArchive(category);
      });
    });

    /* ブラウザの戻る・進む */

    window.addEventListener("popstate", () => {
      const urlParams = new URLSearchParams(
        window.location.search
      );

      const category = urlParams.get("category") || "ALL";

      navItems.forEach(item => {
        item.classList.remove("active");
      });

      const activeButton = document.querySelector(
        `.main-nav button[data-category="${category}"]`
      );

      if (activeButton) {
        activeButton.classList.add("active");
      }
      renderHot(category);
      renderArchive(category);
    });

    /* archive-data.jsonを読み込み */

    fetch("archive-data.json")
      .then(response => {
        if (!response.ok) {
          throw new Error(
            "archive-data.json の読み込みに失敗しました。"
          );
        }

        return response.json();
      })
      .then(data => {
        archiveData = Array.isArray(data)
          ? data
          : data.items || [];

        // HOTの候補は全カテゴリーの記事から取得。表示点数はrenderHot側で調整する
        const hotCategories = ["ARCHITECTURE", "OBJECT", "BOOK", "FOOD", "PHOTO", "PLACE", "TEXT", "OTHER"];
        allHotItems = archiveData.filter(item => hotCategories.includes(item.category) && item.image);
        navItems.forEach(item => {
          item.classList.remove("active");
        });

        const initialButton = document.querySelector(
          `.main-nav button[data-category="${initialCategory}"]`
        );

        if (initialButton) {
          initialButton.classList.add("active");
        }

        renderHot(initialCategory);
        renderArchive(initialCategory);
        startHotTimer();
      })
      .catch(error => {
        console.error(error);

        archive.innerHTML =
          "<p>Archive data could not be loaded.</p>";
      });
  </script>

</body>
</html>

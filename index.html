<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sakata Katsuyuki</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 300;
      color: #111;
      background: #fff;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      padding: 0 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      z-index: 100;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .about-link {
      display: flex;
      align-items: center;
      height: 18px;
      padding-left: 14px;
      border-left: 1px solid #aaa;

      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 78px 24px 100px;
    }

    .archive-header {
      margin-bottom: 20px;
    }

    .archive-label {
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #777;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ddd;
    }

    .filter {
      border: none;
      background: none;
      padding: 0;

      font-family: inherit;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.03em;
      color: #999;

      cursor: pointer;
    }

    .filter:hover {
      color: #111;
    }

    .filter.active {
      color: #111;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .archive-item {
      position: relative;
      display: block;
      color: #111;
      text-decoration: none;
      overflow: hidden;
    }

    .archive-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #f2f2f2;
    }

    .archive-info {
      position: absolute;
      right: 7px;
      bottom: 7px;

      padding: 5px 6px 4px;

      background: rgba(255, 255, 255, 0.88);
      text-align: right;

      opacity: 0;
      transform: translateY(4px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

      pointer-events: none;
    }

    .archive-item:hover .archive-info,
    .archive-item:focus .archive-info,
    .archive-item.show-info .archive-info {
      opacity: 1;
      transform: translateY(0);
    }

    .archive-category {
      font-size: 8px;
      line-height: 1.2;
      letter-spacing: 0.05em;
      color: #777;
      margin-bottom: 2px;
    }

    .archive-title {
      font-size: 11px;
      line-height: 1.3;
      font-weight: 300;
    }

    .empty {
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 900px) {
      main {
        padding-left: 15px;
        padding-right: 15px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
      }
    }

    @media (max-width: 600px) {
      header {
        height: 48px;
        padding: 0 15px;
      }

      .site-title {
        font-size: 11px;
      }

      .about-link {
        padding-left: 11px;
        font-size: 9px;
      }

      main {
        padding: 68px 8px 70px;
      }

      .archive-header {
        margin-bottom: 16px;
      }

      .archive-label {
        font-size: 8px;
      }

      h1 {
        font-size: 12px;
      }

      .filters {
        gap: 13px;
        margin-bottom: 16px;
        padding-bottom: 10px;
      }

      .filter {
        font-size: 8px;
      }

      .archive-grid {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .archive-info {
        right: 6px;
        bottom: 6px;
        padding: 5px 6px 4px;
      }

      .archive-category {
        font-size: 7px;
      }

      .archive-title {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="site-title">Sakata Katsuyuki</a>
  <a href="about.html" class="about-link">About</a>
</header>

<main>

  <div class="archive-header">
    <div class="archive-label">ARCHIVE</div>
    <h1>All</h1>
  </div>

  <div class="filters">
    <button class="filter active" data-category="ALL">ALL</button>
    <button class="filter" data-category="ARCHITECTURE">ARCHITECTURE</button>
    <button class="filter" data-category="OBJECT">OBJECT</button>
    <button class="filter" data-category="FOOD">FOOD</button>
    <button class="filter" data-category="BOOK">BOOK</button>
    <button class="filter" data-category="TEXT">TEXT</button>
    <button class="filter" data-category="PHOTO">PHOTO</button>
    <button class="filter" data-category="PLACE">PLACE</button>
    <button class="filter" data-category="OTHER">OTHER</button>
  </div>

  <div id="archive-grid" class="archive-grid"></div>

</main>

<script>
  const grid = document.getElementById("archive-grid");
  const filters = document.querySelectorAll(".filter");

  let archiveItems = [];

  function render(category = "ALL") {
    grid.innerHTML = "";

    const items = archiveItems.filter(item => {
      return category === "ALL" ||
             item.category === category;
    });

    if (items.length === 0) {
      grid.innerHTML =
        '<div class="empty">まだ項目がありません。</div>';
      return;
    }

    items.forEach(item => {
      const link = document.createElement("a");

      link.className = "archive-item";
      link.href = item.detailPage;

      link.addEventListener("click", (event) => {
        if (window.matchMedia("(hover: none)").matches) {

          if (!link.classList.contains("show-info")) {
            event.preventDefault();

            document
              .querySelectorAll(".archive-item.show-info")
              .forEach(item => {
                item.classList.remove("show-info");
              });

            link.classList.add("show-info");
          }
        }
      });

      link.innerHTML = `
        <img
          src="${item.image}"
          alt=""
          class="archive-image"
        >

        <div class="archive-info">
          <div class="archive-category">
            ${item.category}
          </div>

          <div class="archive-title">
            ${item.title}
          </div>
        </div>
      `;

      grid.appendChild(link);
    });
  }

  async function loadArchive() {
    try {
      const response = await fetch("archive-data.json");

      if (!response.ok) {
        throw new Error("Archive data not found");
      }

      archiveItems = await response.json();

      render();

    } catch (error) {
      console.error(error);

      grid.innerHTML =
        '<div class="empty">Archiveを読み込めませんでした。</div>';
    }
  }

  filters.forEach(filter => {
    filter.addEventListener("click", () => {

      filters.forEach(button => {
        button.classList.remove("active");
      });

      filter.classList.add("active");

      render(filter.dataset.category);
    });
  });

  loadArchive();
</script>

</body>
</html>

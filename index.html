<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sakata Katsuyuki</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 300;
      color: #111;
      background: #fff;
    }

    /* =========================
       Header
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
      min-width: 0;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .category-nav {
      display: flex;
      align-items: center;
      gap: 14px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .header-category {
      border: none;
      background: none;
      padding: 0;

      font-family: inherit;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.03em;
      color: #888;

      cursor: pointer;
      white-space: nowrap;
    }

    .header-category:hover,
    .header-category.active {
      color: #111;
    }

    .about-link {
      flex-shrink: 0;

      display: flex;
      align-items: center;
      height: 18px;
      padding-left: 14px;

      border-left: 1px solid #aaa;

      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    /* =========================
       Main
    ========================= */

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 68px 24px 100px;
    }

    /* =========================
       Archive Grid
    ========================= */

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .archive-item {
      position: relative;
      display: block;

      color: #111;
      text-decoration: none;

      overflow: hidden;
    }

    .archive-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;

      display: block;

      background: #f2f2f2;
    }

    /* =========================
       Image Information
    ========================= */

    .archive-info {
      position: absolute;
      right: 7px;
      bottom: 7px;

      padding: 5px 6px 4px;

      background: rgba(255, 255, 255, 0.88);

      text-align: right;

      opacity: 0;
      transform: translateY(4px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

      pointer-events: none;
    }

    .archive-item:hover .archive-info,
    .archive-item:focus .archive-info,
    .archive-item.show-info .archive-info {
      opacity: 1;
      transform: translateY(0);
    }

    .archive-category {
      font-size: 8px;
      line-height: 1.2;
      letter-spacing: 0.05em;

      color: #777;

      margin-bottom: 2px;
    }

    .archive-title {
      font-size: 11px;
      line-height: 1.3;
      font-weight: 300;
    }

    .empty {
      font-size: 12px;
      color: #777;
    }

    /* =========================
       Tablet
    ========================= */

    @media (max-width: 900px) {

      main {
        padding-left: 15px;
        padding-right: 15px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
      }
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 48px;
        padding: 0 12px;
      }

      .header-left {
        gap: 15px;
        min-width: 0;
      }

      .site-title {
        font-size: 10px;
      }

      .category-nav {
        gap: 11px;
      }

      .header-category {
        font-size: 8px;
      }

      .about-link {
        padding-left: 10px;
        font-size: 8px;
      }

      main {
        padding: 56px 8px 70px;
      }

      .archive-grid {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .archive-info {
        right: 6px;
        bottom: 6px;

        padding: 5px 6px 4px;
      }

      .archive-category {
        font-size: 7px;
      }

      .archive-title {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       Header
  ========================= -->

  <header>

    <div class="header-left">

      <a href="index.html" class="site-title">
        SAKATA KATSUYUKI
      </a>

      <nav class="category-nav">

        <button
          class="header-category active"
          data-category="ALL"
        >
          ALL
        </button>

        <button
          class="header-category"
          data-category="ARCHITECTURE"
        >
          ARCHITECTURE
        </button>

        <button
          class="header-category"
          data-category="OBJECT"
        >
          OBJECT
        </button>

        <button
          class="header-category"
          data-category="FOOD"
        >
          FOOD
        </button>

        <button
          class="header-category"
          data-category="BOOK"
        >
          BOOK
        </button>

        <button
          class="header-category"
          data-category="TEXT"
        >
          TEXT
        </button>

        <button
          class="header-category"
          data-category="PHOTO"
        >
          PHOTO
        </button>

        <button
          class="header-category"
          data-category="PLACE"
        >
          PLACE
        </button>

        <button
          class="header-category"
          data-category="OTHER"
        >
          OTHER
        </button>

      </nav>

    </div>

    <a href="about.html" class="about-link">
      About
    </a>

  </header>


  <!-- =========================
       Main
  ========================= -->

  <main>

    <div
      id="archive-grid"
      class="archive-grid"
    ></div>

  </main>


  <!-- =========================
       JavaScript
  ========================= -->

  <script>

    const grid =
      document.getElementById("archive-grid");

    const filters =
      document.querySelectorAll(".header-category");

    let archiveItems = [];


    /* =========================
       Render
    ========================= */

    function render(category = "ALL") {

      grid.innerHTML = "";

      const items =
        archiveItems.filter(item => {

          return category === "ALL" ||
                 item.category === category;

        });


      if (items.length === 0) {

        grid.innerHTML =
          '<div class="empty">まだ項目がありません。</div>';

        return;
      }


      items.forEach(item => {

        const link =
          document.createElement("a");

        link.className =
          "archive-item";

        link.href =
          item.detailPage;


        /* -------------------------
           Mobile interaction
        ------------------------- */

        link.addEventListener(
          "click",
          (event) => {

            if (
              window.matchMedia(
                "(hover: none)"
              ).matches
            ) {

              if (
                !link.classList.contains(
                  "show-info"
                )
              ) {

                event.preventDefault();


                document
                  .querySelectorAll(
                    ".archive-item.show-info"
                  )
                  .forEach(item => {

                    item.classList.remove(
                      "show-info"
                    );

                  });


                link.classList.add(
                  "show-info"
                );
              }
            }
          }
        );


        /* -------------------------
           Image + Information
        ------------------------- */

        link.innerHTML = `

          <img
            src="${item.image}"
            alt=""
            class="archive-image"
          >

          <div class="archive-info">

            <div class="archive-category">
              ${item.category}
            </div>

            <div class="archive-title">
              ${item.title}
            </div>

          </div>

        `;


        grid.appendChild(link);

      });

    }


    /* =========================
       Load archive-data.json
    ========================= */

    async function loadArchive() {

      try {

        const response =
          await fetch(
            "archive-data.json"
          );


        if (!response.ok) {

          throw new Error(
            "Archive data not found"
          );

        }


        archiveItems =
          await response.json();


        render();


      } catch (error) {

        console.error(error);


        grid.innerHTML =
          '<div class="empty">Archiveを読み込めませんでした。</div>';

      }

    }


    /* =========================
       Category buttons
    ========================= */

    filters.forEach(filter => {

      filter.addEventListener(
        "click",
        () => {

          filters.forEach(button => {

            button.classList.remove(
              "active"
            );

          });


          filter.classList.add(
            "active"
          );


          render(
            filter.dataset.category
          );

        }
      );

    });


    /* =========================
       Start
    ========================= */

    loadArchive();

  </script>

</body>
</html>

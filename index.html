<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>坂田雄志</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      padding: 24px 30px;
      border-bottom: 1px solid #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 18px;
      letter-spacing: 0.02em;
    }

    .about-link {
      font-size: 13px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 70px 30px 120px;
    }

    .archive-header {
      margin-bottom: 50px;
    }

    .archive-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #777;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      line-height: 1.2;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 50px;
      padding-bottom: 18px;
      border-bottom: 1px solid #d5d5d5;
    }

    .filter {
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: #888;
      cursor: pointer;
    }

    .filter:hover {
      color: #111;
    }

    .filter.active {
      color: #111;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 24px;
      row-gap: 55px;
    }

    .archive-item {
      display: block;
      color: #111;
      text-decoration: none;
    }

    .archive-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      margin-bottom: 16px;
      background: #f2f2f2;
    }

    .archive-category {
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 7px;
    }

    .archive-title {
      font-size: 15px;
      line-height: 1.5;
    }

    .archive-item:hover .archive-title {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .empty {
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 900px) {
      main {
        padding: 60px 25px 100px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, 1fr);
        column-gap: 20px;
        row-gap: 45px;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      .site-title {
        font-size: 17px;
      }

      .about-link {
        font-size: 12px;
      }

      main {
        padding: 50px 20px 80px;
      }

      .archive-header {
        margin-bottom: 40px;
      }

      h1 {
        font-size: 32px;
      }

      .filters {
        gap: 15px;
        margin-bottom: 40px;
      }

      .filter {
        font-size: 10px;
      }

      .archive-grid {
        grid-template-columns: 1fr;
        row-gap: 45px;
      }

      .archive-image {
        margin-bottom: 13px;
      }

      .archive-title {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="site-title">坂田雄志</a>
  <a href="about.html" class="about-link">About</a>
</header>

<main>

  <div class="archive-header">
    <div class="archive-label">ARCHIVE</div>
    <h1>All</h1>
  </div>

  <div class="filters">
    <button class="filter active" data-category="ALL">ALL</button>
    <button class="filter" data-category="ARCHITECTURE">ARCHITECTURE</button>
    <button class="filter" data-category="OBJECT">OBJECT</button>
    <button class="filter" data-category="FOOD">FOOD</button>
    <button class="filter" data-category="BOOK">BOOK</button>
    <button class="filter" data-category="TEXT">TEXT</button>
    <button class="filter" data-category="PHOTO">PHOTO</button>
    <button class="filter" data-category="PLACE">PLACE</button>
  </div>

  <div id="archive-grid" class="archive-grid"></div>

</main>

<script>
  const grid = document.getElementById("archive-grid");
  const filters = document.querySelectorAll(".filter");

  let archiveItems = [];

  function render(category = "ALL") {
    grid.innerHTML = "";

    const items = archiveItems.filter(item => {
      return category === "ALL" ||
             item.category === category;
    });

    if (items.length === 0) {
      grid.innerHTML =
        '<div class="empty">まだ項目がありません。</div>';
      return;
    }

    items.forEach(item => {
      const link = document.createElement("a");

      link.className = "archive-item";
      link.href = item.detailPage;

      link.innerHTML = `
        <img
          src="${item.image}"
          alt=""
          class="archive-image"
        >
        <div class="archive-category">
          ${item.category}
        </div>
        <div class="archive-title">
          ${item.title}
        </div>
      `;

      grid.appendChild(link);
    });
  }

  async function loadArchive() {
    try {
      const response = await fetch("archive-data.json");

      if (!response.ok) {
        throw new Error("Archive data not found");
      }

      archiveItems = await response.json();

      render();

    } catch (error) {
      console.error(error);

      grid.innerHTML =
        '<div class="empty">Archiveを読み込めませんでした。</div>';
    }
  }

  filters.forEach(filter => {
    filter.addEventListener("click", () => {

      filters.forEach(button => {
        button.classList.remove("active");
      });

      filter.classList.add("active");

      render(filter.dataset.category);
    });
  });

  loadArchive();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>坂田雄志</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 18px;
    }

    .about-link {
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 30px 100px;
    }

    .archive-header {
      margin-bottom: 40px;
    }

    .archive-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      margin: 0;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ccc;
    }

    .filter {
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: 12px;
      color: #777;
      cursor: pointer;
    }

    .filter.active {
      color: #111;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 35px 20px;
    }

    .archive-item {
      display: block;
      color: #111;
      text-decoration: none;
    }

    .archive-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      margin-bottom: 14px;
    }

    .archive-category {
      font-size: 11px;
      color: #777;
      margin-bottom: 6px;
    }

    .archive-title {
      font-size: 15px;
      line-height: 1.5;
    }

    .empty {
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 800px) {
      .archive-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 20px;
      }

      main {
        padding: 50px 20px 80px;
      }

      h1 {
        font-size: 32px;
      }

      .archive-grid {
        gap: 30px 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="site-title">坂田雄志</a>
  <a href="about.html" class="about-link">About</a>
</header>

<main>

  <div class="archive-header">
    <div class="archive-label">ARCHIVE</div>
    <h1>All</h1>
  </div>

  <div class="filters">
    <button class="filter active" data-category="ALL">ALL</button>
    <button class="filter" data-category="ARCHITECTURE">ARCHITECTURE</button>
    <button class="filter" data-category="OBJECT">OBJECT</button>
    <button class="filter" data-category="FOOD">FOOD</button>
    <button class="filter" data-category="BOOK">BOOK</button>
    <button class="filter" data-category="TEXT">TEXT</button>
    <button class="filter" data-category="PHOTO">PHOTO</button>
    <button class="filter" data-category="PLACE">PLACE</button>
  </div>

  <div id="archive-grid" class="archive-grid"></div>

</main>

<script>

  const owner = "haosakata-glitch";
  const repo = "sakata-website";

  const apiUrl =
    `https://api.github.com/repos/${owner}/${repo}/contents/`;

  const grid = document.getElementById("archive-grid");
  const filters = document.querySelectorAll(".filter");

  let archiveItems = [];

  function getCategory(filename) {

    const lower = filename.toLowerCase();

    if (lower.startsWith("work-")) {
      return "ARCHITECTURE";
    }

    if (lower.startsWith("book-")) {
      return "BOOK";
    }

    if (lower.startsWith("food-")) {
      return "FOOD";
    }

    if (lower.startsWith("object-")) {
      return "OBJECT";
    }

    if (lower.startsWith("place-")) {
      return "PLACE";
    }

    if (lower.startsWith("text-")) {
      return "TEXT";
    }

    return "PHOTO";
  }


  function getDetailPage(filename) {

    const name = filename.substring(
      0,
      filename.lastIndexOf(".")
    );

    return name + ".html";
  }


  function getTitle(filename) {

    const name = filename.substring(
      0,
      filename.lastIndexOf(".")
    );

    return name
      .replace(/[-_]/g, " ")
      .replace(/\b\w/g, char => char.toUpperCase());
  }


  function render(category = "ALL") {

    grid.innerHTML = "";

    const items = archiveItems.filter(item => {
      return category === "ALL" || item.category === category;
    });

    if (items.length === 0) {
      grid.innerHTML =
        '<div class="empty">まだ項目がありません。</div>';
      return;
    }

    items.forEach(item => {

      const link = document.createElement("a");
      link.className = "archive-item";
      link.href = item.detailPage;

      link.innerHTML = `
        <img
          src="${item.image}"
          alt=""
          class="archive-image"
        >

        <div class="archive-category">
          ${item.category}
        </div>

        <div class="archive-title">
          ${item.title}
        </div>
      `;

      grid.appendChild(link);

    });

  }


  async function loadArchive() {

    try {

      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error("GitHub API error");
      }

      const files = await response.json();

      archiveItems = files
        .filter(file => {

          const name = file.name.toLowerCase();

          return (
            file.type === "file" &&
            (
              name.endsWith(".jpg") ||
              name.endsWith(".jpeg") ||
              name.endsWith(".png") ||
              name.endsWith(".webp")
            )
          );

        })
        .map(file => {

          return {
            image: file.name,
            category: getCategory(file.name),
            title: getTitle(file.name),
            detailPage: getDetailPage(file.name)
          };

        });

      render();

    } catch (error) {

      console.error(error);

      grid.innerHTML =
        '<div class="empty">Archiveを読み込めませんでした。</div>';

    }

  }


  filters.forEach(filter => {

    filter.addEventListener("click", () => {

      filters.forEach(button => {
        button.classList.remove("active");
      });

      filter.classList.add("active");

      const category =
        filter.dataset.category;

      render(category);

    });

  });


  loadArchive();

</script>

</body>
</html>

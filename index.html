<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E5DE"><meta name="description" content="SAKATA YUSHI — an archive of architecture, books, food, places and texts.">
<title>SAKATA YUSHI</title>
<style>
:root{color-scheme:light;--bg:#E9E5DE;--panel:#E4DFD6;--fg:#24231F;--muted:rgba(36,35,31,.58);--line:rgba(36,35,31,.16);--side:264px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.5 Arial,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
button{cursor:pointer}

/* left: file-tree style list */
.side{position:fixed;z-index:30;left:0;top:0;bottom:0;width:var(--side);display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;letter-spacing:.2em;font-size:13px}
.side-head a{padding:6px 0}
.side-close{display:none;width:44px;height:44px;border:0;background:none;font-size:22px;margin:-10px -12px -10px 0}
.search{margin:4px 14px 10px;padding:0 12px;height:40px;width:calc(100% - 28px);border:1px solid var(--line);border-radius:6px;background:#EFEBE4;outline:none;font-size:14px}
.search:focus{border-color:rgba(36,35,31,.45)}.search::placeholder{color:var(--muted)}
.tree{flex:1;overflow:auto;padding:0 6px 12px;overscroll-behavior:contain}
.group-head{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border:0;background:none;text-align:left;font-size:13px;letter-spacing:.08em;border-radius:6px}
.group-head:hover,.row:hover,.row.is-hover{background:#0000000a}
.group-head .caret{display:inline-flex;align-items:center;justify-content:center;width:28px;height:40px;margin-left:-8px;transition:transform .2s;color:var(--muted)}
.group.is-closed .caret{transform:rotate(-90deg)}.group.is-closed .rows{display:none}
.group-head .count{margin-left:auto;color:var(--muted);font-size:12px}
.row{display:block;width:100%;min-height:40px;padding:8px 10px 8px 30px;border:0;background:none;text-align:left;font-size:14px;border-radius:6px;color:rgba(36,35,31,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.is-active{background:#00000014;color:var(--fg)}
.hidden{display:none!important}
.side-foot{padding:10px 16px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.08em}

/* stage */
.stage{position:fixed;inset:0 0 0 var(--side);overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#EEEAE3 0%,#E9E5DE 62%,#E1DCD3 100%)}
#graph{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#graph.on-node{cursor:pointer}#graph.panning{cursor:grabbing}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 14px;pointer-events:none}.site-title{flex:none}
.topbar>*{pointer-events:auto}
.site-title{font-size:13px;letter-spacing:.22em;padding:12px 0;}
.nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap;min-width:0}.nav a{padding:12px 9px;font-size:12px;letter-spacing:.16em;color:var(--muted)}.nav a:hover{color:var(--fg)}
.list-btn{display:none;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:#E9E5DEcc;font-size:12px;letter-spacing:.14em}
.status{position:absolute;left:16px;bottom:16px;z-index:4;color:var(--muted);font-size:12px;letter-spacing:.1em;pointer-events:none}
.tools{position:absolute;z-index:6;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.tools button{min-width:40px;height:40px;border:1px solid var(--line);border-radius:20px;background:#E9E5DED9;font-size:18px;line-height:1}
.tools button:hover{border-color:rgba(36,35,31,.5)}
.tools .zoom-label{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.tools .reset{font-size:12px;letter-spacing:.1em;padding:0 14px}

/* detail card */
.card{position:absolute;z-index:7;right:14px;top:64px;width:min(340px,calc(100% - 28px));max-height:calc(100% - 140px);overflow:auto;background:#EFEBE4f2;border:1px solid var(--line);border-radius:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s}
.card.is-open{opacity:1;transform:none;pointer-events:auto}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px 10px 0 0;background:#D9D4CA}
.card-body{padding:16px 18px 18px}
.card-cat{font-size:12px;letter-spacing:.16em;color:var(--muted)}
.card-title{margin:6px 0 0;font-size:20px;font-weight:400;line-height:1.45;overflow-wrap:anywhere}
.card-desc{margin:12px 0 0;color:rgba(36,35,31,.8);font-size:15px;line-height:1.85;white-space:pre-line}
.card-open{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;color:var(--fg);letter-spacing:.1em;font-size:13px;border-bottom:1px solid var(--line)}
.card-links{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.card-links button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:none;font-size:13px;color:rgba(36,35,31,.8)}
.card-close{position:absolute;right:6px;top:6px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:#E9E5DEcc;font-size:22px}

@media(max-width:760px){
 :root{--side:min(300px,86vw)}
 .side{transform:translateX(-102%);box-shadow:0 0 40px #0003}
 body.list-open .side{transform:none}
 .side-close{display:block}
 .stage{left:0}
 .list-btn{display:block}
 .nav{display:none}
 .topbar{padding:max(6px,env(safe-area-inset-top)) 12px 6px}
 .site-title{font-size:13px}
 .status{bottom:max(16px,env(safe-area-inset-bottom));left:14px}
 .tools{right:10px;bottom:max(12px,env(safe-area-inset-bottom))}
 .tools button{min-width:44px;height:44px}
 .card{left:10px;right:10px;top:auto;bottom:max(10px,env(safe-area-inset-bottom));width:auto;max-height:58dvh}
 .card img{aspect-ratio:16/10}
 body.has-card .tools,body.has-card .status{display:none}
 .nav-m{display:flex;flex-wrap:wrap;gap:0 6px;padding:2px 10px 12px}.nav-m a{padding:12px 8px;font-size:13px;letter-spacing:.14em;color:var(--muted)}
}
@media(min-width:761px){.nav-m{display:none}}
@media(prefers-reduced-motion:reduce){.side,.card{transition:none}}

/* intro: 最初に出る一文。タップで消える（消え方の長さは --intro-fade） */
.intro{--intro-fade:3s;position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));background:rgba(0,0,0,.8);color:#F2EFEA;cursor:pointer;outline:none;opacity:1;transition:opacity var(--intro-fade) ease-in-out}
.intro.is-closing{opacity:0;pointer-events:none}
.intro-text{margin:0;max-width:30em;font-size:clamp(15px,3.9vw,21px);font-weight:300;line-height:2.3;letter-spacing:.1em;text-align:center}
.intro-text .cl{display:block}
.intro-text .ph{display:inline-block}
@media(prefers-reduced-motion:reduce){.intro{--intro-fade:.4s}}
</style>
</head>
<body>
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="はじめに" tabindex="0">
 <p class="intro-text"><span class="cl"><span class="ph">これは、</span><span class="ph">保存・分類するための</span><span class="ph">アーカイブではなく、</span></span><span class="cl"><span class="ph">過程を記録し、</span><span class="ph">未来に開くための</span><span class="ph">アーカイブです。</span></span></p>
</div>
<noscript><style>.intro{display:none}</style></noscript>
<script>
(()=>{
const intro=document.getElementById('intro');if(!intro)return;
let closing=false;
const done=()=>intro.remove();
const close=()=>{
 if(closing)return;closing=true;
 intro.classList.add('is-closing');
 intro.addEventListener('transitionend',e=>{if(e.target===intro&&e.propertyName==='opacity')done()});
 setTimeout(done,parseFloat(getComputedStyle(intro).transitionDuration)*1000+600);
};
intro.addEventListener('click',close);
intro.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();close()}});
intro.focus({preventScroll:true});
})();
</script>

 <div class="side-head"><a href="index.html">SAKATA YUSHI</a><button class="side-close" id="side-close" type="button" aria-label="Close list">×</button></div>
 <input class="search" id="search" type="search" placeholder="Search" aria-label="Search records" autocomplete="off">
 <nav class="nav-m" aria-label="Site pages"><a href="books.html">BOOKSHELF</a><a href="archive.html">ALL</a><a href="archive.html?category=ARCHITECTURE">ARCHITECTURE</a><a href="archive.html?category=OBJECT">OBJECT</a><a href="archive.html?category=FOOD">FOOD</a><a href="archive.html?category=BOOK">BOOK</a><a href="text.html">TEXT</a><a href="archive.html?category=PHOTO">PHOTO</a><a href="archive.html?category=PLACE">PLACE</a><a href="archive.html?category=OTHER">OTHER</a><a href="about.html">ABOUT</a></nav>

 <div class="topbar"><button class="list-btn" id="list-btn" type="button" aria-expanded="false">LIST</button><a class="site-title" href="index.html">SAKATA YUSHI</a><nav class="nav" aria-label="Site pages"><a href="books.html">BOOKSHELF</a><a href="archive.html">ALL</a><a href="archive.html?category=ARCHITECTURE">ARCHITECTURE</a><a href="archive.html?category=OBJECT">OBJECT</a><a href="archive.html?category=FOOD">FOOD</a><a href="archive.html?category=BOOK">BOOK</a><a href="text.html">TEXT</a><a href="archive.html?category=PHOTO">PHOTO</a><a href="archive.html?category=PLACE">PLACE</a><a href="archive.html?category=OTHER">OTHER</a><a href="about.html">ABOUT</a></nav></div>
 <p class="status" id="status">AN ARCHIVE OF CURIOSITIES</p>
 <div class="tools" aria-label="View controls"><button type="button" id="zoom-out" aria-label="Zoom out">−</button><span class="zoom-label" id="zoom-label">50%</span><button type="button" id="zoom-in" aria-label="Zoom in">+</button><button type="button" class="reset" id="view-reset">RESET</button></div>
 <article class="card" id="card" aria-live="polite"></article>

<script>
(()=>{
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('graph'),ctx=cv.getContext('2d'),tree=$('tree'),search=$('search'),card=$('card'),status=$('status'),zoomLabel=$('zoom-label');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=()=>matchMedia('(max-width:760px)').matches;
const FONT='"Hiragino Sans","Yu Gothic UI",Meiryo,Arial,sans-serif';
const PLACEHOLDER=/^(本のタイトル|写真のタイトル)$/;

/* zoom: 10%..100% in 10% steps (initial 50%) mapped onto scale .2..3 */
const MINS=.2,MAXS=3,INIT_PCT=50;
const pctToScale=p=>MINS*Math.pow(MAXS/MINS,(p-10)/90);
const scaleToPct=s=>10+90*Math.log(s/MINS)/Math.log(MAXS/MINS);
const clampS=s=>Math.max(MINS,Math.min(MAXS,s));

let W=0,H=0,dpr=1;
const view={cx:0,cy:0,s:pctToScale(INIT_PCT),ts:pctToScale(INIT_PCT),tcx:0,tcy:0,anchor:null};
let nodes=[],edges=[],adj=new Map(),byId=new Map();
let hover=null,selected=null,query='',time=0,dragging=false;

function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
const toWorld=(x,y)=>({x:(x-W/2)/view.s+view.cx,y:(y-H/2)/view.s+view.cy});
const toScreen=(x,y)=>({x:(x-view.cx)*view.s+W/2,y:(y-view.cy)*view.s+H/2});
const isPlaceholder=it=>PLACEHOLDER.test(it.title||'')||!it.title;

/* ---------- build graph ---------- */
function build(items,extra){
 nodes=[];edges=[];adj=new Map();byId=new Map();
 const add=n=>{nodes.push(n);byId.set(n.id,n);adj.set(n.id,new Set());return n};
 const link=(a,b,kind,len)=>{if(a===b||adj.get(a).has(b))return;adj.get(a).add(b);adj.get(b).add(a);edges.push({a:byId.get(a),b:byId.get(b),kind,len})};
 add({id:'root',type:'root',label:'SAKATA YUSHI',r:8,col:26,x:0,y:0,vx:0,vy:0});
 const cats=[...new Set(items.map(x=>x.category||'ARCHIVE'))].sort();
 cats.forEach((c,i)=>{const a=i/cats.length*Math.PI*2-Math.PI/2;add({id:'cat:'+c,type:'cat',cat:c,label:c,r:6,col:22,x:Math.cos(a)*170,y:Math.sin(a)*170,vx:0,vy:0});link('root','cat:'+c,'hub',150)});
 items.forEach((it,i)=>{
  const id=it.detailPage||it.image||('item'+i),c=it.category||'ARCHIVE',hub=byId.get('cat:'+c);
  const file=(it.detailPage||'').replace(/\.html$/,'');
  const src=it.coverImage||it.image||null;
  const n=add({id,type:'item',cat:c,item:it,label:isPlaceholder(it)?(file||'Untitled'):it.title,file:file||it.title||'Untitled',src,r:4.5,col:src?34:22,x:hub.x+Math.cos(i*2.4)*90,y:hub.y+Math.sin(i*2.4)*90,vx:0,vy:0});
  if(src){const img=new Image();img.decoding='async';img.onload=()=>{n.img=img};img.src=src}
  link('cat:'+c,id,'cat',92);
 });
 // records captured on the same day are linked
 const days=new Map();
 items.forEach(it=>{const d=(it.capturedAt||'').slice(0,10);if(!d)return;if(!days.has(d))days.set(d,[]);days.get(d).push(it.detailPage||it.image)});
 days.forEach(ids=>{for(let i=1;i<ids.length;i++)link(ids[i-1],ids[i],'day',130)});
 // hand-written links: graph-links.json = [["food-01.html","text-01.html"], ...]
 (extra||[]).forEach(p=>{if(Array.isArray(p)&&byId.has(p[0])&&byId.has(p[1]))link(p[0],p[1],'manual',130)});
 nodes.forEach(n=>{n.deg=adj.get(n.id).size;if(n.type==='item')n.r=4+Math.min(4,n.deg*.7)});
 for(let i=0;i<260;i++)step(true);
 nodes.forEach(n=>{n.vx=n.vy=0});
 centerView();view.cx=view.tcx;view.cy=view.tcy;
}
function centerView(){const it=nodes.filter(n=>n.type!=='root');let sx=0,sy=0;it.forEach(n=>{sx+=n.x;sy+=n.y});view.tcx=sx/(it.length||1);view.tcy=sy/(it.length||1)}

/* ---------- physics (gentle, always floating) ---------- */
function step(warm){
 const n=nodes.length;
 for(let i=0;i<n;i++){const a=nodes[i];for(let j=i+1;j<n;j++){const b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}const d=Math.sqrt(d2);let f=2400/d2;const m=a.col+b.col;if(d<m)f+=(m-d)*.04;const fx=dx/d*f,fy=dy/d*f;a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy}}
 for(const e of edges){const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,f=(d-e.len)*.012,fx=dx/d*f,fy=dy/d*f;e.a.vx+=fx;e.a.vy+=fy;e.b.vx-=fx;e.b.vy-=fy}
 for(const a of nodes){
  a.vx-=a.x*.0022;a.vy-=a.y*.0022;
  if(!warm&&!reduced){const p=time*.0006+a.x*.01;a.vx+=Math.sin(p+a.y*.013)*.012;a.vy+=Math.cos(p*1.3+a.x*.011)*.012}
  if(a.fixed||(a.type==='root'&&!warm)){a.vx=a.vy=0;continue}
  a.vx*=.84;a.vy*=.84;a.x+=a.vx;a.y+=a.vy;
 }
}

/* ---------- drawing ---------- */
const clamp01=v=>Math.max(0,Math.min(1,v));
function matches(n){
 if(!query)return true;
 if(n.type==='item')return [n.label,n.file,n.cat,n.item.description||''].join(' ').toLowerCase().includes(query);
 if(n.type==='cat')return nodes.some(x=>x.type==='item'&&x.cat===n.cat&&matches(x));
 return true;
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const s=view.s,fnode=hover||selected;
 let fs=null;if(fnode){fs=new Set(adj.get(fnode.id));fs.add(fnode.id)}
 for(const e of edges){
  const a=toScreen(e.a.x,e.a.y),b=toScreen(e.b.x,e.b.y);
  const inFocus=fnode&&(e.a===fnode||e.b===fnode);
  let al=(e.kind==='hub'||e.kind==='cat')?.2:.3;
  if(fs)al=inFocus?.75:.05;
  if(query&&!(matches(e.a)&&matches(e.b)))al*=.3;
  ctx.strokeStyle='rgba(36,35,31,'+al+')';ctx.lineWidth=inFocus?1.4:1;
  ctx.setLineDash(e.kind==='day'||e.kind==='manual'?[4,4]:[]);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 ctx.setLineDash([]);
 const thumbA=clamp01((s-.85)/.3);
 const order=nodes.slice().sort((a,b)=>(a===selected)-(b===selected)||(a===hover)-(b===hover));
 for(const n of order){
  const p=toScreen(n.x,n.y);
  n._sx=p.x;n._sy=p.y;
  if(p.x<-120||p.y<-120||p.x>W+120||p.y>H+120)continue;
  let al=1;if(fs&&!fs.has(n.id))al=.18;if(query&&!matches(n))al=Math.min(al,.1);
  const isSel=n===selected,isHov=n===hover;
  const r=n.r*Math.max(.8,Math.min(1.8,Math.pow(s,.35)));
  const hasThumb=n.type==='item'&&!!n.img&&thumbA>0;
  ctx.globalAlpha=al*(hasThumb?1-thumbA:1);
  if(!hasThumb||thumbA<1){
   ctx.fillStyle=isSel||isHov?'#24231F':n.type==='item'?'#8A867D':'#4A4842';
   ctx.beginPath();ctx.arc(p.x,p.y,r+(isSel||isHov?1.5:0),0,Math.PI*2);ctx.fill();
   if(n.type!=='item'){ctx.strokeStyle='rgba(36,35,31,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.stroke()}
  }
  let half=r;
  if(hasThumb){
   const size=Math.round(46*s),x=p.x-size/2,y=p.y-size/2,im=n.img,m=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-m)/2,sy=(im.naturalHeight-m)/2;
   ctx.globalAlpha=al*thumbA;
   ctx.drawImage(im,sx,sy,m,m,x,y,size,size);
   if(isSel||isHov){ctx.strokeStyle='#24231F';ctx.lineWidth=1.5;ctx.strokeRect(x-1,y-1,size+2,size+2)}
   if(thumbA>.5)half=size/2;
  }
  n._sr=half;
  let la=n.type==='root'?1:n.type==='cat'?.85:clamp01((s-.55)/.45);
  if(isHov||isSel||(fs&&fs.has(n.id)&&s>.4))la=Math.max(la,.95);
  la*=al;
  if(la>.02){
   ctx.globalAlpha=la;ctx.fillStyle='#24231F';
   ctx.font='13px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
   let t=n.label;const max=(isHov||isSel)?30:18;if(t.length>max)t=t.slice(0,max)+'…';
   ctx.letterSpacing=n.type==='item'?'0px':'2px';
   ctx.fillText(t,p.x,p.y+half+(n.type==='item'?8:12));
  }
 }
 ctx.globalAlpha=1;ctx.letterSpacing='0px';
}

/* ---------- loop ---------- */
function frame(t){
 time=t;
 step(false);
 const k=reduced?1:.2;
 view.s+=(view.ts-view.s)*k;if(Math.abs(view.ts-view.s)<.0005)view.s=view.ts;
 if(view.anchor){view.cx=view.anchor.wx-(view.anchor.mx-W/2)/view.s;view.cy=view.anchor.wy-(view.anchor.my-H/2)/view.s;view.tcx=view.cx;view.tcy=view.cy}
 else{
  if(selected&&!dragging&&!gesture){view.tcx=selected.x;view.tcy=selected.y}
  view.cx+=(view.tcx-view.cx)*k;view.cy+=(view.tcy-view.cy)*k;
 }
 zoomLabel.textContent=Math.round(scaleToPct(view.ts)/10)*10+'%';
 draw();requestAnimationFrame(frame)
}

/* ---------- interaction ---------- */
const ptrs=new Map();let gesture=null,pinch=null;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function hit(x,y){let best=null,bd=1e9;for(const n of nodes){if(n._sx==null)continue;const d=Math.hypot(n._sx-x,n._sy-y),rad=(n._sr||0)+(mobile()?14:8);if(d<rad&&d<bd){best=n;bd=d}}return best}
let anchorTimer=0;
function zoomTo(ts,mx,my){
 ts=clampS(ts);const w=toWorld(mx,my);view.ts=ts;view.anchor={mx,my,wx:w.x,wy:w.y};clearTimeout(anchorTimer);anchorTimer=setTimeout(()=>{view.anchor=null;view.tcx=view.cx;view.tcy=view.cy},450)
}
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);const p=pos(e);ptrs.set(e.pointerId,p);view.anchor=null;
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,w=toWorld(mx,my);pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:view.ts,wx:w.x,wy:w.y};if(gesture&&gesture.n)gesture.n.fixed=false;gesture=null;return}
 const n=hit(p.x,p.y);gesture={n,id:e.pointerId,sx:p.x,sy:p.y,cx:view.cx,cy:view.cy,moved:false};
 if(n){n.fixed=true}else cv.classList.add('panning');
});
cv.addEventListener('pointermove',e=>{
 const p=pos(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);
 if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y)||1;const s=clampS(pinch.s*d/pinch.d);view.s=view.ts=s;view.cx=view.tcx=pinch.wx-(mx-W/2)/s;view.cy=view.tcy=pinch.wy-(my-H/2)/s;return}
 if(gesture&&gesture.id===e.pointerId){
  const dx=p.x-gesture.sx,dy=p.y-gesture.sy;if(Math.hypot(dx,dy)>(e.pointerType==='touch'?8:4))gesture.moved=true;
  if(gesture.moved){
   if(gesture.n){dragging=true;const w=toWorld(p.x,p.y);gesture.n.x=w.x;gesture.n.y=w.y;gesture.n.vx=gesture.n.vy=0}
   else{selected=null;view.cx=view.tcx=gesture.cx-dx/view.s;view.cy=view.tcy=gesture.cy-dy/view.s}
  }
  return;
 }
 if(e.pointerType==='mouse'){const n=hit(p.x,p.y);if(n!==hover){hover=n;cv.classList.toggle('on-node',!!n);syncRows()}}
});
function release(e){
 ptrs.delete(e.pointerId);cv.classList.remove('panning');
 if(pinch){if(ptrs.size<2)pinch=null;gesture=null;return}
 if(gesture&&gesture.id===e.pointerId){
  const g=gesture;gesture=null;dragging=false;if(g.n)g.n.fixed=false;
  if(!g.moved&&e.type==='pointerup'){if(g.n)select(g.n);else deselect()}
  else if(g.moved&&!g.n&&card.classList.contains('is-open'))deselect();
 }
 if(e.pointerType!=='mouse'&&hover){hover=null;syncRows()}
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&hover&&!gesture){hover=null;cv.classList.remove('on-node');syncRows()}});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomTo(view.ts*Math.exp(-dy*(e.ctrlKey?.01:.0016)),p.x,p.y)},{passive:false});
const stepZoom=d=>{const pct=Math.round(scaleToPct(view.ts)/10)*10+d*10;zoomTo(pctToScale(Math.max(10,Math.min(100,pct))),W/2,H/2)};
$('zoom-in').onclick=()=>stepZoom(1);$('zoom-out').onclick=()=>stepZoom(-1);
$('view-reset').onclick=()=>{view.anchor=null;deselect();centerView();view.ts=pctToScale(INIT_PCT)};

/* ---------- selection + card ---------- */
const catHref=c=>c==='TEXT'?'text.html':'archive.html?category='+encodeURIComponent(c);
function select(n){
 selected=n;view.anchor=null;view.tcx=n.x;view.tcy=n.y;view.ts=clampS(Math.max(view.ts,mobile()?1.1:1.2));
 if(mobile())document.body.classList.remove('list-open');
 showCard(n);syncRows();
}
function deselect(){selected=null;card.classList.remove('is-open');document.body.classList.remove('has-card');syncRows()}
function showCard(n){
 card.replaceChildren();
 const close=document.createElement('button');close.className='card-close';close.type='button';close.setAttribute('aria-label','Close');close.textContent='×';close.onclick=deselect;
 const body=document.createElement('div');body.className='card-body';
 const cat=document.createElement('div');cat.className='card-cat';cat.textContent=n.type==='item'?n.cat:n.type==='cat'?'CATEGORY':'HOME';
 const h=document.createElement('h2');h.className='card-title';h.textContent=n.type==='item'?n.label:n.label;
 body.append(cat,h);
 if(n.type==='item'){
  if(n.src){const img=document.createElement('img');img.src=n.src;img.alt='';card.append(img)}
  const d=n.item.description||n.item.excerpt||'';if(d){const p=document.createElement('p');p.className='card-desc';p.textContent=d;body.append(p)}
  if(n.item.detailPage){const a=document.createElement('a');a.className='card-open';a.href=n.item.detailPage;a.textContent='MORE ↗';body.append(a)}
 }else{
  const cnt=n.type==='cat'?nodes.filter(x=>x.type==='item'&&x.cat===n.cat).length:nodes.filter(x=>x.type==='item').length;
  const p=document.createElement('p');p.className='card-desc';p.textContent=cnt+' RECORDS';body.append(p);if(n.type==='cat'){const a=document.createElement('a');a.className='card-open';a.href=catHref(n.cat);a.textContent='MORE ↗';body.append(a)}
 }
 const rel=[...adj.get(n.id)].map(id=>byId.get(id)).filter(x=>x.type==='item');
 if(rel.length&&n.type==='item'){const box=document.createElement('div');box.className='card-links';rel.forEach(r=>{const b=document.createElement('button');b.type='button';b.textContent=r.label.length>16?r.label.slice(0,16)+'…':r.label;b.onclick=()=>select(r);box.append(b)});body.append(box)}
 card.append(close,body);card.classList.add('is-open');card.scrollTop=0;
 if(mobile())document.body.classList.add('has-card');
}

/* ---------- left list ---------- */
const rowFor=new Map();
function buildTree(){
 tree.replaceChildren();rowFor.clear();
 nodes.filter(n=>n.type==='cat').forEach(c=>{
  const g=document.createElement('div');g.className='group';
  const items=nodes.filter(n=>n.type==='item'&&n.cat===c.cat);
  const head=document.createElement('button');head.type='button';head.className='group-head';head.innerHTML='<span class="caret">▾</span><span></span><span class="count"></span>';
  head.children[1].textContent=c.cat;head.children[2].textContent=items.length;
  head.onclick=e=>{if(e.target.closest('.caret')){g.classList.toggle('is-closed');return}select(c);g.classList.remove('is-closed')};
  head.addEventListener('mouseenter',()=>{hover=c;syncRows()});head.addEventListener('mouseleave',()=>{hover=null;syncRows()});
  const rows=document.createElement('div');rows.className='rows';
  items.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='row';b.textContent=n.label;b.title=n.label;b.onclick=()=>select(n);b.addEventListener('mouseenter',()=>{hover=n;syncRows()});b.addEventListener('mouseleave',()=>{hover=null;syncRows()});rows.append(b);rowFor.set(n.id,b)});
  g.append(head,rows);tree.append(g);
 });
}
function syncRows(){
 rowFor.forEach((b,id)=>{b.classList.toggle('is-active',!!selected&&selected.id===id);b.classList.toggle('is-hover',!!hover&&hover.id===id)});
 if(selected&&rowFor.has(selected.id)){const b=rowFor.get(selected.id);b.parentElement.parentElement.classList.remove('is-closed');const tr=tree.getBoundingClientRect(),br=b.getBoundingClientRect();if(br.top<tr.top||br.bottom>tr.bottom)b.scrollIntoView({block:'nearest'})}
}
search.addEventListener('input',()=>{
 query=search.value.trim().toLowerCase();
 rowFor.forEach((b,id)=>b.classList.toggle('hidden',!matches(byId.get(id))));
 tree.querySelectorAll('.group').forEach(g=>{const any=[...g.querySelectorAll('.row')].some(r=>!r.classList.contains('hidden'));g.classList.toggle('hidden',!any);if(query&&any)g.classList.remove('is-closed')});
 const total=nodes.filter(n=>n.type==='item').length,cnt=nodes.filter(n=>n.type==='item'&&matches(n)).length;
 status.textContent=query?cnt+' MATCHES':total+' RECORDS';
});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=nodes.find(n=>n.type==='item'&&matches(n));if(f)select(f)}});

/* mobile drawer */
const openList=v=>{document.body.classList.toggle('list-open',v);$('list-btn').setAttribute('aria-expanded',String(v))};
$('list-btn').onclick=()=>openList(!document.body.classList.contains('list-open'));$('side-close').onclick=()=>openList(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){deselect();openList(false)}});
window.addEventListener('resize',resize);

/* ---------- start ---------- */
resize();
Promise.all([
 fetch('archive-data.json').then(r=>{if(!r.ok)throw Error('Archive data unavailable');return r.json()}),
 fetch('graph-links.json').then(r=>r.ok?r.json():[]).catch(()=>[])
]).then(([data,extra])=>{
 const items=(Array.isArray(data)?data:(data.items||[])).filter(x=>x.image||x.coverImage||x.title);
 build(items,extra);buildTree();
 const total=items.length;status.textContent=total+' RECORDS';$('side-foot').textContent=total+' RECORDS · AN ARCHIVE OF CURIOSITIES';
 requestAnimationFrame(frame);
}).catch(err=>{console.error(err);status.textContent='ARCHIVE DATA COULD NOT BE LOADED'});
})();
</script>
</body>

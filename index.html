<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>坂田雄志｜Archive</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #111;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 18px;
    }

    .about-link {
      font-size: 14px;
    }

    main {
      padding: 30px;
    }

    .intro {
      margin-bottom: 55px;
      max-width: 700px;
    }

    .intro-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }

    .intro-text {
      font-size: 22px;
      line-height: 1.7;
      margin: 0;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;

      margin-bottom: 35px;

      border-top: 1px solid #111;
      padding-top: 15px;
    }

    .category {
      border: none;
      padding: 0;

      background: none;

      color: #111;

      font-family: inherit;
      font-size: 13px;

      cursor: pointer;

      text-decoration: none;
    }

    .category:hover {
      opacity: 0.5;
    }

    .category.active {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .archive {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 35px 20px;
    }

    .item {
      display: block;

      color: #111;

      text-decoration: none;
    }

    .item-image {
      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      display: block;

      margin-bottom: 12px;
    }

    .item-title {
      font-size: 15px;

      line-height: 1.5;

      margin-bottom: 5px;
    }

    .item-meta {
      font-size: 12px;

      color: #777;

      line-height: 1.5;
    }

    .item:hover .item-image {
      opacity: 0.7;
    }

    .loading {
      font-size: 13px;
      color: #777;
    }

    footer {
      padding:
        100px
        30px
        30px;

      font-size: 12px;

      color: #666;
    }

    @media (max-width: 800px) {

      header {
        padding:
          18px
          20px;
      }

      main {
        padding:
          20px;
      }

      .archive {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 25px 15px;
      }

      .intro-text {
        font-size: 20px;
      }

    }

    @media (max-width: 500px) {

      .archive {
        grid-template-columns:
          1fr;
      }

      .categories {
        gap: 12px;
      }

    }

  </style>

</head>


<body>


  <header>

    <a
      href="index.html"
      class="site-title"
    >
      坂田雄志
    </a>

    <a
      href="about.html"
      class="about-link"
    >
      About
    </a>

  </header>


  <main>


    <section class="intro">

      <div class="intro-title">
        ARCHIVE
      </div>

      <p class="intro-text">
        建築、もの、食べもの、本、文章、写真、場所。
        身の回りのものを記録しています。
      </p>

    </section>


    <nav class="categories">

      <button
        class="category active"
        data-category="ALL"
      >
        ALL
      </button>

      <button
        class="category"
        data-category="ARCHITECTURE"
      >
        ARCHITECTURE
      </button>

      <button
        class="category"
        data-category="OBJECT"
      >
        OBJECT
      </button>

      <button
        class="category"
        data-category="FOOD"
      >
        FOOD
      </button>

      <a
        href="books.html"
        class="category"
      >
        BOOK
      </a>

      <button
        class="category"
        data-category="TEXT"
      >
        TEXT
      </button>

      <a
        href="photos.html"
        class="category"
      >
        PHOTO
      </a>

      <button
        class="category"
        data-category="PLACE"
      >
        PLACE
      </button>

    </nav>


    <section
      class="archive"
      id="archive"
    >

      <div class="loading">
        Archiveを読み込んでいます。
      </div>

    </section>


  </main>


  <footer>

    © 坂田雄志

  </footer>


  <script>

    const archive =
      document.getElementById("archive");


    const categoryButtons =
      document.querySelectorAll(
        ".category[data-category]"
      );


    let archiveItems = [];


    /*
      GitHubのリポジトリから
      画像ファイル一覧を取得
    */

    fetch(
      "https://api.github.com/repos/haosakata-glitch/sakata-website/contents/"
    )

      .then(response => response.json())

      .then(files => {

        const images =
          files.filter(
            file =>
              file.type === "file" &&
              /\.(jpg|jpeg|png|webp)$/i.test(
                file.name
              )
          );


        archiveItems =
          images.map(file => {

            let category = "PHOTO";


            if (
              file.name.startsWith("work-")
            ) {
              category = "ARCHITECTURE";
            }

            if (
              file.name.startsWith("book-")
            ) {
              category = "BOOK";
            }

            if (
              file.name.startsWith("food-")
            ) {
              category = "FOOD";
            }

            if (
              file.name.startsWith("object-")
            ) {
              category = "OBJECT";
            }

            if (
              file.name.startsWith("place-")
            ) {
              category = "PLACE";
            }

            if (
              file.name.startsWith("text-")
            ) {
              category = "TEXT";
            }


            return {

              category:
                category,

              title:
                file.name
                  .replace(/\.[^/.]+$/, "")
                  .replace(/[-_]/g, " "),

              image:
                file.name,

              link:
                "#"

            };

          });


        displayItems("ALL");

      })

      .catch(error => {

        archive.innerHTML =
          "<div class='loading'>Archiveを読み込めませんでした。</div>";

        console.error(error);

      });


    function displayItems(
      selectedCategory
    ) {

      archive.innerHTML = "";


      const filteredItems =
        archiveItems.filter(
          item =>
            selectedCategory === "ALL" ||
            item.category === selectedCategory
        );


      filteredItems.forEach(
        item => {

          const element =
            document.createElement("div");

          element.className =
            "item";


          element.innerHTML = `

            <img
              src="${item.image}"
              alt=""
              class="item-image"
            >

            <div class="item-title">
              ${item.title}
            </div>

            <div class="item-meta">
              ${item.category}
            </div>

          `;


          archive.appendChild(
            element
          );

        }
      );

    }


    categoryButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const selectedCategory =
              button.dataset.category;


            categoryButtons.forEach(
              button => {

                button.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            displayItems(
              selectedCategory
            );

          }
        );

      }
    );

  </script>


</body>
</html>

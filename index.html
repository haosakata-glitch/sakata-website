<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKATA KATSUYUKI</title>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: #E9E5DE;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    line-height: 1.45;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font: inherit;
    color: inherit;
  }

  /* =========================
     HEADER
  ========================= */

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(233,229,222,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(34,34,34,0.12);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    min-height: 58px;
    padding: 0 22px;
  }

  .site-title {
    font-size: 13px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .main-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    flex-wrap: wrap;
  }

  .main-nav a,
  .main-nav button {
    position: relative;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .main-nav a:hover,
  .main-nav button:hover {
    opacity: 0.55;
  }

  .main-nav .active {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .about-link {
    margin-left: 10px;
    padding-left: 18px !important;
    border-left: 1px solid rgba(34,34,34,0.3) !important;
  }

  /* =========================
     MAIN
  ========================= */

  main {
    padding-top: 88px;
  }

  .archive {
    padding: 0 22px 70px;
  }

  /* =========================
     ARCHIVE GRID
  ========================= */

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    column-gap: 18px;
    row-gap: 18px;
    align-items: start;
  }

  .archive-item {
    position: relative;
    display: block;
    width: 100%;
    overflow: hidden;
  }

  .archive-image-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #ddd8d0;
  }

  .archive-image {
    display: block;
    width: 100%;
    height: auto;
  }

  /* =========================
     HOVER OVERLAY
  ========================= */

  .archive-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background: rgba(233,229,222,0.82);
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }

  .archive-item:hover .archive-overlay,
  .archive-item:focus-visible .archive-overlay {
    opacity: 1;
  }

  .archive-overlay-inner {
    text-align: center;
  }

  .archive-title {
    font-size: 13px;
    line-height: 1.4;
  }

  .archive-category {
    margin-top: 5px;
    font-size: 10px;
    letter-spacing: 0.08em;
    opacity: 0.65;
  }

  /* =========================
     ABOUT
  ========================= */

  .about {
    margin-top: 90px;
    padding-top: 24px;
    border-top: 1px solid rgba(34,34,34,0.25);
  }

  .about-inner {
    max-width: 900px;
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 30px;
  }

  .about-label {
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  .about-text {
    max-width: 650px;
  }

  .about-name {
    margin-bottom: 20px;
    font-size: 15px;
  }

  .about-profile {
    margin: 0 0 25px;
  }

  .about-contact {
    margin: 0;
  }

  .about-contact a {
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* =========================
     RESPONSIVE
  ========================= */

  @media (max-width: 900px) {
    .header-inner {
      padding: 0 18px;
    }

    .main-nav {
      gap: 14px;
    }

    .archive {
      padding-left: 18px;
      padding-right: 18px;
    }

    .archive-grid {
      column-gap: 14px;
      row-gap: 14px;
    }
  }

  @media (max-width: 650px) {
    .header-inner {
      align-items: flex-start;
      flex-direction: column;
      gap: 8px;
      padding-top: 13px;
      padding-bottom: 13px;
    }

    .main-nav {
      justify-content: flex-start;
      gap: 9px 13px;
    }

    .about-link {
      margin-left: 4px;
      padding-left: 13px !important;
    }

    main {
      padding-top: 125px;
    }

    .archive {
      padding-left: 10px;
      padding-right: 10px;
    }

    .archive-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 10px;
      row-gap: 10px;
    }

    .about {
      margin-top: 60px;
    }

    .about-inner {
      grid-template-columns: 1fr;
      gap: 18px;
    }
  }

  @media (hover: none) {
    .archive-overlay {
      display: none;
    }
  }
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="site-title">
      SAKATA KATSUYUKI
    </a>

    <nav class="main-nav">

      <button type="button" data-category="ALL" class="active">
        ALL
      </button>

      <button type="button" data-category="ARCHITECTURE">
        ARCHITECTURE
      </button>

      <button type="button" data-category="OBJECT">
        OBJECT
      </button>

      <button type="button" data-category="FOOD">
        FOOD
      </button>

      <a href="book.html">
        BOOK
      </a>

      <button type="button" data-category="TEXT">
        TEXT
      </button>

      <button type="button" data-category="PHOTO">
        PHOTO
      </button>

      <button type="button" data-category="PLACE">
        PLACE
      </button>

      <button type="button" data-category="OTHER">
        OTHER
      </button>

      <a href="#about" class="about-link">
        ABOUT
      </a>

    </nav>

  </div>
</header>


<main>

  <section class="archive">
    <div id="archive-grid" class="archive-grid"></div>

    <section id="about" class="about">

      <div class="about-inner">

        <div class="about-label">
          ABOUT
        </div>

        <div class="about-text">

          <div class="about-name">
            坂田雄志 / Sakata Katsuyuki
          </div>

          <p class="about-profile">
            建築家。<br>
            2016–2020 近畿大学建築学部建築学科 松岡聡研究室<br>
            2020–2023 横浜国立大学大学院 Y-GSA<br>
            2023–2024 平田明久建築設計事務所<br>
            2024–2026 Archipelago Architects Studio
          </p>

          <p class="about-contact">
            <a href="mailto:hao.sakata@gmail.com">
              hao.sakata@gmail.com
            </a><br>
            <a href="https://www.instagram.com/katsu_0708/" target="_blank" rel="noopener">
              Instagram
            </a><br>
            <a href="https://x.com/Katsuskt" target="_blank" rel="noopener">
              X
            </a><br>
            <a href="https://note.com/kind_nerine7" target="_blank" rel="noopener">
              note
            </a>
          </p>

        </div>

      </div>

    </section>
  </section>

</main>


<script>
  const archiveGrid = document.getElementById("archive-grid");
  const categoryButtons = document.querySelectorAll("[data-category]");

  let archiveData = [];

  function getCategoryFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("category");
  }

  function setActiveCategory(category) {
    categoryButtons.forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.category === category
      );
    });
  }

  function renderArchive(category = "ALL") {

    archiveGrid.innerHTML = "";

    const filtered =
      category === "ALL"
        ? archiveData
        : archiveData.filter(item => {
            return item.category === category;
          });

    filtered.forEach(item => {

      const link = document.createElement("a");

      link.className = "archive-item";
      link.href = item.detailPage || "#";

      const imageWrap = document.createElement("div");
      imageWrap.className = "archive-image-wrap";

      const image = document.createElement("img");
      image.className = "archive-image";
      image.src = item.coverImage || item.image;
      image.alt = item.title || "";

      image.loading = "lazy";

      const overlay = document.createElement("div");
      overlay.className = "archive-overlay";

      const overlayInner = document.createElement("div");
      overlayInner.className = "archive-overlay-inner";

      const title = document.createElement("div");
      title.className = "archive-title";
      title.textContent = item.title || "";

      const categoryText = document.createElement("div");
      categoryText.className = "archive-category";
      categoryText.textContent = item.category || "";

      overlayInner.appendChild(title);
      overlayInner.appendChild(categoryText);
      overlay.appendChild(overlayInner);

      imageWrap.appendChild(image);
      imageWrap.appendChild(overlay);
      link.appendChild(imageWrap);

      archiveGrid.appendChild(link);
    });
  }

  categoryButtons.forEach(button => {

    button.addEventListener("click", () => {

      const category = button.dataset.category;

      setActiveCategory(category);

      const url =
        category === "ALL"
          ? "index.html"
          : "index.html?category=" +
            encodeURIComponent(category);

      history.replaceState({}, "", url);

      renderArchive(category);
    });

  });


  fetch("archive-data.json")
    .then(response => {

      if (!response.ok) {
        throw new Error("archive-data.json could not be loaded.");
      }

      return response.json();

    })
    .then(data => {

      archiveData = Array.isArray(data)
        ? data
        : [];

      const initialCategory =
        getCategoryFromUrl() || "ALL";

      setActiveCategory(initialCategory);

      renderArchive(initialCategory);

    })
    .catch(error => {

      console.error(error);

      archiveGrid.innerHTML =
        "<p>Archive could not be loaded.</p>";

    });
</script>

</body>
</html>

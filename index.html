<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><meta name="description" content="SAKATA YUSHI — an archive of architecture, books, food, places and texts.">
<title>SAKATA YUSHI</title>
<style>
:root{color-scheme:dark;--fg:#e9e8e3;--muted:rgba(233,232,227,.5);--line:rgba(233,232,227,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--fg);font:12px Arial,Helvetica,sans-serif}button,input{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.site-title{position:fixed!important;transform:none!important;z-index:1000;pointer-events:auto;top:22px;left:24px;font-size:11px;letter-spacing:.16em}.edge-menu{position:fixed!important;transform:none!important;z-index:1002;pointer-events:auto;top:22px;right:24px;border:0;background:none;padding:8px 0 8px 12px;cursor:pointer;font-size:9px;letter-spacing:.12em;color:var(--muted)}.edge-menu:before{content:"";display:inline-block;width:22px;height:1px;background:currentColor;vertical-align:middle;margin-right:9px}
.space{position:fixed;inset:0;overflow:hidden;isolation:isolate;touch-action:none;background:radial-gradient(ellipse at 50% 48%,#101010 0%,#080808 46%,#030303 100%)}
.world{position:absolute;width:650vw;height:360vh;left:0;top:0;overflow:visible;transform-origin:0 0;will-change:transform}
.space:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.28) 100%);z-index:50}
.record{position:absolute;left:var(--x);top:var(--y);width:var(--w);z-index:var(--z);transform:translate3d(0,0,0);animation:appear 1.4s both,drift var(--duration,48s) ease-in-out var(--delay,0s) infinite alternate;will-change:transform;user-select:none;touch-action:auto;cursor:default}
.record[data-depth="far"]{--appear-opacity:.62;filter:brightness(.34) saturate(.62) blur(1.6px);opacity:.62}.record[data-depth="mid"]{--appear-opacity:.8;filter:brightness(.56) saturate(.76) blur(.65px);opacity:.8}.record[data-depth="near"]{--appear-opacity:.94;filter:brightness(.82) saturate(.9);opacity:.94}.record[data-depth="front"]{--appear-opacity:1;filter:brightness(1.08) saturate(1.04);opacity:1;box-shadow:0 12px 42px #000b}
.record.is-dragging{animation-play-state:paused!important;cursor:grabbing;z-index:400!important;transition:none!important;filter:brightness(1)!important}.record-image{pointer-events:auto;touch-action:none;cursor:grab}.record.is-dragging .record-image{cursor:grabbing}
.record.is-selected{animation-play-state:paused!important;z-index:600!important;filter:none!important;opacity:1!important;cursor:default}.record-close{position:absolute;right:0;top:0;z-index:5;width:30px;height:30px;border:1px solid #e9e8e35c;background:#050505d9;color:#e9e8e3;font-size:19px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.record.is-selected .record-close{display:flex}
.record-image{display:block;width:100%;aspect-ratio:1/1;height:var(--w);max-height:none;object-fit:cover;background:#111;box-shadow:0 5px 20px #0007;pointer-events:auto;touch-action:none;cursor:grab;-webkit-user-drag:none}.record[data-depth="far"] .record-image{box-shadow:0 2px 10px #0005}.record[data-depth="mid"] .record-image{box-shadow:0 5px 18px #0008}.record[data-depth="near"] .record-image{box-shadow:0 9px 30px #000a}.record[data-depth="front"] .record-image{box-shadow:0 15px 46px #000d}
.record.text-record{min-height:75px;padding:13px 14px;border-top:1px solid #e9e8e34d;border-bottom:1px solid #e9e8e31f;background:#080808c9}
.record.text-record .record-title{font-size:clamp(16px,1.8vw,23px);line-height:1.35;font-weight:400;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.record.text-record .record-preview{margin-top:7px;color:#e9e8e38a;font-size:clamp(10px,.95vw,12px);line-height:1.65;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.record-category{display:none!important}
.record-label{display:none!important}
.record.is-selected{width:var(--selected-width,192vw)!important;max-width:none}
.record.is-selected .record-image{display:block;width:100%;aspect-ratio:1/1;height:var(--selected-width,46vw);max-height:none;object-fit:cover;object-position:center;box-shadow:none}
.record-info{position:absolute;left:calc(100% + 72px);top:0;width:100vw;min-width:500px;max-height:183vh;overflow:auto;opacity:0;pointer-events:none;transform:translateY(9px);transition:opacity .45s ease .12s,transform .45s ease .12s;user-select:text}
.record.is-selected .record-info{opacity:1;pointer-events:auto;transform:translateY(0)}
.info-title{font-size:clamp(48px,5vw,68px);line-height:1.55;font-weight:400;margin:0 0 38px;overflow-wrap:anywhere}.info-excerpt{font-size:44px;line-height:2;color:#e9e8e3c2;white-space:pre-line}.detail-link{display:block;margin-top:48px;color:var(--muted);font-size:26px;letter-spacing:.08em}
.backdrop-dim{position:fixed;inset:0;background:#0003;z-index:100;pointer-events:none;opacity:0;transition:opacity .4s}body.has-selection .backdrop-dim{opacity:1}body.has-selection .record:not(.is-selected){animation-duration:48s!important}
.menu-panel{position:fixed;z-index:1001;top:0;right:0;width:min(330px,86vw);height:100dvh;padding:90px 28px 28px;background:#080808f5;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.2,1);overflow:auto}
.menu-panel.is-open{transform:translateX(0)}.menu-panel>a{display:block;padding:18px 0;border-bottom:1px solid #e9e8e31f;font-size:10px;letter-spacing:.12em}.filter-title{display:block;color:var(--muted);font-size:9px;margin-top:25px;letter-spacing:.14em}.menu-panel input{width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none}.menu-panel input::placeholder{color:#e9e8e359}.filter-list button{display:inline-block;width:auto;margin:12px 12px 0 0;padding:0 0 4px;border:0;border-bottom:1px solid transparent;background:none;color:var(--muted);font-size:9px;cursor:pointer}
.space-status{position:fixed;z-index:70;left:24px;bottom:20px;color:#e9e8e361;font-size:9px;letter-spacing:.1em;pointer-events:none}.world-tools{position:fixed;z-index:90;right:24px;bottom:18px;display:flex;align-items:center;gap:14px;color:#e9e8e38a;font-size:9px;letter-spacing:.08em}.world-tools button{width:28px;height:28px;border:1px solid #e9e8e32e;border-radius:50%;background:#080808a8;color:inherit;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:background .2s,border-color .2s}.world-tools button:hover{background:#222;border-color:#e9e8e37a}.world-zoom-label{min-width:32px;text-align:center;font-variant-numeric:tabular-nums}.world-reset{font-size:8px!important;letter-spacing:.1em!important;width:auto!important;border-radius:20px!important;padding:0 12px!important}
@keyframes drift{0%{transform:translate3d(-42px,-28px,0)}25%{transform:translate3d(17px,25px,0)}55%{transform:translate3d(48px,-7px,0)}80%{transform:translate3d(-13px,42px,0)}100%{transform:translate3d(28px,-34px,0)}}
@keyframes selectedDrift{0%{transform:translate3d(-13px,-8px,0)}50%{transform:translate3d(5px,10px,0)}100%{transform:translate3d(14px,-5px,0)}}
@keyframes appear{from{opacity:0}to{opacity:var(--appear-opacity,1)}}
@media(max-width:700px){.site-title{top: max(16px, env(safe-area-inset-top));left:14px;font-size:10px}.edge-menu{top:max(10px, env(safe-area-inset-top));right:14px;min-height:44px;display:flex;align-items:center}.world{width:800vw;height:440vh;left:0;top:0}.record{max-width:80vw}.record-image{aspect-ratio:1/1;height:var(--w);max-height:none}.record.is-selected,.record.is-selected.text-record{width:var(--selected-width,392vw)!important;max-width:none}.record.is-selected .record-image{display:block;width:100%;aspect-ratio:1/1;height:var(--selected-width,94vw);max-height:none;max-width:100%;object-fit:cover;object-position:center}.record-info{position:relative;left:auto;top:auto;width:100%;min-width:0;max-height:38dvh;margin-top:12px;padding:0 1px 18px;overflow:auto}.record.is-selected .record-info{opacity:1}.record.is-selected.text-record{max-height:calc(100dvh - 88px);overflow:auto}.record.is-selected.text-record .record-info{max-height:none}.record.is-selected.text-record .record-title{font-size:19px}.info-title{font-size:clamp(24px,7vw,34px);line-height:1.25;margin:0 0 16px}.info-excerpt{font-size:16px;line-height:1.8;overflow-wrap:anywhere}.detail-link{margin-top:24px;font-size:12px}.record.text-record{padding:9px 10px;min-height:54px}.record.text-record .record-title{font-size:clamp(14px,4vw,18px);line-height:1.35}.record.text-record .record-preview{font-size:11px;line-height:1.55;-webkit-line-clamp:4}.record-category{display:none!important}.record-label{display:none!important}.space-status{left:14px;bottom:max(16px,env(safe-area-inset-bottom));font-size:8px;max-width:42vw}.world-tools{right:12px;bottom:max(12px,env(safe-area-inset-bottom));gap:8px}.world-tools button{width:40px;height:40px}.world-reset{padding:0 9px!important}.world-zoom-label{display:none}}
@media(prefers-reduced-motion:reduce){.record{animation:none!important}.menu-panel,.record-info{transition:none!important}}
</style>
<style id="depth-and-mobile-design">
/* Depth atmosphere and viewport-first mobile composition */
.space{background:#030303!important}
.space:before{content:"";position:absolute;inset:-18%;z-index:0;pointer-events:none;background:
radial-gradient(ellipse at 48% 45%,rgba(37,39,43,.42) 0%,rgba(14,15,17,.22) 27%,transparent 57%),
radial-gradient(ellipse at 16% 78%,rgba(27,31,37,.24) 0%,transparent 38%),
radial-gradient(ellipse at 86% 22%,rgba(32,29,26,.18) 0%,transparent 34%),
radial-gradient(1px 1px at 13% 21%,rgba(225,230,235,.20) 0,transparent 100%),
radial-gradient(1px 1px at 71% 67%,rgba(225,230,235,.15) 0,transparent 100%),
radial-gradient(1px 1px at 42% 84%,rgba(225,230,235,.12) 0,transparent 100%);
background-size:auto,auto,auto,97px 113px,131px 149px,173px 181px;
animation:spaceBreath 22s ease-in-out infinite alternate}
.space:after{background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.72) 100%)}
@keyframes spaceBreath{from{transform:scale(1);opacity:.62}to{transform:scale(1.08);opacity:1}}
.site-title{font-size:12px;letter-spacing:.2em;text-shadow:0 1px 16px #000}

@media(max-width:700px){
 .site-title{top:18px;left:16px;font-size:12px;letter-spacing:.16em}

}
</style>

<body>
<a class="site-title" href="index.html">SAKATA YUSHI</a><button class="edge-menu" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel">MENU</button>
<main class="space" id="space" aria-label="Floating archive space"><div class="world" id="world"></div><div class="backdrop-dim"></div><p class="space-status" id="space-status">AN ARCHIVE OF CURIOSITIES</p></main><div class="world-tools" aria-label="World view controls"><button type="button" id="zoom-out" aria-label="Zoom out">−</button><span class="world-zoom-label" id="zoom-label">24%</span><button type="button" id="zoom-in" aria-label="Zoom in">+</button><button type="button" class="world-reset" id="view-reset">RESET VIEW</button></div>
<nav class="menu-panel" id="menu-panel" aria-label="Site menu" aria-hidden="true"><a href="archive.html">ARCHIVE ↗</a><a href="text.html">TEXT ↗</a><a href="about.html">ABOUT ↗</a><span class="filter-title">FIND A RECORD</span><input id="record-search" type="search" placeholder="Search title or category" aria-label="Search records"><div class="filter-list" id="category-filters"></div></nav>
<script>
(()=> {
 const space=document.getElementById('space'),world=document.getElementById('world'),menu=document.getElementById('menu-panel'),toggle=document.getElementById('menu-toggle'),search=document.getElementById('record-search'),filters=document.getElementById('category-filters'),status=document.getElementById('space-status');
 const INITIAL_ZOOM=.78,MIN_ZOOM=.42,MAX_ZOOM=1.35;const zoomLabel=document.getElementById('zoom-label');let worldZoom=INITIAL_ZOOM;let allItems=[],selected=null,drag=null,zCounter=30,menuOpen=false,renderToken=0,selectedMotionTimer=null;const activePointers=new Map();let pan=null,worldPanX=0,worldPanY=0;
 const mobile=()=>matchMedia('(max-width:700px)').matches,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const rand=(a,b)=>Math.random()*(b-a)+a;
 const esc=s=>String(s||'');
 function closeSelected(){if(!selected)return;if(selectedMotionTimer){clearTimeout(selectedMotionTimer);selectedMotionTimer=null}selected.classList.remove('is-selected','is-drifting');selected.style.zIndex=selected.dataset.baseZ;selected.style.left=selected.dataset.baseLeft;selected.style.top=selected.dataset.baseTop;selected.style.setProperty('--x',selected.dataset.baseLeft);selected.style.setProperty('--y',selected.dataset.baseTop);const close=selected.querySelector('.record-close');if(close)close.remove();selected=null;document.body.classList.remove('has-selection');status.textContent=world.children.length+' RECORDS / AN ARCHIVE OF CURIOSITIES'}
 function selectRecord(el){if(selected===el){closeSelected();return}if(selected)closeSelected();selected=el;el.classList.remove('is-drifting');el.classList.add('is-selected');el.style.zIndex=600;document.body.classList.add('has-selection');status.textContent='SELECTED RECORD / CLOSE WITH ×';el.style.setProperty('--selected-width',((mobile()?94:46)/worldZoom)+'vw');if(mobile()){const r=world.getBoundingClientRect();el.style.left=((14-r.left)/worldZoom)+'px';el.style.top=((66-r.top)/worldZoom)+'px'}selectedMotionTimer=setTimeout(()=>{if(selected===el){selectedMotionTimer=null}},5000);const close=document.createElement('button');close.type='button';close.className='record-close';close.setAttribute('aria-label','Close enlarged record');close.textContent='×';close.addEventListener('pointerdown',e=>e.stopPropagation());close.addEventListener('pointerup',e=>e.stopPropagation());close.addEventListener('click',e=>{e.stopPropagation();closeSelected()});el.append(close)}
 function makeRecord(item,index,token){
   const el=document.createElement('article');el.className='record'+(!item.image&&!item.coverImage?' text-record':'');el.dataset.category=item.category||'ARCHIVE';el.dataset.depth=['far','mid','near'][index%3];
   const depthCycle=['far','mid','near','front'];const depth=depthCycle[index%depthCycle.length];el.dataset.depth=depth;
   const widthRange=mobile()?({far:[30,38],mid:[38,46],near:[46,54],front:[52,62]}[depth]):({far:[18,23],mid:[22,28],near:[26,33],front:[30,38]}[depth]);
   const width=rand(widthRange[0],widthRange[1]);
   const positions=[[18,24],[82,24],[146,24],[210,24],[18,92],[82,92],[146,92],[210,92],[50,160],[178,160],[310,65],[390,145],[500,45],[620,220],[760,110],[900,320],[1080,180],[1260,450]];
   const base=positions[index%positions.length];const x=base[0]+rand(-12,12),y=base[1]+rand(-12,12);
   const speed=depth==='far'?rand(58,78):depth==='mid'?rand(43,60):depth==='near'?rand(30,46):rand(23,36);
   el.style.setProperty('--w',width.toFixed(2)+'vw');el.style.setProperty('--x',x.toFixed(2)+'vw');el.style.setProperty('--y',y.toFixed(2)+'vh');el.style.setProperty('--z',String(depth==='far'?Math.round(rand(1,5)):depth==='mid'?Math.round(rand(6,10)):depth==='near'?Math.round(rand(11,16)):Math.round(rand(17,25))));el.style.setProperty('--duration',(reduced?0:speed).toFixed(1)+'s');el.style.setProperty('--delay',(-rand(0,35)).toFixed(1)+'s');
   el.dataset.baseZ=el.style.getPropertyValue('--z');el.dataset.baseLeft=x.toFixed(2)+'vw';el.dataset.baseTop=y.toFixed(1)+'vh';
   const cat=document.createElement('span');cat.className='record-category';cat.textContent=item.category||'ARCHIVE';
   if(item.image||item.coverImage){const img=document.createElement('img');img.className='record-image';img.src=item.coverImage||item.image;img.alt=item.title||'';img.draggable=false;img.loading=index<10?'eager':'lazy';img.decoding='async';el.append(img)}
   else {const title=document.createElement('div');title.className='record-title';title.textContent=item.title||'Untitled';el.append(cat,title);const previewText=item.description||item.excerpt||'';if(previewText){const preview=document.createElement('div');preview.className='record-preview';preview.textContent=previewText;el.append(preview)}}
   const info=document.createElement('div');info.className='record-info';const h=document.createElement('h2');h.className='info-title';h.textContent=item.title||'Untitled';info.append(h);
   const desc=document.createElement('div');desc.className='info-excerpt';desc.textContent=item.description||item.excerpt||'';if(desc.textContent)info.append(desc);
   if(item.detailPage){const a=document.createElement('a');a.className='detail-link';a.href=item.detailPage;a.textContent='OPEN FULL RECORD ↗';info.append(a)}el.append(info);
   // Drag and click are deliberately handled in pointerup, never by a click event.
   el.addEventListener('pointerdown',e=>{if(!e.target.closest('.record-image'))return;e.stopPropagation();if(e.target.closest('.record-info a,.record-close'))return;if(e.pointerType==='touch'&&activePointers.size>1)return;if(e.pointerType==='mouse'&&e.button!==0)return;drag={el,id:e.pointerId,x:e.clientX,y:e.clientY,left:el.offsetLeft,top:el.offsetTop,moved:false};el.setPointerCapture(e.pointerId);e.preventDefault()});
   el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el||drag.id!==e.pointerId)return;e.stopPropagation();const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){el.classList.add('is-dragging');const localLeft=drag.left+dx/worldZoom;const localTop=drag.top+dy/worldZoom;el.style.left=Math.max(-el.offsetWidth,Math.min(world.clientWidth,localLeft))+'px';el.style.top=Math.max(-el.offsetHeight,Math.min(world.clientHeight,localTop))+'px';el.style.setProperty('--x',el.style.left);el.style.setProperty('--y',el.style.top);e.preventDefault()}});
   const end=e=>{if(!drag||drag.el!==el||drag.id!==e.pointerId)return;e.stopPropagation();const wasMoved=drag.moved;el.classList.remove('is-dragging');drag=null;if(wasMoved){el.dataset.baseLeft=el.style.left;el.dataset.baseTop=el.style.top;el.style.zIndex=++zCounter;return}if(!e.target.closest('.record-image'))return;if(e.target.closest('.record-info a,.record-close'))return;selectRecord(el)};
   el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{if(drag&&drag.el===el){el.classList.remove('is-dragging');drag=null}});
   return el
 }
 function render(items){closeSelected();renderToken++;world.replaceChildren();const pool=items.filter(x=>x.image||x.coverImage||x.title).slice().sort(()=>Math.random()-.5);const limit=pool.length;pool.forEach((item,i)=>world.append(makeRecord(item,i,renderToken)));status.textContent=limit+' RECORDS / AN ARCHIVE OF CURIOSITIES'}
 function applyFilters(){const q=search.value.trim().toLowerCase(),active=filters.querySelector('[aria-pressed="true"]')?.dataset.filter||'ALL';render(allItems.filter(x=>(active==='ALL'||x.category===active)&&(!q||[x.title,x.category,x.description,x.excerpt].join(' ').toLowerCase().includes(q))))}
 function setupFilters(){filters.replaceChildren();const cats=[...new Set(allItems.map(x=>x.category).filter(Boolean))].sort();function add(label,value){const b=document.createElement('button');b.textContent=label;b.dataset.filter=value;b.setAttribute('aria-pressed',value==='ALL'?'true':'false');if(value==='ALL')b.style.borderBottomColor='currentColor';b.onclick=()=>{filters.querySelectorAll('button').forEach(t=>{t.setAttribute('aria-pressed','false');t.style.borderBottomColor='transparent'});b.setAttribute('aria-pressed','true');b.style.borderBottomColor='currentColor';applyFilters()};filters.append(b)}add('ALL','ALL');cats.forEach(c=>add(c,c))}
 
// Move around a large virtual space. The site title and menu are fixed siblings, not world children.
function clampWorldPan(){const minX=Math.min(0,space.clientWidth-world.clientWidth*worldZoom),minY=Math.min(0,space.clientHeight-world.clientHeight*worldZoom);const maxX=0,maxY=0;worldPanX=Math.max(minX,Math.min(maxX,worldPanX));worldPanY=Math.max(minY,Math.min(maxY,worldPanY))}
function applyWorldPan(){clampWorldPan();world.style.transform=`translate3d(${worldPanX}px,${worldPanY}px,0) scale(${worldZoom})`;zoomLabel.textContent=Math.round(worldZoom*100)+'%'}
function zoomAt(nextZoom,x,y,baseX=worldPanX,baseY=worldPanY,baseZoom=worldZoom,anchorX=x,anchorY=y){nextZoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,nextZoom));const contentX=(anchorX-baseX)/baseZoom,contentY=(anchorY-baseY)/baseZoom;worldZoom=nextZoom;worldPanX=x-contentX*nextZoom;worldPanY=y-contentY*nextZoom;applyWorldPan();if(selected)selected.style.setProperty('--selected-width',((mobile()?94:46)/worldZoom)+'vw')}
applyWorldPan();
document.getElementById('zoom-in').addEventListener('click',()=>zoomAt(worldZoom*1.2,space.clientWidth/2,space.clientHeight/2));document.getElementById('zoom-out').addEventListener('click',()=>zoomAt(worldZoom/1.2,space.clientWidth/2,space.clientHeight/2));document.getElementById('view-reset').addEventListener('click',()=>{worldZoom=INITIAL_ZOOM;worldPanX=0;worldPanY=0;applyWorldPan()});
space.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'){
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size>=2){
   if(drag){drag.el.classList.remove('is-dragging');drag=null}
   const pts=[...activePointers.values()].slice(0,2);
   const midX=(pts[0].x+pts[1].x)/2,midY=(pts[0].y+pts[1].y)/2;pan={mode:'two',x:midX,y:midY,distance:Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),baseX:worldPanX,baseY:worldPanY,baseZoom:worldZoom,contentX:(midX-worldPanX)/worldZoom,contentY:(midY-worldPanY)/worldZoom};
   for(const id of activePointers.keys()){try{space.setPointerCapture(id)}catch{}}
   e.preventDefault();
  }else if(mobile()&&!e.target.closest('.record,.record-close')){
   pan={mode:'one',id:e.pointerId,x:e.clientX,y:e.clientY,baseX:worldPanX,baseY:worldPanY,moved:false};
   try{space.setPointerCapture(e.pointerId)}catch{}
  }
  return;
 }
 if(e.pointerType==='mouse'&&e.button===0&&!e.target.closest('.record,.record-close,button,a,input,.menu-panel')){
  pan={mode:'mouse',id:e.pointerId,x:e.clientX,y:e.clientY,baseX:worldPanX,baseY:worldPanY,moved:false};
  try{space.setPointerCapture(e.pointerId)}catch{}
  e.preventDefault();
 }
},true);
space.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'&&activePointers.has(e.pointerId)){
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size>=2){
   const pts=[...activePointers.values()].slice(0,2);
   const midX=(pts[0].x+pts[1].x)/2,midY=(pts[0].y+pts[1].y)/2,distance=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
   if(!pan||pan.mode!=='two')pan={mode:'two',x:midX,y:midY,distance,baseX:worldPanX,baseY:worldPanY,baseZoom:worldZoom};
   const nextZoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,pan.baseZoom*(distance/pan.distance)));worldZoom=nextZoom;worldPanX=midX-pan.contentX*nextZoom;worldPanY=midY-pan.contentY*nextZoom;applyWorldPan();if(selected)selected.style.setProperty('--selected-width',((mobile()?94:46)/worldZoom)+'vw');
   e.preventDefault();
  }else if(pan?.mode==='one'&&pan.id===e.pointerId){
   const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
   if(Math.hypot(dx,dy)>5)pan.moved=true;
   if(pan.moved){worldPanX=pan.baseX+dx;worldPanY=pan.baseY+dy;applyWorldPan();e.preventDefault()}
  }
  return;
 }
 if(e.pointerType==='mouse'&&pan?.mode==='mouse'&&pan.id===e.pointerId){
  const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(Math.hypot(dx,dy)>4)pan.moved=true;
  if(pan.moved){worldPanX=pan.baseX+dx;worldPanY=pan.baseY+dy;applyWorldPan();e.preventDefault()}
 }
},true);
function endPanPointer(e){activePointers.delete(e.pointerId);pan=null}
space.addEventListener('pointerup',endPanPointer,true);space.addEventListener('pointercancel',endPanPointer,true);
space.addEventListener('wheel',e=>{
 if(e.target.closest('.record-info,.menu-panel'))return;
 if(e.ctrlKey){e.preventDefault();zoomAt(worldZoom*Math.exp(-e.deltaY*.002),e.clientX,e.clientY)}
 else{worldPanX-=e.deltaX;worldPanY-=e.deltaY;applyWorldPan();e.preventDefault()}
},{passive:false});
toggle.addEventListener('click',()=>{menuOpen=!menuOpen;menu.classList.toggle('is-open',menuOpen);menu.setAttribute('aria-hidden',String(!menuOpen));toggle.setAttribute('aria-expanded',String(menuOpen))});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSelected();menuOpen=false;menu.classList.remove('is-open');menu.setAttribute('aria-hidden','true');toggle.setAttribute('aria-expanded','false')}});
 search.addEventListener('input',applyFilters);window.addEventListener('resize',()=>{applyWorldPan();if(allItems.length)applyFilters()});
 fetch('archive-data.json').then(r=>{if(!r.ok)throw Error('Archive data unavailable');return r.json()}).then(data=>{allItems=Array.isArray(data)?data:(data.items||[]);setupFilters();render(allItems)}).catch(err=>{console.error(err);status.textContent='ARCHIVE DATA COULD NOT BE LOADED'});
})();
</script></body></html>

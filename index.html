<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sakata Katsuyuki — architecture, photographs, and texts.">
  <title>SAKATA YUSHI</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: #E9E5DE; color: rgba(34,34,34,.72);
      font-family: Arial, Helvetica, sans-serif; font-size: 11px;
      font-weight: 400; line-height: 1.45;
    }
    a { color: inherit; text-decoration: none; }
    button { color: inherit; font-family: inherit; }
    .site-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: rgba(233,229,222,.78); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(34,34,34,.06);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 58px; padding: 0 22px; gap: 20px;
    }
    .site-title { flex: 0 0 auto; font-size: 11px; letter-spacing: .08em; white-space: nowrap; }
    .main-nav { display: flex; align-items: center; justify-content: flex-end; margin-left: auto; }
    .main-nav a {
      display: inline-flex; align-items: center; justify-content: center; height: 20px;
      font-size: 10px; letter-spacing: .04em; color: rgba(34,34,34,.55);
    }
    .main-nav a:hover { color: #222; }
    .about-link { margin-left: auto; padding-left: 18px; border-left: 1px solid rgba(34,34,34,.16); }
    main { padding: 88px 22px 76px; }
    .home-section { max-width: 1120px; margin: 0 auto 48px; }
    .section-heading {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(34,34,34,.18);
      font-size: 10px; letter-spacing: .1em; color: rgba(34,34,34,.72);
    }
    .section-heading a { white-space: nowrap; color: rgba(34,34,34,.55); }
    .section-heading a:hover { color: #222; }
    .carousel { position: relative; overflow: hidden; }
    .carousel-track { display: flex; width: 100%; transition: transform .55s cubic-bezier(.22,.61,.36,1); }
    .carousel-slide { flex: 0 0 100%; min-width: 0; }
    .photo-link { display: block; position: relative; overflow: hidden; background: rgba(34,34,34,.04); }
    .photo-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; }
    .photo-image { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .photo-caption {
      position: absolute; right: 0; bottom: 0; left: auto; top: auto;
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
      gap: 3px; max-width: 86%; padding: 9px 12px;
      background: rgba(233,229,222,.94); color: rgba(34,34,34,.82);
      text-align: right; font-size: 10px; letter-spacing: .03em;
      opacity: 1; pointer-events: none;
    }
    .photo-thumbnails { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding:1px 0 4px; }
    .photo-thumbnail { flex:0 0 clamp(76px,12vw,132px); width:clamp(76px,12vw,132px); padding:0; border:1px solid transparent; background:transparent; cursor:pointer; opacity:.66; }
    .photo-thumbnail img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
    .photo-thumbnail span { display:block; margin-top:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:9px; text-align:left; }
    .photo-thumbnail[aria-current="true"] { opacity:1; border-color:rgba(34,34,34,.72); }
    .photo-browse-hint { margin:8px 0 0; color:rgba(34,34,34,.45); font-size:9px; letter-spacing:.04em; }
    .photo-caption-title { max-width: 100%; overflow-wrap: anywhere; }
    .photo-caption-category { color: rgba(34,34,34,.52); font-size: 9px; }
    @media (hover:hover) and (pointer:fine) {
      .photo-link:hover .photo-caption { opacity: 1; }
    }
    .photo-link:focus-visible .photo-caption,
    .photo-link.is-caption-visible .photo-caption { opacity: 1; }
    .carousel-controls {
      display: flex; align-items: center; gap: 10px; margin-top: 12px;
    }
    .carousel-arrow {
      appearance: none; border: 1px solid rgba(34,34,34,.2); border-radius: 50%;
      width: 28px; height: 28px; padding: 0; background: transparent; cursor: pointer;
      font-size: 13px; flex: 0 0 auto;
    }
    .carousel-arrow:hover { background: rgba(34,34,34,.06); }
    .carousel-dots { display: flex; align-items: center; gap: 7px; margin-left: 2px; }
    .carousel-dot {
      appearance: none; width: 6px; height: 6px; border: 0; border-radius: 50%;
      padding: 0; background: rgba(34,34,34,.25); cursor: pointer;
    }
    .carousel-dot[aria-current="true"] { background: rgba(34,34,34,.85); }
    .carousel-counter { margin-left: auto; font-size: 9px; color: rgba(34,34,34,.45); letter-spacing: .04em; }
    .text-carousel { border-top: 1px solid rgba(34,34,34,.16); }
    .text-slide {
      min-height: 190px; display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(18px,3vw,34px); border: 1px solid rgba(34,34,34,.12);
      border-top: 0; color: rgba(34,34,34,.78);
    }
    .text-slide-meta { display: flex; justify-content: space-between; gap: 12px; color: rgba(34,34,34,.48); font-size: 9px; letter-spacing: .08em; }
    .text-slide-title {
      display: block; max-width: 760px; margin: 22px 0;
      font-size: clamp(18px,3vw,30px); line-height: 1.6; font-weight: 400; letter-spacing: .01em;
      overflow-wrap: anywhere;
    }
    .text-slide-description { max-width: 620px; font-size: 11px; line-height: 1.9; color: rgba(34,34,34,.58); }
    .text-slide-more { align-self: flex-end; border-bottom: 1px solid rgba(34,34,34,.35); padding-bottom: 3px; font-size: 10px; }
    .site-footer { max-width: 1120px; margin: 0 auto; padding-top: 14px; border-top: 1px solid rgba(34,34,34,.12); font-size: 9px; letter-spacing: .06em; }
    @media (max-width:650px) {
      .header-inner { min-height: 52px; padding: 0 14px; }
      .site-title { font-size: 10px; }
      .main-nav a { font-size: 9px; }
      main { padding: 74px 12px 56px; }
      .home-section { margin-bottom: 34px; }
      .photo-frame { aspect-ratio: 4 / 3; }
      .photo-caption { padding: 12px; font-size: 10px; }
      .text-slide { min-height: 205px; padding: 18px 16px; }
      .text-slide-title { margin: 26px 0; font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .carousel-track { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">SAKATA YUSHI</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="about.html" class="about-link">ABOUT</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="home-section" aria-labelledby="archive-heading">
      <div class="section-heading">
        <a id="archive-heading" href="archive.html">ARCHIVE ↗</a>
        <a href="archive.html">VIEW ALL ↗</a>
      </div>
      <div class="carousel" id="photo-carousel" aria-label="Archive photographs">
        <div class="carousel-track" id="photo-track"></div>
      </div>
      <div class="photo-thumbnails" id="photo-thumbnails" aria-label="Choose photograph"></div>
      <p class="photo-browse-hint">写真を選ぶと切り替わります。写真を押すと詳細を開きます。</p>
      <div class="carousel-controls">
        <button class="carousel-arrow" id="photo-prev" type="button" aria-label="Previous photograph">←</button>
        <button class="carousel-arrow" id="photo-next" type="button" aria-label="Next photograph">→</button>
        <div class="carousel-dots" id="photo-dots" aria-label="Choose photograph"></div>
        <span class="carousel-counter" id="photo-counter"></span>
      </div>
    </section>

    <section class="home-section" aria-labelledby="text-heading">
      <div class="section-heading">
        <a id="text-heading" href="text.html">TEXT ↗</a>
        <a href="text.html">VIEW ALL ↗</a>
      </div>
      <div class="carousel text-carousel" id="text-carousel" aria-label="Texts">
        <div class="carousel-track" id="text-track"></div>
      </div>
      <div class="carousel-controls">
        <button class="carousel-arrow" id="text-prev" type="button" aria-label="Previous text">←</button>
        <button class="carousel-arrow" id="text-next" type="button" aria-label="Next text">→</button>
        <div class="carousel-dots" id="text-dots" aria-label="Choose text"></div>
        <span class="carousel-counter" id="text-counter"></span>
      </div>
    </section>
    <footer class="site-footer">SAKATA YUSHI</footer>
  </main>

  <script>
    function setupCarousel(track, dots, counter, prevButton, nextButton) {
      let index = 0;
      let count = 0;
      const update = () => {
        track.style.transform = 'translateX(' + (-index * 100) + '%)';
        dots.querySelectorAll('button').forEach((dot, i) => dot.setAttribute('aria-current', i === index ? 'true' : 'false'));
        counter.textContent = count ? String(index + 1).padStart(2, '0') + ' / ' + String(count).padStart(2, '0') : '';
        if (track.id === 'photo-track') {
          document.querySelectorAll('#photo-thumbnails button').forEach((thumb, i) => thumb.setAttribute('aria-current', i === index ? 'true' : 'false'));
        }
      };
      const go = next => {
        if (!count) return;
        index = (next + count) % count;
        update();
      };
      prevButton.addEventListener('click', () => go(index - 1));
      nextButton.addEventListener('click', () => go(index + 1));
      return {
        addDot() {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'carousel-dot';
          dot.setAttribute('aria-label', 'Go to slide ' + (count + 1));
          dot.addEventListener('click', () => go(Number(dot.dataset.index)));
          dot.dataset.index = String(count);
          dots.appendChild(dot);
          count += 1;
          update();
        },
        update,
        go
      };
    }

    const photoTrack = document.getElementById('photo-track');
    const photoDots = document.getElementById('photo-dots');
    const photoThumbnails = document.getElementById('photo-thumbnails');
    const photoCarousel = setupCarousel(
      photoTrack, photoDots, document.getElementById('photo-counter'),
      document.getElementById('photo-prev'), document.getElementById('photo-next')
    );
    const textTrack = document.getElementById('text-track');
    const textDots = document.getElementById('text-dots');
    const textCarousel = setupCarousel(
      textTrack, textDots, document.getElementById('text-counter'),
      document.getElementById('text-prev'), document.getElementById('text-next')
    );

    fetch('archive-data.json')
      .then(response => {
        if (!response.ok) throw new Error('Archive data could not be loaded.');
        return response.json();
      })
      .then(data => {
        const items = Array.isArray(data) ? data : (data.items || []);
        const categoryLatest = new Map();
        items
          .filter(entry => !entry.isArticle && (entry.image || entry.coverImage))
          .forEach(entry => {
            const category = entry.category || 'ARCHIVE';
            const current = categoryLatest.get(category);
            const date = entry.capturedAt ? Date.parse(entry.capturedAt) : 0;
            const currentDate = current && current.capturedAt ? Date.parse(current.capturedAt) : 0;
            if (!current || date > currentDate) categoryLatest.set(category, entry);
          });
        const photos = Array.from(categoryLatest.values())
          .sort((a, b) => {
            const dateA = a.capturedAt ? Date.parse(a.capturedAt) : 0;
            const dateB = b.capturedAt ? Date.parse(b.capturedAt) : 0;
            return dateB - dateA;
          })
          .slice(0, 5);
        photos.forEach(item => {
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          const link = document.createElement('a');
          link.className = 'photo-link';
          link.href = item.detailPage || 'archive.html';
          const frame = document.createElement('div');
          frame.className = 'photo-frame';
          const image = document.createElement('img');
          image.className = 'photo-image';
          image.src = item.coverImage || item.image;
          image.alt = item.title || '';
          image.loading = 'lazy';
          image.decoding = 'async';
          const caption = document.createElement('div');
          caption.className = 'photo-caption';
          const title = document.createElement('span');
          title.className = 'photo-caption-title';
          title.textContent = item.title || '';
          const category = document.createElement('span');
          category.className = 'photo-caption-category';
          category.textContent = item.category || 'ARCHIVE';
          caption.append(category, title);
          frame.append(image, caption);
          link.appendChild(frame);
          link.addEventListener('click', event => {
            if (window.matchMedia('(max-width: 650px) and (hover: none)').matches && !link.classList.contains('is-caption-visible')) {
              event.preventDefault();
              document.querySelectorAll('.photo-link.is-caption-visible').forEach(el => el.classList.remove('is-caption-visible'));
              link.classList.add('is-caption-visible');
            }
          });
          slide.appendChild(link);
          photoTrack.appendChild(slide);
          photoCarousel.addDot();
          const thumb = document.createElement('button');
          thumb.type = 'button';
          thumb.className = 'photo-thumbnail';
          thumb.setAttribute('aria-label', 'Show ' + (item.category || 'ARCHIVE') + ' photograph');
          thumb.setAttribute('aria-current', photos.indexOf(item) === 0 ? 'true' : 'false');
          const thumbImage = document.createElement('img');
          thumbImage.src = item.coverImage || item.image;
          thumbImage.alt = '';
          thumbImage.loading = 'lazy';
          const thumbTitle = document.createElement('span');
          thumbTitle.textContent = item.category || 'ARCHIVE';
          thumb.append(thumbImage, thumbTitle);
          thumb.addEventListener('click', () => photoCarousel.go(photos.indexOf(item)));
          photoThumbnails.appendChild(thumb);
        });
      })
      .catch(error => {
        console.error(error);
        photoTrack.innerHTML = '<div class="carousel-slide">Archive data could not be loaded.</div>';
      });

    fetch('articles.json')
      .then(response => {
        if (!response.ok) throw new Error('Article data could not be loaded.');
        return response.json();
      })
      .then(articles => {
        articles.forEach((article, index) => {
          const slide = document.createElement('div');
          slide.className = 'carousel-slide';
          const card = document.createElement('article');
          card.className = 'text-slide';
          const meta = document.createElement('div');
          meta.className = 'text-slide-meta';
          const label = document.createElement('span');
          label.textContent = 'TEXT / ESSAY';
          const number = document.createElement('span');
          number.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(articles.length).padStart(2, '0');
          meta.append(label, number);
          const link = document.createElement('a');
          link.href = article.detailPage || '#';
          link.className = 'text-slide-title';
          link.textContent = article.title || 'Untitled';
          const description = document.createElement('p');
          description.className = 'text-slide-description';
          description.textContent = article.description || '';
          const more = document.createElement('a');
          more.href = article.detailPage || '#';
          more.className = 'text-slide-more';
          more.textContent = 'READ TEXT ↗';
          card.append(meta, link, description, more);
          slide.appendChild(card);
          textTrack.appendChild(slide);
          textCarousel.addDot();
        });
      })
      .catch(error => {
        console.error(error);
        textTrack.innerHTML = '<div class="carousel-slide">Articles could not be loaded.</div>';
      });
  </script>
</body>
</html>

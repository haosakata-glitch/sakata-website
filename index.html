<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><meta name="description" content="SAKATA YUSHI — an archive of architecture, books, food, places and texts.">
<title>SAKATA YUSHI</title>
<style>
:root{color-scheme:dark;--fg:#e9e8e3;--muted:rgba(233,232,227,.5);--line:rgba(233,232,227,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--fg);font:12px Arial,Helvetica,sans-serif}button,input{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.site-title{position:fixed;z-index:1000;top:22px;left:24px;font-size:11px;letter-spacing:.16em}.edge-menu{position:fixed;z-index:1002;top:22px;right:24px;border:0;background:none;padding:8px 0 8px 12px;cursor:pointer;font-size:9px;letter-spacing:.12em;color:var(--muted)}.edge-menu:before{content:"";display:inline-block;width:22px;height:1px;background:currentColor;vertical-align:middle;margin-right:9px}
.space{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#101010 0%,#080808 46%,#030303 100%)}
.world{position:absolute;width:220vw;height:190vh;left:-60vw;top:-43vh;overflow:visible;will-change:transform}
.space:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.28) 100%);z-index:50}
.record{position:absolute;left:var(--x);top:var(--y);width:var(--w);z-index:var(--z);transform:translate3d(0,0,0);animation:appear 1.4s both,drift var(--duration,34s) ease-in-out var(--delay,0s) infinite alternate;will-change:transform;user-select:none;touch-action:none;cursor:grab}
.record[data-depth="far"]{filter:brightness(.48) blur(.8px)}.record[data-depth="mid"]{filter:brightness(.73) blur(.2px)}.record[data-depth="near"]{filter:brightness(1)}
.record.is-dragging{animation:none!important;cursor:grabbing;z-index:400!important;transition:none!important;filter:brightness(1)!important}
.record.is-selected{animation:none!important;z-index:600!important;filter:none!important;cursor:default}.record-close{position:absolute;right:0;top:0;z-index:5;width:30px;height:30px;border:1px solid #e9e8e35c;background:#050505d9;color:#e9e8e3;font-size:19px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.record.is-selected .record-close{display:flex}
.record-image{display:block;width:100%;height:auto;max-height:58vh;object-fit:cover;background:#111;box-shadow:0 8px 35px #0008;pointer-events:none;-webkit-user-drag:none}
.record.text-record{min-height:75px;padding:13px 14px;border-top:1px solid #e9e8e34d;border-bottom:1px solid #e9e8e31f;background:#080808c9}
.record.text-record .record-title{font-size:clamp(13px,1.5vw,19px);line-height:1.6;font-weight:400}
.record-category{display:block;color:var(--muted);font-size:8px;letter-spacing:.13em;margin-bottom:8px;pointer-events:none}
.record-label{margin-top:8px;color:var(--muted);font-size:9px;line-height:1.55;pointer-events:none}
.record.is-selected{width:min(46vw,700px)!important;max-width:calc(100vw - 36px)}
.record.is-selected .record-image{max-height:58vh;object-fit:contain;object-position:left center;box-shadow:none}
.record-info{position:absolute;left:calc(100% + 26px);top:0;width:min(27vw,350px);min-width:180px;max-height:66vh;overflow:auto;opacity:0;pointer-events:none;transform:translateY(9px);transition:opacity .45s ease .12s,transform .45s ease .12s;user-select:text}
.record.is-selected .record-info{opacity:1;pointer-events:auto;transform:translateY(0)}
.info-title{font-size:clamp(15px,1.7vw,22px);line-height:1.55;font-weight:400;margin:0 0 14px;overflow-wrap:anywhere}.info-excerpt{font-size:11px;line-height:2;color:#e9e8e3c2;white-space:pre-line}.detail-link{display:block;margin-top:18px;color:var(--muted);font-size:9px;letter-spacing:.08em}
.backdrop-dim{position:fixed;inset:0;background:#0003;z-index:100;pointer-events:none;opacity:0;transition:opacity .4s}body.has-selection .backdrop-dim{opacity:1}body.has-selection .record:not(.is-selected){animation-duration:48s!important}
.menu-panel{position:fixed;z-index:1001;top:0;right:0;width:min(330px,86vw);height:100dvh;padding:90px 28px 28px;background:#080808f5;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.2,1);overflow:auto}
.menu-panel.is-open{transform:translateX(0)}.menu-panel>a{display:block;padding:18px 0;border-bottom:1px solid #e9e8e31f;font-size:10px;letter-spacing:.12em}.filter-title{display:block;color:var(--muted);font-size:9px;margin-top:25px;letter-spacing:.14em}.menu-panel input{width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none}.menu-panel input::placeholder{color:#e9e8e359}.filter-list button{display:inline-block;width:auto;margin:12px 12px 0 0;padding:0 0 4px;border:0;border-bottom:1px solid transparent;background:none;color:var(--muted);font-size:9px;cursor:pointer}
.space-status{position:fixed;z-index:70;left:24px;bottom:20px;color:#e9e8e361;font-size:9px;letter-spacing:.1em;pointer-events:none}
@keyframes drift{0%{transform:translate3d(-42px,-28px,0)}25%{transform:translate3d(17px,25px,0)}55%{transform:translate3d(48px,-7px,0)}80%{transform:translate3d(-13px,42px,0)}100%{transform:translate3d(28px,-34px,0)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@media(max-width:700px){.site-title{top:17px;left:14px;font-size:10px}.edge-menu{top:13px;right:14px}.world{width:270vw;height:220vh;left:-85vw;top:-55vh}.record{max-width:44vw}.record-image{max-height:30vh}.record.is-selected,.record.is-selected.text-record{width:calc(100vw - 28px)!important;max-width:calc(100vw - 28px)}.record.is-selected .record-image{max-height:35vh;max-width:100%;object-position:center}.record-info{position:relative;left:auto;top:auto;width:100%;min-width:0;max-height:31vh;margin-top:15px;padding:0 1px 18px;overflow:auto}.record.is-selected .record-info{opacity:1}.record.is-selected.text-record{max-height:calc(100dvh - 88px);overflow:auto}.record.is-selected.text-record .record-info{max-height:none}.record.is-selected.text-record .record-title{font-size:19px}.record.text-record{padding:9px 10px;min-height:54px}.record.text-record .record-title{font-size:12px}.record-category{font-size:7px;margin-bottom:5px}.record-label{font-size:8px}.space-status{left:14px;bottom:12px;font-size:8px}}
@media(prefers-reduced-motion:reduce){.record{animation:none!important}.menu-panel,.record-info{transition:none!important}}
</style>
</head>
<body>
<a class="site-title" href="index.html">SAKATA YUSHI</a><button class="edge-menu" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel">MENU</button>
<main class="space" id="space" aria-label="Floating archive space"><div class="world" id="world"></div><div class="backdrop-dim"></div><p class="space-status" id="space-status">AN ARCHIVE OF CURIOSITIES</p></main>
<nav class="menu-panel" id="menu-panel" aria-label="Site menu" aria-hidden="true"><a href="archive.html">ARCHIVE ↗</a><a href="text.html">TEXT ↗</a><a href="about.html">ABOUT ↗</a><span class="filter-title">FIND A RECORD</span><input id="record-search" type="search" placeholder="Search title or category" aria-label="Search records"><div class="filter-list" id="category-filters"></div></nav>
<script>
(()=> {
 const space=document.getElementById('space'),world=document.getElementById('world'),menu=document.getElementById('menu-panel'),toggle=document.getElementById('menu-toggle'),search=document.getElementById('record-search'),filters=document.getElementById('category-filters'),status=document.getElementById('space-status');
 let allItems=[],selected=null,drag=null,zCounter=30,menuOpen=false,renderToken=0;const activePointers=new Map();let pan=null,worldPanX=0,worldPanY=0;
 const mobile=()=>matchMedia('(max-width:700px)').matches,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const rand=(a,b)=>Math.random()*(b-a)+a;
 const esc=s=>String(s||'');
 function closeSelected(){if(!selected)return;selected.classList.remove('is-selected');selected.style.zIndex=selected.dataset.baseZ;selected.style.left=selected.dataset.baseLeft;selected.style.top=selected.dataset.baseTop;selected.style.setProperty('--x',selected.dataset.baseLeft);selected.style.setProperty('--y',selected.dataset.baseTop);const close=selected.querySelector('.record-close');if(close)close.remove();selected=null;document.body.classList.remove('has-selection');status.textContent=world.children.length+' RECORDS / AN ARCHIVE OF CURIOSITIES'}
 function selectRecord(el){if(selected===el){closeSelected();return}if(selected)closeSelected();selected=el;el.classList.add('is-selected');el.style.zIndex=600;document.body.classList.add('has-selection');status.textContent='SELECTED RECORD / CLOSE WITH ×';if(mobile()){const r=world.getBoundingClientRect();el.style.left=(14-r.left)+'px';el.style.top=(66-r.top)+'px'}const close=document.createElement('button');close.type='button';close.className='record-close';close.setAttribute('aria-label','Close enlarged record');close.textContent='×';close.addEventListener('pointerdown',e=>e.stopPropagation());close.addEventListener('pointerup',e=>e.stopPropagation());close.addEventListener('click',e=>{e.stopPropagation();closeSelected()});el.append(close)}
 function makeRecord(item,index,token){
   const el=document.createElement('article');el.className='record'+(!item.image&&!item.coverImage?' text-record':'');el.dataset.category=item.category||'ARCHIVE';el.dataset.depth=['far','mid','near'][index%3];
   const width=mobile()?rand(27,43):rand(12,25);
   const x=rand(4,Math.max(5,205-width)),y=rand(7,168);
   el.style.setProperty('--w',width.toFixed(2)+'vw');el.style.setProperty('--x',x.toFixed(2)+'vw');el.style.setProperty('--y',y.toFixed(2)+'vh');el.style.setProperty('--z',String(Math.round(rand(2,18))));el.style.setProperty('--duration',(reduced?0:rand(28,52)).toFixed(1)+'s');el.style.setProperty('--delay',(-rand(0,35)).toFixed(1)+'s');
   el.dataset.baseZ=el.style.getPropertyValue('--z');el.dataset.baseLeft=x.toFixed(2)+'vw';el.dataset.baseTop=y.toFixed(2)+'vh';
   const cat=document.createElement('span');cat.className='record-category';cat.textContent=item.category||'ARCHIVE';
   if(item.image||item.coverImage){const img=document.createElement('img');img.className='record-image';img.src=item.coverImage||item.image;img.alt=item.title||'';img.draggable=false;img.loading=index<10?'eager':'lazy';img.decoding='async';el.append(img,cat);const label=document.createElement('div');label.className='record-label';label.textContent=item.title||'';el.append(label)}
   else {const title=document.createElement('div');title.className='record-title';title.textContent=item.title||'Untitled';el.append(cat,title)}
   const info=document.createElement('div');info.className='record-info';const h=document.createElement('h2');h.className='info-title';h.textContent=item.title||'Untitled';info.append(h);
   const desc=document.createElement('div');desc.className='info-excerpt';desc.textContent=item.description||item.excerpt||'';if(desc.textContent)info.append(desc);
   if(item.detailPage){const a=document.createElement('a');a.className='detail-link';a.href=item.detailPage;a.textContent='OPEN FULL RECORD ↗';info.append(a)}el.append(info);
   // Drag and click are deliberately handled in pointerup, never by a click event.
   el.addEventListener('pointerdown',e=>{if(e.target.closest('.record-info a,.record-close'))return;if(e.pointerType==='touch'&&activePointers.size>1)return;if(e.pointerType==='mouse'&&e.button!==0)return;drag={el,id:e.pointerId,x:e.clientX,y:e.clientY,left:el.offsetLeft,top:el.offsetTop,moved:false};el.setPointerCapture(e.pointerId)});
   el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){el.classList.add('is-dragging');const localLeft=drag.left+dx;const localTop=drag.top+dy;el.style.left=Math.max(-el.offsetWidth,Math.min(world.clientWidth,localLeft))+'px';el.style.top=Math.max(-el.offsetHeight,Math.min(world.clientHeight,localTop))+'px';el.style.setProperty('--x',el.style.left);el.style.setProperty('--y',el.style.top);e.preventDefault()}});
   const end=e=>{if(!drag||drag.el!==el||drag.id!==e.pointerId)return;const wasMoved=drag.moved;el.classList.remove('is-dragging');drag=null;if(wasMoved){el.dataset.baseLeft=el.style.left;el.dataset.baseTop=el.style.top;el.style.zIndex=++zCounter;return}if(e.target.closest('.record-info a,.record-close'))return;selectRecord(el)};
   el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{if(drag&&drag.el===el){el.classList.remove('is-dragging');drag=null}});
   return el
 }
 function render(items){closeSelected();renderToken++;world.replaceChildren();const pool=items.filter(x=>x.image||x.coverImage||x.title).slice().sort(()=>Math.random()-.5);const limit=mobile()?Math.min(14,pool.length):Math.min(26,pool.length);pool.slice(0,limit).forEach((item,i)=>world.append(makeRecord(item,i,renderToken)));status.textContent=limit+' RECORDS / AN ARCHIVE OF CURIOSITIES'}
 function applyFilters(){const q=search.value.trim().toLowerCase(),active=filters.querySelector('[aria-pressed="true"]')?.dataset.filter||'ALL';render(allItems.filter(x=>(active==='ALL'||x.category===active)&&(!q||[x.title,x.category,x.description,x.excerpt].join(' ').toLowerCase().includes(q))))}
 function setupFilters(){filters.replaceChildren();const cats=[...new Set(allItems.map(x=>x.category).filter(Boolean))].sort();function add(label,value){const b=document.createElement('button');b.textContent=label;b.dataset.filter=value;b.setAttribute('aria-pressed',value==='ALL'?'true':'false');if(value==='ALL')b.style.borderBottomColor='currentColor';b.onclick=()=>{filters.querySelectorAll('button').forEach(t=>{t.setAttribute('aria-pressed','false');t.style.borderBottomColor='transparent'});b.setAttribute('aria-pressed','true');b.style.borderBottomColor='currentColor';applyFilters()};filters.append(b)}add('ALL','ALL');cats.forEach(c=>add(c,c))}
 
// Pan the whole archive: one-finger drag on empty mobile space, or two-finger drag anywhere.
function applyWorldPan(){world.style.transform=`translate3d(${worldPanX}px,${worldPanY}px,0)`}
space.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size>=2){drag=null;const pts=[...activePointers.values()];pan={mode:'two',x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2,baseX:worldPanX,baseY:worldPanY};e.preventDefault()}else if(mobile()&&!e.target.closest('.record')){pan={mode:'one',id:e.pointerId,x:e.clientX,y:e.clientY,baseX:worldPanX,baseY:worldPanY,moved:false};try{space.setPointerCapture(e.pointerId)}catch{}}},true);
space.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'||!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size>=2){const pts=[...activePointers.values()];if(!pan||pan.mode!=='two')pan={mode:'two',x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2,baseX:worldPanX,baseY:worldPanY};worldPanX=pan.baseX+(pts[0].x+pts[1].x)/2-pan.x;worldPanY=pan.baseY+(pts[0].y+pts[1].y)/2-pan.y;applyWorldPan();e.preventDefault()}else if(pan?.mode==='one'&&pan.id===e.pointerId){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>5)pan.moved=true;if(pan.moved){worldPanX=pan.baseX+dx;worldPanY=pan.baseY+dy;applyWorldPan();e.preventDefault()}}},true);
function endPanPointer(e){activePointers.delete(e.pointerId);if(activePointers.size===0)pan=null;else if(activePointers.size===1){const p=[...activePointers.values()][0];pan={mode:'one',id:[...activePointers.keys()][0],x:p.x,y:p.y,baseX:worldPanX,baseY:worldPanY,moved:true}}}
space.addEventListener('pointerup',endPanPointer,true);space.addEventListener('pointercancel',endPanPointer,true);
toggle.addEventListener('click',()=>{menuOpen=!menuOpen;menu.classList.toggle('is-open',menuOpen);menu.setAttribute('aria-hidden',String(!menuOpen));toggle.setAttribute('aria-expanded',String(menuOpen))});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSelected();menuOpen=false;menu.classList.remove('is-open');menu.setAttribute('aria-hidden','true');toggle.setAttribute('aria-expanded','false')}});
 search.addEventListener('input',applyFilters);window.addEventListener('resize',()=>{if(allItems.length)applyFilters()});
 fetch('archive-data.json').then(r=>{if(!r.ok)throw Error('Archive data unavailable');return r.json()}).then(data=>{allItems=Array.isArray(data)?data:(data.items||[]);setupFilters();render(allItems)}).catch(err=>{console.error(err);status.textContent='ARCHIVE DATA COULD NOT BE LOADED'});
})();
</script></body></html>

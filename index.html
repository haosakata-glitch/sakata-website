<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>坂田雄志｜Archive</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }


    /* Header */

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #111;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #111;
      text-decoration: none;
    }

    .site-title {
      font-size: 18px;
    }

    .about-link {
      font-size: 14px;
    }


    /* Main */

    main {
      padding: 30px;
    }


    /* Introduction */

    .intro {
      margin-bottom: 55px;
      max-width: 700px;
    }

    .intro-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }

    .intro-text {
      font-size: 22px;
      line-height: 1.7;
      margin: 0;
    }


    /* Categories */

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;

      margin-bottom: 35px;

      border-top: 1px solid #111;
      padding-top: 15px;
    }

    .category {
      border: none;
      padding: 0;

      background: none;

      color: #111;

      font-family: inherit;
      font-size: 13px;

      cursor: pointer;

      text-decoration: none;
    }

    .category:hover {
      opacity: 0.5;
    }

    .category.active {
      text-decoration: underline;
      text-underline-offset: 4px;
    }


    /* Archive */

    .archive {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 35px 20px;
    }


    /* Archive Item */

    .item {

      display: block;

      color: #111;

      text-decoration: none;
    }

    .item-image {

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      display: block;

      margin-bottom: 12px;
    }

    .item-title {

      font-size: 15px;

      line-height: 1.5;

      margin-bottom: 5px;
    }

    .item-meta {

      font-size: 12px;

      color: #777;

      line-height: 1.5;
    }

    .item:hover .item-image {

      opacity: 0.7;
    }


    /* Footer */

    footer {

      padding:
        100px
        30px
        30px;

      font-size: 12px;

      color: #666;
    }


    /* Tablet */

    @media (max-width: 800px) {

      header {

        padding:
          18px
          20px;
      }

      main {

        padding:
          20px;
      }

      .archive {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 25px 15px;
      }

      .intro-text {

        font-size: 20px;
      }

    }


    /* Mobile */

    @media (max-width: 500px) {

      .archive {

        grid-template-columns:
          1fr;
      }

      .categories {

        gap: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- Header -->

  <header>

    <a
      href="index.html"
      class="site-title"
    >
      坂田雄志
    </a>

    <a
      href="about.html"
      class="about-link"
    >
      About
    </a>

  </header>



  <!-- Main -->

  <main>


    <!-- Introduction -->

    <section class="intro">

      <div class="intro-title">
        ARCHIVE
      </div>

      <p class="intro-text">
        建築、もの、食べもの、本、文章、写真、場所。
        身の回りのものを記録しています。
      </p>

    </section>



    <!-- Categories -->

    <nav class="categories">

      <button
        class="category active"
        data-category="ALL"
      >
        ALL
      </button>

      <button
        class="category"
        data-category="ARCHITECTURE"
      >
        ARCHITECTURE
      </button>

      <button
        class="category"
        data-category="OBJECT"
      >
        OBJECT
      </button>

      <button
        class="category"
        data-category="FOOD"
      >
        FOOD
      </button>

      <a
        href="books.html"
        class="category"
      >
        BOOK
      </a>

      <button
        class="category"
        data-category="TEXT"
      >
        TEXT
      </button>

      <a
        href="photos.html"
        class="category"
      >
        PHOTO
      </a>

      <button
        class="category"
        data-category="PLACE"
      >
        PLACE
      </button>

    </nav>



    <!-- Archive -->

    <section class="archive">


      <!-- ARCHITECTURE -->

      <a
        href="work-01.html"
        class="item"
        data-category="ARCHITECTURE"
      >

        <img
          src="work-01.jpg"
          alt=""
          class="item-image"
        >

        <div class="item-title">
          (仮)下仁田蒸留所
        </div>

        <div class="item-meta">
          ARCHITECTURE / 2026
        </div>

      </a>



      <!-- FOOD -->

      <a
        href="article-01.html"
        class="item"
        data-category="FOOD"
      >

        <img
          src="IMG_6091.jpg"
          alt=""
          class="item-image"
        >

        <div class="item-title">
          今朝のピクルス
        </div>

        <div class="item-meta">
          FOOD / 2026.10.06
        </div>

      </a>



      <!-- BOOK -->

      <a
        href="book-01.html"
        class="item"
        data-category="BOOK"
      >

        <img
          src="book-01.jpg"
          alt=""
          class="item-image"
        >

        <div class="item-title">
          大杉栄伝　永遠のアナキズム
        </div>

        <div class="item-meta">
          BOOK / 栗原康 / 2021
        </div>

      </a>



      <!-- PHOTO -->

      <a
        href="photo-01.html"
        class="item"
        data-category="PHOTO"
      >

        <img
          src="photo-01.jpg"
          alt=""
          class="item-image"
        >

        <div class="item-title">
          写真のタイトル
        </div>

        <div class="item-meta">
          PHOTO / 2026.10.07
        </div>

      </a>


    </section>


  </main>



  <!-- Footer -->

  <footer>

    © 坂田雄志

  </footer>



  <!-- Category Filter -->

  <script>

    const categoryButtons =
      document.querySelectorAll(
        ".category[data-category]"
      );


    const items =
      document.querySelectorAll(
        ".item"
      );


    categoryButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const selectedCategory =
              button.dataset.category;


            categoryButtons.forEach(
              button => {

                button.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            items.forEach(
              item => {

                const itemCategory =
                  item.dataset.category;


                if (
                  selectedCategory === "ALL" ||
                  selectedCategory === itemCategory
                ) {

                  item.style.display = "";

                } else {

                  item.style.display = "none";

                }

              }
            );

          }
        );

      }
    );

  </script>


</body>
</html>

<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAKATA KATSUYUKI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #E9E5DE;
      color: rgba(34, 34, 34, 0.68);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font-family: inherit;
    }

    /* HEADER */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(233, 229, 222, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(34, 34, 34, 0.06);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      min-height: 58px;
      padding: 0 22px;
    }

    .site-title {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: rgba(34, 34, 34, 0.72);
    }

    .main-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .main-nav a,
    .main-nav button {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex: 0 0 auto;
      height: 20px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: rgba(34, 34, 34, 0.48);
      text-decoration: none;
      text-underline-offset: 3px;
    }

    .main-nav a:hover,
    .main-nav button:hover {
      color: rgba(34, 34, 34, 0.72);
    }

    .main-nav .active {
      color: #222222;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .about-link {
      margin-left: 10px !important;
      padding-left: 18px !important;
      border-left: 1px solid rgba(34, 34, 34, 0.14) !important;
    }

    /* MAIN */

    main {
      padding: 86px 22px 100px;
    }

    /* ARCHIVE GRID */

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 18px;
      row-gap: 18px;
      align-items: start;
    }

    .archive-item {
      display: block;
      position: relative;
      min-width: 0;
    }

    .archive-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #FFFFFF;
    }

    .archive-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* TITLE / DATE */

    .archive-caption {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 18px;
      background: rgba(233, 229, 222, 0.80);
      color: rgba(34, 34, 34, 0.82);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.03em;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    /* PC：カーソルを合わせると写真が薄く白くなる */

    @media (hover: hover) and (pointer: fine) {
      .archive-image {
        transition: opacity 0.2s ease;
      }

      .archive-item:hover .archive-image {
        opacity: 1;
      }

      .archive-item:hover .archive-caption {
        opacity: 1;
      }
    }

    .archive-item:focus-visible .archive-caption {
      opacity: 1;
    }

    .archive-item:focus-visible .archive-image {
      opacity: 1;
    }

    .archive-caption-title {
      white-space: normal;
      overflow-wrap: anywhere;
      text-overflow: clip;
      max-width: 100%;
    }

    .archive-caption-date {
      flex-shrink: 0;
      color: rgba(34, 34, 34, 0.56);
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .header-inner {
        min-height: 52px;
        padding: 0 14px;
        gap: 15px;
      }

      .site-title {
        font-size: 10px;
      }

      .main-nav {
        gap: 10px;
        flex-wrap: nowrap;
      }

      .main-nav a,
      .main-nav button {
        font-size: 9px;
        height: 18px;
      }
main {
        padding: 72px 10px 70px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 10px;
        row-gap: 10px;
      }

      .archive-caption {
        padding: 12px;
        font-size: 8px;
      }

      .archive-caption-title {
        font-size: 8px;
      }

      .archive-caption-date {
        font-size: 8px;
        color: rgba(34, 34, 34, 0.56);
      }

      /* スマホ：最初のタップで写真を白くしてタイトルを表示 */

      .archive-item.is-caption-visible .archive-image {
        opacity: 1;
      }

      .archive-item.is-caption-visible .archive-caption {
        opacity: 1;
      }
}
  </style>

</head>

<body>
  <!-- HEADER -->

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">
        SAKATA KATSUYUKI
      </a>

  <nav class="main-nav">
    <button type="button" data-category="ALL" class="active">
      ALL
    </button>

    <button type="button" data-category="ARCHITECTURE">
      ARCHITECTURE
    </button>

    <button type="button" data-category="OBJECT">
      OBJECT
    </button>

    <button type="button" data-category="FOOD">
      FOOD
    </button>

    <a href="book.html">BOOK</a>

    <button type="button" data-category="TEXT">
      TEXT
    </button>

    <button type="button" data-category="PHOTO">
      PHOTO
    </button>

    <button type="button" data-category="PLACE">
      PLACE
    </button>

    <button type="button" data-category="OTHER">
      OTHER
    </button>

    <a href="https://haosakata-glitch.github.io/sakata-website/about.html" class="about-link">ABOUT</a>
  </nav>
</div>

  </header>

  <!-- MAIN -->

  <main>
    <section
      id="archive"
      class="archive-grid"
      aria-live="polite"
    ></section>

</main>

  <script>
    const archive = document.getElementById("archive");

    const categoryButtons = document.querySelectorAll(
      ".main-nav button[data-category]"
    );
    const navItems = document.querySelectorAll(
      ".main-nav a, .main-nav button"
    );

    let archiveData = [];

    const params = new URLSearchParams(
      window.location.search
    );

    const initialCategory = params.get("category") || "ALL";

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}.${month}.${day}`;
    }

    function renderArchive(category) {
      archive.innerHTML = "";

      let filteredData = archiveData;

      if (category !== "ALL") {
        filteredData = archiveData.filter(
          item => item.category === category
        );
      }

      filteredData.forEach(item => {
        const link = document.createElement("a");

        link.className = "archive-item";
        link.href = item.detailPage || "#";

        const imageWrap = document.createElement("div");
        imageWrap.className = "archive-image-wrap";

        const image = document.createElement("img");
        image.className = "archive-image";
        image.src = item.coverImage || item.image;
        image.alt = item.title || "";

        const caption = document.createElement("div");
        caption.className = "archive-caption";

        const title = document.createElement("span");
        title.className = "archive-caption-title";
        title.textContent = item.title || "";

        const dateValue =
          item.date ||
          item.createdAt ||
          item.publishedAt ||
          "";

        const date = document.createElement("span");
        date.className = "archive-caption-date";
        date.textContent = formatDate(dateValue);

        caption.appendChild(title);

        if (date.textContent) {
          caption.appendChild(date);
        }

        imageWrap.appendChild(image);
        imageWrap.appendChild(caption);
        link.appendChild(imageWrap);

        link.addEventListener("click", event => {
          const isTouchLayout = window.matchMedia(
            "(max-width: 650px) and (hover: none)"
          ).matches;

          if (!isTouchLayout) {
            return;
          }

          if (!link.classList.contains("is-caption-visible")) {
            event.preventDefault();

            document
              .querySelectorAll(".archive-item.is-caption-visible")
              .forEach(openItem => {
                openItem.classList.remove("is-caption-visible");
              });

            link.classList.add("is-caption-visible");
          }
        });

        archive.appendChild(link);
      });
    }

    /* カテゴリー切り替え */

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        const category = button.dataset.category;

        navItems.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        const url = new URL(window.location.href);

        if (category === "ALL") {
          url.searchParams.delete("category");
        } else {
          url.searchParams.set("category", category);
        }

        window.history.pushState({}, "", url);

        renderArchive(category);
      });
    });

    /* ブラウザの戻る・進む */

    window.addEventListener("popstate", () => {
      const urlParams = new URLSearchParams(
        window.location.search
      );

      const category = urlParams.get("category") || "ALL";

      navItems.forEach(item => {
        item.classList.remove("active");
      });

      const activeButton = document.querySelector(
        `.main-nav button[data-category="${category}"]`
      );

      if (activeButton) {
        activeButton.classList.add("active");
      }
renderArchive(category);
    });

    /* archive-data.jsonを読み込み */

    fetch("archive-data.json")
      .then(response => {
        if (!response.ok) {
          throw new Error(
            "archive-data.json の読み込みに失敗しました。"
          );
        }

        return response.json();
      })
      .then(data => {
        archiveData = Array.isArray(data)
          ? data
          : data.items || [];

        navItems.forEach(item => {
          item.classList.remove("active");
        });

        const initialButton = document.querySelector(
          `.main-nav button[data-category="${initialCategory}"]`
        );

        if (initialButton) {
          initialButton.classList.add("active");
        }

        renderArchive(initialCategory);
      })
      .catch(error => {
        console.error(error);

        archive.innerHTML =
          "<p>Archive data could not be loaded.</p>";
      });
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAKATA KATSUYUKI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #E9E5DE;
      color: rgba(34, 34, 34, 0.68);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font-family: inherit;
    }

    /* HEADER */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(233, 229, 222, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(34, 34, 34, 0.06);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      min-height: 58px;
      padding: 0 22px;
    }

    .site-title {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: rgba(34, 34, 34, 0.72);
    }

    .main-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: wrap;
    }

    .main-nav a,
    .main-nav button {
      position: relative;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: rgba(34, 34, 34, 0.62);
    }

    .main-nav a:hover,
    .main-nav button:hover {
      opacity: 0.8;
    }

    .main-nav .active {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .about-link {
      margin-left: 10px;
      padding-left: 18px !important;
      border-left: 1px solid rgba(34, 34, 34, 0.14) !important;
    }

    /* MAIN */

    main {
      padding: 86px 22px 100px;
    }

    /* ARCHIVE GRID */

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 18px;
      row-gap: 18px;
      align-items: start;
    }

    .archive-item {
      display: block;
      position: relative;
      min-width: 0;
    }

    .archive-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .archive-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* TITLE / DATE */

    .archive-caption {
      position: absolute;
      right: 10px;
      bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      max-width: calc(100% - 20px);
      font-size: 9px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.82);
      text-align: right;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* PC：カーソルを合わせたときに表示 */

    @media (hover: hover) and (pointer: fine) {
      .archive-item:hover .archive-caption {
        opacity: 1;
      }
    }

    /* キーボード操作時にも表示 */

    .archive-item:focus-visible .archive-caption {
      opacity: 1;
    }

    .archive-caption-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .archive-caption-date {
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.62);
    }

    /* ABOUT */

    .about {
      margin-top: 140px;
      border-top: 1px solid rgba(34, 34, 34, 0.07);
      padding-top: 35px;
    }

    .about-inner {
      display: grid;
      grid-template-columns: 120px 1fr;
      column-gap: 30px;
      max-width: 900px;
    }

    .about-label {
      font-size: 10px;
      color: rgba(34, 34, 34, 0.50);
      letter-spacing: 0.04em;
    }

    .about-text {
      max-width: 600px;
      font-size: 10px;
      line-height: 1.7;
      color: rgba(34, 34, 34, 0.62);
    }

    .about-name {
      margin-bottom: 16px;
      font-size: 11px;
      color: rgba(34, 34, 34, 0.70);
    }

    .about-text p {
      margin: 0 0 18px;
    }

    .about-contact a {
      border-bottom: 1px solid rgba(34, 34, 34, 0.12);
    }

    .about-contact a:hover {
      opacity: 0.65;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .header-inner {
        min-height: 52px;
        padding: 0 14px;
        gap: 15px;
      }

      .site-title {
        font-size: 10px;
      }

      .main-nav {
        gap: 10px;
      }

      .main-nav a,
      .main-nav button {
        font-size: 9px;
      }

      .about-link {
        margin-left: 4px;
        padding-left: 10px !important;
      }

      main {
        padding: 72px 10px 70px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 10px;
        row-gap: 10px;
      }

      .archive-caption {
        right: 7px;
        bottom: 6px;
        gap: 5px;
        font-size: 8px;
      }

      /* スマホ：タップした画像だけタイトルを表示 */

      .archive-item.is-caption-visible .archive-caption {
        opacity: 1;
      }

      .about {
        margin-top: 90px;
        padding-top: 25px;
      }

      .about-inner {
        grid-template-columns: 70px 1fr;
        column-gap: 15px;
      }

      .about-text {
        font-size: 9px;
      }

      .about-name {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <!-- HEADER -->

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">
        SAKATA KATSUYUKI
      </a>

      <nav class="main-nav">
        <button type="button" data-category="ALL" class="active">
          ALL
        </button>

        <button type="button" data-category="ARCHITECTURE">
          ARCHITECTURE
        </button>

        <button type="button" data-category="OBJECT">
          OBJECT
        </button>

        <button type="button" data-category="FOOD">
          FOOD
        </button>

        <a href="book.html">BOOK</a>

        <button type="button" data-category="TEXT">
          TEXT
        </button>

        <button type="button" data-category="PHOTO">
          PHOTO
        </button>

        <button type="button" data-category="PLACE">
          PLACE
        </button>

        <button type="button" data-category="OTHER">
          OTHER
        </button>

        <a href="#about" class="about-link">ABOUT</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->

  <main>
    <section
      id="archive"
      class="archive-grid"
      aria-live="polite"
    ></section>

    <!-- ABOUT -->

    <section id="about" class="about">
      <div class="about-inner">
        <div class="about-label">ABOUT</div>

        <div class="about-text">
          <div class="about-name">
            坂田雄志 / Sakata Katsuyuki
          </div>

          <p class="about-profile">
            建築家。<br>
            2016–2020 近畿大学建築学部建築学科 松岡聡研究室<br>
            2020–2023 横浜国立大学大学院 Y-GSA<br>
            2023–2024 平田明久建築設計事務所<br>
            2024–2026 Archipelago Architects Studio
          </p>

          <p class="about-contact">
            <a href="mailto:hao.sakata@gmail.com">
              hao.sakata@gmail.com
            </a>
            <br>

            <a
              href="https://www.instagram.com/katsu_0708/"
              target="_blank"
              rel="noopener"
            >Instagram</a>
            <br>

            <a
              href="https://x.com/Katsuskt"
              target="_blank"
              rel="noopener"
            >X</a>
            <br>

            <a
              href="https://note.com/kind_nerine7"
              target="_blank"
              rel="noopener"
            >note</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- JAVASCRIPT -->

  <script>
    const archive = document.getElementById("archive");

    const categoryButtons = document.querySelectorAll(
      ".main-nav button[data-category]"
    );

    let archiveData = [];

    const params = new URLSearchParams(
      window.location.search
    );

    const initialCategory = params.get("category") || "ALL";

    /*
      日付を整形
    */

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      const year = date.getFullYear();

      const month = String(
        date.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        date.getDate()
      ).padStart(2, "0");

      return `${year}.${month}.${day}`;
    }

    /*
      Archiveを表示
    */

    function renderArchive(category) {
      archive.innerHTML = "";

      let filteredData = archiveData;

      if (category !== "ALL") {
        filteredData = archiveData.filter(
          item => item.category === category
        );
      }

      filteredData.forEach(item => {
        const link = document.createElement("a");

        link.className = "archive-item";
        link.href = item.detailPage || "#";

        /*
          画像
        */

        const imageWrap = document.createElement("div");
        imageWrap.className = "archive-image-wrap";

        const image = document.createElement("img");
        image.className = "archive-image";
        image.src = item.coverImage || item.image;
        image.alt = item.title || "";

        /*
          タイトル・日付
        */

        const caption = document.createElement("div");
        caption.className = "archive-caption";

        const title = document.createElement("span");
        title.className = "archive-caption-title";
        title.textContent = item.title || "";

        const dateValue =
          item.date ||
          item.createdAt ||
          item.publishedAt ||
          "";

        const date = document.createElement("span");
        date.className = "archive-caption-date";
        date.textContent = formatDate(dateValue);

        caption.appendChild(title);

        if (date.textContent) {
          caption.appendChild(date);
        }

        imageWrap.appendChild(image);
        imageWrap.appendChild(caption);
        link.appendChild(imageWrap);

        /*
          スマホ：
          1回目のタップでタイトルを表示。
          2回目のタップで詳細ページへ移動。
        */

        link.addEventListener("click", event => {
          const isTouchLayout = window.matchMedia(
            "(max-width: 650px) and (hover: none)"
          ).matches;

          if (!isTouchLayout) {
            return;
          }

          if (!link.classList.contains("is-caption-visible")) {
            event.preventDefault();

            document
              .querySelectorAll(".archive-item.is-caption-visible")
              .forEach(openItem => {
                openItem.classList.remove("is-caption-visible");
              });

            link.classList.add("is-caption-visible");
          }
        });

        archive.appendChild(link);
      });
    }

    /*
      カテゴリーボタン
    */

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        const category = button.dataset.category;

        categoryButtons.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        const url = new URL(window.location.href);

        if (category === "ALL") {
          url.searchParams.delete("category");
        } else {
          url.searchParams.set("category", category);
        }

        window.history.pushState({}, "", url);

        renderArchive(category);
      });
    });

    /*
      戻る・進む操作でカテゴリーを復元
    */

    window.addEventListener("popstate", () => {
      const urlParams = new URLSearchParams(
        window.location.search
      );

      const category = urlParams.get("category") || "ALL";

      categoryButtons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.category === category
        );
      });

      renderArchive(category);
    });

    /*
      archive-data.jsonを読み込み
    */

    fetch("archive-data.json")
      .then(response => {
        if (!response.ok) {
          throw new Error(
            "archive-data.json の読み込みに失敗しました。"
          );
        }

        return response.json();
      })
      .then(data => {
        archiveData = Array.isArray(data)
          ? data
          : data.items || [];

        categoryButtons.forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.category === initialCategory
          );
        });

        renderArchive(initialCategory);
      })
      .catch(error => {
        console.error(error);

        archive.innerHTML =
          "<p>Archive data could not be loaded.</p>";
      });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>坂田雄志｜Sakata Katsuyuki</title>
  <meta name="description" content="坂田雄志の建築、デザイン、日常の記録をまとめたアーカイブ。">

  <style>
    :root {
      --background: #E9E5DE;
      --text: #24231F;
      --secondary: #77736B;
      --line: #CBC5BB;
      --gap: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 300;
      color: var(--text);
      background: var(--background);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */

    header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      width: 100%;
      height: 54px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      background: rgba(233, 229, 222, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 25px;
      min-width: 0;
      flex: 1;
    }

    .site-title {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.035em;
      white-space: nowrap;
    }

    .category-nav {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .header-category {
      flex-shrink: 0;
      border: 0;
      padding: 4px 0;
      background: transparent;

      font: inherit;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.035em;
      color: var(--secondary);
      white-space: nowrap;
      cursor: pointer;
    }

    .header-category:hover,
    .header-category.active {
      color: var(--text);
    }

    .header-category.active {
      font-weight: 500;
    }

    .about-link {
      flex-shrink: 0;
      padding-left: 14px;
      border-left: 1px solid var(--line);

      font-size: 10px;
      font-weight: 300;
      white-space: nowrap;
    }

    /* Archive */

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 76px 24px 90px;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: var(--gap);
      row-gap: 42px;
    }

    .archive-item {
      display: block;
      min-width: 0;
    }

    .archive-image {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #DDD7CE;
    }

    .archive-caption {
      padding-top: 10px;
    }

    .archive-category {
      margin-bottom: 4px;
      color: var(--secondary);
      font-size: 8px;
      line-height: 1.4;
      letter-spacing: 0.075em;
      font-weight: 300;
    }

    .archive-title {
      font-size: 11px;
      line-height: 1.5;
      font-weight: 400;
      overflow-wrap: anywhere;
    }

    .archive-item:hover .archive-title {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 30px 0;
      color: var(--secondary);
      font-size: 11px;
    }

    /* Tablet */

    @media (max-width: 1000px) {
      header {
        padding: 0 18px;
        gap: 14px;
      }

      .header-left {
        gap: 20px;
      }

      .category-nav {
        gap: 12px;
      }

      main {
        padding-right: 18px;
        padding-left: 18px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 16px;
        row-gap: 34px;
      }
    }

    /* Mobile */

    @media (max-width: 600px) {
      header {
        height: 48px;
        padding: 0 12px;
        gap: 10px;
      }

      .header-left {
        gap: 15px;
        flex: 1;
        overflow: hidden;
      }

      .site-title {
        font-size: 10px;
      }

      .category-nav {
        gap: 12px;
      }

      .header-category {
        font-size: 8px;
      }

      .about-link {
        padding-left: 10px;
        font-size: 9px;
      }

      main {
        padding: 64px 10px 60px;
      }

      .archive-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 10px;
        row-gap: 27px;
      }

      .archive-caption {
        padding-top: 7px;
      }

      .archive-category {
        font-size: 7px;
        margin-bottom: 3px;
      }

      .archive-title {
        font-size: 10px;
        line-height: 1.45;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="site-title">SAKATA KATSUYUKI</a>

      <nav class="category-nav" aria-label="Archive categories">
        <button class="header-category active" data-category="ALL">ALL</button>
        <button class="header-category" data-category="ARCHITECTURE">ARCHITECTURE</button>
        <button class="header-category" data-category="OBJECT">OBJECT</button>
        <button class="header-category" data-category="FOOD">FOOD</button>
        <button class="header-category" data-category="BOOK">BOOK</button>
        <button class="header-category" data-category="TEXT">TEXT</button>
        <button class="header-category" data-category="PHOTO">PHOTO</button>
        <button class="header-category" data-category="PLACE">PLACE</button>
        <button class="header-category" data-category="OTHER">OTHER</button>
      </nav>
    </div>

    <a href="about.html" class="about-link">About</a>
  </header>

  <main>
    <div id="archive-grid" class="archive-grid"></div>
  </main>

  <script>
    const grid = document.getElementById("archive-grid");
    const filters = document.querySelectorAll(".header-category");

    let archiveItems = [];

    function render(category = "ALL") {
      grid.innerHTML = "";

      const items = archiveItems.filter(item => {
        return category === "ALL" || item.category === category;
      });

      if (items.length === 0) {
        grid.innerHTML =
          '<div class="empty">まだ項目がありません。</div>';
        return;
      }

      items.forEach(item => {
        const link = document.createElement("a");
        link.className = "archive-item";
        link.href = item.detailPage;

        const image = document.createElement("img");
        image.className = "archive-image";
        image.src = item.image;
        image.alt = item.title || "";
        image.loading = "lazy";

        const caption = document.createElement("div");
        caption.className = "archive-caption";

        const categoryLabel = document.createElement("div");
        categoryLabel.className = "archive-category";
        categoryLabel.textContent = item.category;

        const title = document.createElement("div");
        title.className = "archive-title";
        title.textContent = item.title;

        caption.appendChild(categoryLabel);
        caption.appendChild(title);

        link.appendChild(image);
        link.appendChild(caption);

        grid.appendChild(link);
      });
    }

    async function loadArchive() {
      try {
        const response = await fetch("archive-data.json");

        if (!response.ok) {
          throw new Error("Archive data not found");
        }

        archiveItems = await response.json();
        render();

      } catch (error) {
        console.error(error);
        grid.innerHTML =
          '<div class="empty">Archiveを読み込めませんでした。</div>';
      }
    }

    filters.forEach(filter => {
      filter.addEventListener("click", () => {
        filters.forEach(button => button.classList.remove("active"));
        filter.classList.add("active");
        render(filter.dataset.category);
      });
    });

    loadArchive();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E9E5DE">
<meta name="description" content="SAKATA YUSHI — 蔵書についての感想・まとめ。">
<title>BOOKSHELF｜SAKATA YUSHI</title>
<style>
  :root {
    --background: #E9E5DE;
    --panel: #E4DFD6;
    --text: #24231F;
    --secondary: #77736B;
    --line: #CBC5BB;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    font-weight: 300;
    color: var(--text);
    background: var(--background);
  }

  a {
    color: inherit;
  }

  /* Header (他のページと共通) */

  header {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    width: 100%;
    min-height: 58px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    background: rgba(233, 229, 222, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  header a {
    text-decoration: none;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 30px;
    min-width: 0;
    flex: 1;
  }

  .site-title {
    flex: 0 0 auto;
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .035em;
    white-space: nowrap;
  }

  .category-nav {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .category-nav::-webkit-scrollbar {
    display: none;
  }

  .header-category {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 20px;
    padding: 0;
    color: rgba(34, 34, 34, 0.48);
    font-size: 10px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: .04em;
    white-space: nowrap;
    border-bottom: 1px solid transparent;
  }

  .header-category.active {
    color: #222;
    border-bottom-color: #222;
  }

  .about-link {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 0 0 14px;
    border-left: 1px solid var(--line);
    color: rgba(34, 34, 34, 0.48);
    font-size: 10px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: .04em;
    white-space: nowrap;
  }

  /* Main */

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 90px 24px 80px;
  }

  .crosslinks {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    margin: 0 0 34px;
    font-size: 10px;
    letter-spacing: .1em;
  }

  .crosslinks.bottom {
    margin: 60px 0 0;
  }

  .crosslinks a {
    color: var(--secondary);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .crosslinks a:hover {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .note-head {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    margin: 0 0 40px;
  }

  .note-cover {
    flex: 0 0 120px;
    width: 120px;
  }

  .cover {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .noimg {
    display: flex;
    align-items: center;
    padding: 10px;
    color: var(--secondary);
    font-size: 11px;
    line-height: 1.6;
    overflow: hidden;
    word-break: break-all;
  }

  .note-info {
    min-width: 0;
    flex: 1;
  }

  h1 {
    margin: 0 0 12px;
    color: var(--text);
    font-size: clamp(18px, 2.6vw, 28px);
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: .02em;
    overflow-wrap: anywhere;
  }

  .note-meta,
  .note-date {
    margin: 0 0 4px;
    color: var(--secondary);
    font-size: 11px;
    line-height: 1.7;
  }

  .note-body {
    font-size: 14px;
    line-height: 2;
    letter-spacing: .02em;
    overflow-wrap: anywhere;
  }

  .note-body p {
    margin: 0 0 1.6em;
    white-space: pre-line;
  }

  .note-body h2 {
    margin: 2.4em 0 .8em;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: .04em;
  }

  .note-body blockquote {
    margin: 0 0 1.6em;
    padding: 0 0 0 16px;
    border-left: 1px solid var(--line);
    color: var(--secondary);
    white-space: pre-line;
  }

  .empty {
    padding: 24px 0;
    color: var(--secondary);
    font-size: 12px;
  }

  .credit {
    margin-top: 8px;
    line-height: 1.6;
  }

  .credit a {
    color: var(--secondary);
  }

  footer {
    padding: 0 24px 30px;
    color: var(--secondary);
    font-size: 10px;
  }

  @media (max-width: 600px) {
    header {
      min-height: 52px;
      padding: 0 14px;
      gap: 10px;
    }

    .header-left {
      gap: 20px;
    }

    .site-title {
      font-size: 10px;
    }

    .category-nav {
      gap: 10px;
    }

    .header-category {
      height: 18px;
      font-size: 9px;
    }

    .about-link {
      height: 18px;
      padding-left: 10px;
      font-size: 9px;
    }

    main {
      padding: 76px 16px 60px;
    }

    .note-head {
      gap: 14px;
    }

    .note-cover {
      flex-basis: 88px;
      width: 88px;
    }

    .note-body {
      font-size: 13.5px;
    }

    footer {
      padding: 0 16px 30px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="header-left">
    <a href="index.html" class="site-title">SAKATA YUSHI</a>
    <nav class="category-nav" aria-label="Archive categories">
<a class="header-category category-BOOKSHELF active" href="books.html" aria-current="page">BOOKSHELF</a>
<a class="header-category category-ALL" href="archive.html">ALL</a>
<a class="header-category category-ARCHITECTURE" href="archive.html?category=ARCHITECTURE">ARCHITECTURE</a>
<a class="header-category category-OBJECT" href="archive.html?category=OBJECT">OBJECT</a>
<a class="header-category category-FOOD" href="archive.html?category=FOOD">FOOD</a>
<a class="header-category category-BOOK" href="archive.html?category=BOOK">BOOK</a>
<a class="header-category category-TEXT" href="text.html">TEXT</a>
<a class="header-category category-PHOTO" href="archive.html?category=PHOTO">PHOTO</a>
<a class="header-category category-PLACE" href="archive.html?category=PLACE">PLACE</a>
<a class="header-category category-OTHER" href="archive.html?category=OTHER">OTHER</a>
    </nav>
  </div>
  <a href="about.html" class="about-link">About</a>
</header>

<main>

  <p class="crosslinks" aria-label="本棚へ"><a href="books.html">← BOOKSHELF</a></p>

  <article id="note" hidden>
    <div class="note-head">
      <div class="note-cover" id="note-cover"></div>
      <div class="note-info">
        <h1 id="note-title"></h1>
        <p class="note-meta" id="note-meta"></p>
        <p class="note-date" id="note-date"></p>
      </div>
    </div>
    <div class="note-body" id="note-body"></div>
  </article>

  <p class="empty" id="note-empty" hidden>この本の感想は、まだありません。</p>

  <p class="crosslinks bottom" aria-label="本棚へ"><a href="books.html">← BOOKSHELF</a></p>

</main>

<footer>
  <div>© 坂田雄志</div>
  <div class="credit">書誌データ: <a href="https://ndlsearch.ndl.go.jp/" target="_blank" rel="noopener noreferrer">国立国会図書館サーチ</a>（NDLサーチ API）、<a href="https://books.google.com/" target="_blank" rel="noopener noreferrer">Google Books</a>。書影は Amazon・国立国会図書館サーチ・Google Books の画像を表示しています（画像の権利は各権利者にあります）。</div>
</footer>

<script src="bookshelf/shelf-common.js"></script>
<script>
(function () {
  "use strict";

  var id = new URLSearchParams(window.location.search).get("id") || "";
  var articleEl = document.getElementById("note");
  var emptyEl = document.getElementById("note-empty");

  function showEmpty(message) {
    articleEl.hidden = true;
    if (message) {
      emptyEl.textContent = message;
    }
    emptyEl.hidden = false;
  }

  // 本人が書いた文章を、段落・小見出し・引用に整えて入れる（HTML としては解釈しない）。
  //   空行で段落が分かれる / 「## 」で始まる行は小見出し / 「> 」で始まる段落は引用
  function renderNote(text, container) {
    var blocks = String(text).replace(/\r\n?/g, "\n").replace(/^(#{1,2} .*)\n(?!\n)/gm, "$1\n\n").split(/\n{2,}/);
    blocks.forEach(function (block) {
      block = block.replace(/^\n+|\s+$/g, "");
      if (!block) {
        return;
      }
      var node;
      if (/^#{1,2} /.test(block)) {
        node = document.createElement("h2");
        node.textContent = block.replace(/^#{1,2} /, "");
      } else if (/^> /.test(block)) {
        node = document.createElement("blockquote");
        node.textContent = block.split("\n").map(function (line) { return line.replace(/^> ?/, ""); }).join("\n");
      } else {
        node = document.createElement("p");
        node.textContent = block;
      }
      container.appendChild(node);
    });
  }

  if (!/^[\w-]+$/.test(id)) {
    showEmpty();
    return;
  }

  Promise.all([Shelf.loadBooks(), Shelf.loadNotes()])
    .then(function (result) {
      var book = result[0].filter(function (b) { return b && b.id === id; })[0];
      var target = book ? Shelf.noteTarget(book, result[1]) : null;
      if (!target || !target.file) {
        showEmpty();  // 感想が無い本のページは作らない
        return;
      }
      return fetch("bookshelf/notes/" + target.file, { cache: "no-cache" }).then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.text();
      }).then(function (text) {
        var body = document.getElementById("note-body");
        renderNote(text, body);
        if (!body.children.length) {
          showEmpty();  // 中身が空なら、空のページは出さない
          return;
        }
        document.getElementById("note-cover").appendChild(Shelf.coverFor(book, false));
        document.getElementById("note-title").textContent = book.title || "";
        var year = String(book.publishedDate || "").slice(0, 4);
        document.getElementById("note-meta").textContent = [Shelf.authorsOf(book).join("、"), book.publisher, year].filter(Boolean).join(" / ");
        document.getElementById("note-date").textContent = target.updated;
        document.title = (book.title || "BOOKSHELF") + "｜SAKATA YUSHI";
        articleEl.hidden = false;
      });
    })
    .catch(function (error) {
      console.error(error);
      showEmpty("感想を読み込めませんでした。");
    });
})();
</script>

</body>
</html>
